<script id="wx6-js">
/* ============================================================
   وثيق — الطبقة (٦): استخراج رواتب المشاريع من ملف الكباتن
   الأعمدة: captain_started_at, supplier_id, Supplier Name, captain_id,
   shift_id, captain_name, branch_name, wallet_transaction_note,
   delivery_returning_perc, Working Hour, Orders, Dymanic Per Hour,
   Suppliers costs, Bouns Ftr, Adjustments +-, Net Cost, Vat 15%, Total Dues
   → عرض كامل التفاصيل للتعميد ثم التطبيق على كروت الموظفين.
   ============================================================ */
(function(){
  if(window.__wx6) return; window.__wx6=true;

  function E(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
  function N(v){
    if(v==null||v==='') return 0;
    if(typeof v==='number') return isFinite(v)?v:0;
    var s=String(v).replace(/[\s,ريال SAR]/gi,'');
    var neg=/^\(.*\)$/.test(s); s=s.replace(/[()]/g,'');
    var n=parseFloat(s.replace(/[^0-9.\-]/g,''));
    if(isNaN(n)) return 0;
    return neg?-n:n;
  }
  function F(n){ return (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function T(m){ try{ toast(m); }catch(e){} }
  function IQ(x){ return String(x==null?'':x).replace(/\.0$/,'').replace(/[^0-9]/g,''); }
  function nrm(s){
    return String(s==null?'':s).toLowerCase()
      .replace(/[\u064B-\u0652\u0670]/g,'')
      .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ؤئ]/g,'ء')
      .replace(/[^a-z\u0621-\u064A0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function r2(n){ return Math.round((Number(n)||0)*100)/100; }
  function nowISO(){ return new Date().toISOString(); }
  function isAdmin(){
    try{ var r=sessionStorage.getItem('wf_session_v3'); if(!r) return true; var u=JSON.parse(r);
      return !!(u && (u.role==='admin' || (u.perms&&u.perms.finance))); }catch(e){ return true; }
  }
  function meName(){
    try{ var r=sessionStorage.getItem('wf_session_v3'); if(!r) return 'الأدمن'; var u=JSON.parse(r);
      return (u&&(u.name||u.username))||'الأدمن'; }catch(e){ return 'الأدمن'; }
  }
  function prevOf(ym){
    var p=String(ym||'').split('-'); var d=new Date(+p[0], (+p[1]||1)-2, 1);
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
  }

  /* ---------- ترويسات الملف (تتحمّل الأخطاء الإملائية والمسافات) ---------- */
  function hk(h){ return String(h==null?'':h).toLowerCase().replace(/[\s_\-%+.'"()]/g,''); }
  var HDR={
    started:['captainstartedat','startedat','shiftdate','date'],
    supid  :['supplierid'],
    sup    :['suppliername','supplier'],
    cid    :['captainid','captainno','driverid','captaincode'],
    shift  :['shiftid','shift'],
    cname  :['captainname','captain','drivername','name'],
    branch :['branchname','branch'],
    note   :['wallettransactionnote','note','notes'],
    ret    :['deliveryreturningperc','returningperc','returnperc'],
    hours  :['workinghour','workinghours','hours'],
    orders :['orders','ordercount','totalorders'],
    perh   :['dymanicperhour','dynamicperhour','perhour'],
    cost   :['supplierscosts','suppliercosts','supplierscost','supplierscost'],
    bonus  :['bounsftr','bonusftr','bonus','bouns'],
    adj    :['adjustments','adjustment'],
    net    :['netcost','net'],
    vat    :['vat15','vat'],
    total  :['totaldues','totaldue','total']
  };
  function mapHeader(row){
    var m={}, keys=Object.keys(HDR);
    row.forEach(function(cell,i){
      var k=hk(cell); if(!k) return;
      keys.forEach(function(f){
        if(m[f]!=null) return;
        if(HDR[f].indexOf(k)>=0) m[f]=i;
      });
    });
    return m;
  }
  function excelDate(v){
    if(v==null||v==='') return null;
    if(typeof v==='number' && v>20000 && v<80000){
      var d=new Date(Math.round((v-25569)*86400000));
      return isNaN(d)?null:d;
    }
    var s=String(v).trim();
    var m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if(m) return new Date(+m[1], +m[2]-1, +m[3]);
    m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
    if(m) return new Date(+m[3], +m[2]-1, +m[1]);
    var d2=new Date(s); return isNaN(d2)?null:d2;
  }
  function ymOf(d){ return d ? (d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)) : ''; }
  function dayOf(d){ return d ? (ymOf(d)+'-'+('0'+d.getDate()).slice(-2)) : ''; }

  /* ---------- قراءة الملف (Excel أو CSV) ---------- */
  function csvRows(text){
    var rows=[], cur=[], f='', q=false;
    text=String(text).replace(/^\ufeff/,'');
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(q){
        if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; }
        else f+=c;
      } else {
        if(c==='"') q=true;
        else if(c===','){ cur.push(f); f=''; }
        else if(c==='\n'){ cur.push(f); rows.push(cur); cur=[]; f=''; }
        else if(c!=='\r') f+=c;
      }
    }
    if(f!==''||cur.length){ cur.push(f); rows.push(cur); }
    return rows;
  }
  function readFile(file){
    return new Promise(function(res,rej){
      var ext=(file.name.split('.').pop()||'').toLowerCase();
      var rd=new FileReader();
      rd.onerror=function(){ rej('تعذّرت قراءة الملف'); };
      if(ext==='csv'){
        rd.onload=function(){ res(csvRows(rd.result)); };
        rd.readAsText(file,'utf-8');
      } else {
        rd.onload=function(){
          if(typeof XLSX==='undefined' || !XLSX.read){
            rej('مكتبة Excel غير محمّلة (لا يوجد اتصال) — صدّر الملف بصيغة CSV وارفعه'); return;
          }
          try{
            var wb=XLSX.read(new Uint8Array(rd.result),{type:'array',cellDates:false});
            var ws=wb.Sheets[wb.SheetNames[0]];
            res(XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}));
          }catch(err){ rej('تعذّرت قراءة ملف Excel'); }
        };
        rd.readAsArrayBuffer(file);
      }
    });
  }

  /* ---------- التحليل والتجميع ---------- */
  var _data=null, _links={}, _file='';
  function parse(rows, fname){
    var hi=-1, map=null;
    for(var i=0;i<Math.min(rows.length,15);i++){
      var m=mapHeader(rows[i]||[]);
      if(m.cid!=null || (m.cname!=null && m.net!=null)){ hi=i; map=m; break; }
    }
    if(hi<0) throw 'لم يتم التعرّف على ترويسة ملف الكباتن (captain_id / Net Cost)';

    var G={}, order=[], badRows=0, dupShift=0, seenShift={}, minD=null, maxD=null, months={};
    for(var r=hi+1;r<rows.length;r++){
      var row=rows[r]||[]; if(!row.length) continue;
      function g(f){ return map[f]!=null ? row[map[f]] : ''; }
      var cid=String(g('cid')||'').replace(/\.0$/,'').trim();
      var nm=String(g('cname')||'').trim();
      if(!cid && !nm){ continue; }
      var d=excelDate(g('started'));
      if(d){ if(!minD||d<minD) minD=d; if(!maxD||d>maxD) maxD=d; var ym=ymOf(d); months[ym]=(months[ym]||0)+1; }
      var key=cid||('n:'+nrm(nm));
      var G0=G[key];
      if(!G0){
        G0=G[key]={ key:key, cid:cid, names:{}, branches:{}, sups:{}, notes:{}, shifts:0, days:{}, byDay:{},
                    hours:0, orders:0, cost:0, bonus:0, adj:0, net:0, vat:0, total:0, ret:[], perh:[],
                    first:'', last:'', dup:0 };
        order.push(key);
      }
      if(nm) G0.names[nm]=(G0.names[nm]||0)+1;
      var br=String(g('branch')||'').trim(); if(br) G0.branches[br]=(G0.branches[br]||0)+1;
      var sp=String(g('sup')||'').trim();   if(sp) G0.sups[sp]=(G0.sups[sp]||0)+1;
      var nt=String(g('note')||'').trim();  if(nt) G0.notes[nt]=1;
      var sh=String(g('shift')||'').trim();
      if(sh){ var sk=key+'|'+sh; if(seenShift[sk]){ G0.dup++; dupShift++; } else seenShift[sk]=1; }
      G0.shifts++;
      var dd=dayOf(d); if(dd){ G0.days[dd]=1; if(!G0.first||dd<G0.first) G0.first=dd; if(!G0.last||dd>G0.last) G0.last=dd; }
      var _h=N(g('hours')), _o=N(g('orders'));
      if(dd){ var _b=G0.byDay[dd]=G0.byDay[dd]||{orders:0,hours:0,n:0}; _b.orders+=_o; _b.hours+=_h; _b.n++; }
      G0.hours += _h;
      G0.orders+= _o;
      G0.cost  += N(g('cost'));
      G0.bonus += N(g('bonus'));
      G0.adj   += N(g('adj'));
      G0.net   += N(g('net'));
      G0.vat   += N(g('vat'));
      G0.total += N(g('total'));
      var rp=N(g('ret')); if(rp) G0.ret.push(rp);
      var ph=N(g('perh')); if(ph) G0.perh.push(ph);
      if(!cid && !nm) badRows++;
    }
    var caps=order.map(function(k){
      var g0=G[k];
      function top(o){ var b='',n=-1; Object.keys(o).forEach(function(x){ if(o[x]>n){n=o[x];b=x;} }); return b; }
      ['hours','cost','bonus','adj','net','vat','total'].forEach(function(f){ g0[f]=r2(g0[f]); });
      g0.name   = top(g0.names);
      g0.branch = top(g0.branches);
      g0.sup    = top(g0.sups);
      g0.note   = Object.keys(g0.notes).slice(0,3).join(' · ');
      g0.dayCnt = Object.keys(g0.days).length;
      g0.avgRet = g0.ret.length ? (g0.ret.reduce(function(s,x){return s+x;},0)/g0.ret.length) : 0;
      g0.avgPh  = g0.perh.length? (g0.perh.reduce(function(s,x){return s+x;},0)/g0.perh.length) : 0;
      /* فحوصات */
      g0.calcNet = g0.cost + g0.bonus + g0.adj;
      g0.netDiff = Math.round((g0.calcNet - g0.net)*100)/100;
      g0.totDiff = Math.round((g0.net + g0.vat - g0.total)*100)/100;
      return g0;
    });
    var period=''; var best=-1;
    Object.keys(months).forEach(function(m){ if(months[m]>best){ best=months[m]; period=m; } });
    return {
      file:fname, rows:rows.length-hi-1, caps:caps, cols:(rows[hi]||[]).map(function(c){return String(c).trim();}),
      period:period, months:months, from:dayOf(minD), to:dayOf(maxD), dupShift:dupShift, badRows:badRows,
      tot:(function(){
        var a=caps.reduce(function(a,c){
          a.hours+=c.hours; a.orders+=c.orders; a.cost+=c.cost; a.bonus+=c.bonus; a.adj+=c.adj;
          a.net+=c.net; a.vat+=c.vat; a.total+=c.total; a.shifts+=c.shifts; return a;
        },{hours:0,orders:0,cost:0,bonus:0,adj:0,net:0,vat:0,total:0,shifts:0});
        ['hours','cost','bonus','adj','net','vat','total'].forEach(function(f){ a[f]=r2(a[f]); });
        return a;
      })()
    };
  }

  /* ---------- المطابقة مع كروت الموظفين ---------- */
  function index(){
    var ix={iq:{}, pid:{}, name:{}, ninja:{}};
    (state.employees||[]).forEach(function(e,i){
      var iq=IQ(e.iqama); if(iq) ix.iq[iq]=i;
      var p=e.project_ids||{};
      Object.keys(p).forEach(function(k){ var v=String(p[k]||'').trim(); if(v) ix.pid[k+'|'+v]=i; });
      var a=nrm(e.name_ar); if(a && ix.name[a]==null) ix.name[a]=i;
      var b=nrm(e.name_en); if(b && ix.name[b]==null) ix.name[b]=i;
      (e.vehicles||[]).forEach(function(v){ var n=String(v.id_ninja||'').trim(); if(n && ix.ninja[n]==null) ix.ninja[n]=i; });
    });
    return ix;
  }
  function fuzzy(nm, ix){
    var t=nrm(nm).split(' ').filter(function(x){ return x.length>1; });
    if(t.length<2) return -1;
    var hit=-1, cnt=0;
    Object.keys(ix.name).forEach(function(k){
      var kt=k.split(' ');
      var all=t.every(function(x){ return kt.indexOf(x)>=0; });
      if(all){ cnt++; hit=ix.name[k]; }
    });
    return cnt===1 ? hit : -1;
  }
  function match(caps, project){
    var ix=index();
    caps.forEach(function(c){
      c.idx=-1; c.how='';
      if(_links[c.key]!=null){ c.idx=_links[c.key]; c.how='ربط يدوي'; return; }
      var byPid = ix.pid[project+'|'+c.cid];
      if(byPid!=null){ c.idx=byPid; c.how='مرتبط سابقاً'; return; }
      var iq=IQ(c.cid);
      if(iq.length>=9 && ix.iq[iq]!=null){ c.idx=ix.iq[iq]; c.how='رقم الإقامة'; return; }
      if(c.cid && ix.ninja[c.cid]!=null){ c.idx=ix.ninja[c.cid]; c.how='معرّف الأسطول'; return; }
      var byName=ix.name[nrm(c.name)];
      if(byName!=null){ c.idx=byName; c.how='الاسم'; return; }
      var fz=fuzzy(c.name, ix);
      if(fz>=0){ c.idx=fz; c.how='الاسم (تقريبي)'; return; }
    });
  }

  /* ---------- السلف والعهد (لحساب الصافي للصرف) ---------- */
  function openAdv(e){
    return (((e.finance||{}).advances)||[]).reduce(function(s,a){
      return ((a.status||'new')!=='settled' && !a.settled_period) ? s+N(a.amount) : s; },0);
  }
  function custodyDue(e){
    var stopped=(e.employment_status==='stopped' || String(e.status_label||'').indexOf('متوقف')>=0);
    return (e.custody||[]).reduce(function(s,c){
      if(c.settled_period) return s;
      if(c.status==='deducted') return s+N(c.value);
      if(c.status==='held' && stopped) return s+N(c.value);
      return s;
    },0);
  }

    document.getElementById('wx6Modal').innerHTML=
      '<div class="wf-head"><div class="nm">'+t+'</div><div class="x" onclick="wx6CloseW()">✕</div></div>'
      +'<div class="wf-body">'+b2+'</div><div class="wf-foot">'+f+'</div>';
    s.classList.add('on');
  }
  window.wx6CloseW=function(){ var s=document.getElementById('wx6Scrim'); if(s) s.classList.remove('on'); };
  window.wx6Cancel=function(){ _data=null; _links={}; var b=document.getElementById('wx6Box'); if(b) b.innerHTML=''; };

  /* ---------- التصدير قبل التعميد ---------- */
  window.wx6Export=function(){
    if(!_data) return;
    var proj=(document.getElementById('wx6Proj')||{}).value||'';
    var head=['captain_id','اسم الكابتن','الموظف','رقم الإقامة','طريقة المطابقة','الفرع','ورديات','أيام','ساعات','طلبات',
              'تكلفة المورد','حوافز الملف','تعديلات الملف','صافي الملف','الضريبة','الإجمالي',
              'آلية العقد','راتب العقد','خصومات العقد','هامش الشركة',
              'سلف قائمة','خصم عهد','الصافي للصرف','ملاحظة','فحص'];
    var body=_data.caps.map(function(c){
      var e=c.idx>=0?state.employees[c.idx]:null;
      var cc=c.calc||{salary:c.net, dedTotal:0, margin:0, label:''};
      return [c.cid, c.name, e?(e.name_ar||e.name_en||''):'— غير مرتبط —', e?e.iqama:'', c.how||'', c.branch,
              c.shifts, c.dayCnt, c.hours, c.orders, c.cost, c.bonus, c.adj, c.net, c.vat, c.total,
              cc.label||'', cc.salary, cc.dedTotal, cc.margin,
              e?openAdv(e):'', e?custodyDue(e):'', e?r2(cc.salary-openAdv(e)-custodyDue(e)):'', c.note,
              Math.abs(c.netDiff)>0.5?('فرق صافي '+c.netDiff):(c.dup?'وردية مكررة':'سليم')];
    });
    var t=_data.tot;
    body.push(['','الإجمالي','','','','',t.shifts,'',t.hours,t.orders,t.cost,t.bonus,t.adj,t.net,t.vat,t.total,'','','','','','','','','']);
    var csv='\ufeff'+[head].concat(body).map(function(r){
      return r.map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
    var b=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='مراجعة-رواتب-'+(proj||'المشروع')+'-'+((document.getElementById('wx6Per')||{}).value||'')+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    T('تم تصدير تقرير المراجعة');
  };

  /* ---------- الاعتماد والتطبيق ---------- */
  window.wx6Approve=function(){
    if(!_data) return;
    if(!isAdmin()){ T('التعميد متاح للموظف الاداري فقط'); return; }
    var proj=(document.getElementById('wx6Proj')||{}).value||'';
    var per =(document.getElementById('wx6Per') ||{}).value||'';
    if(!proj){ T('اختر المشروع أولاً'); return; }
    if(!per){ T('حدّد فترة الراتب'); return; }
    var mt=_data.caps.filter(function(c){ return c.idx>=0; });
    if(!mt.length){ T('لا يوجد كباتن مرتبطون'); return; }
    var um=_data.caps.length-mt.length;
    var sum=mt.reduce(function(s,c){ return s+c.net; },0);
    openW('تأكيد التعميد',
      '<div style="font-size:14px;line-height:2">سيتم تطبيق رواتب <b>'+proj+'</b> لفترة <b>'+per+'</b> على '
      +'<b>'+mt.length+'</b> كرت موظف، بإجمالي صافي <b>'+F(sum)+'</b> ريال.'
      +(um?('<br>سيتم <b>تجاهل '+um+'</b> كابتن غير مرتبط.'):'')
      +'<br>سيُؤرشَف الكرت المالي السابق ويُستبدل بكرت هذه الفترة.'
      +'<br><span style="color:var(--muted);font-size:12.5px">المُعمِّد: '+E(meName())+'</span></div>',
      '<button class="btn ghost" onclick="wx6CloseW()">رجوع</button><button class="btn" onclick="wx6Commit()">✅ تعميد وتطبيق</button>');
  };
  window.wx6Commit=function(){
    var proj=(document.getElementById('wx6Proj')||{}).value||'';
    var CT=(window.wxContract? window.wxContract.get(proj) : null);
    var per =(document.getElementById('wx6Per') ||{}).value||'';
    var oArch=!!(document.getElementById('wx6o-arch')||{}).checked;
    var oLink=!!(document.getElementById('wx6o-link')||{}).checked;
    var oProj=!!(document.getElementById('wx6o-proj')||{}).checked;
    var oAdv =!!(document.getElementById('wx6o-keepadv')||{}).checked;
    var by=meName(), at=nowISO();
    var rep={cards:0, arch:0, links:0, skipped:0, net:0, pay:0, adv:0, cus:0, margin:0, rows:[]};

    _data.caps.forEach(function(c){
      if(c.idx<0){ rep.skipped++; return; }
      var e=state.employees[c.idx];
      var old=e.finance ? clone(e.finance) : null;

      /* أرشفة الكرت السابق */
      if(oArch && old && (N(old.net) || N(old.base))){
        var op=old.period||'2026-05';
        if(op!==per){
          e.finance_periods=e.finance_periods||[];
          var dup=e.finance_periods.some(function(p){ return p.period===op && N(p.net)===N(old.net); });
          if(!dup){ old.period=op; old._archived=true; old.archived_at=at; e.finance_periods.push(old); rep.arch++; }
        }
      }
      var adv = oAdv ? ((((e.finance||{}).advances)||[]).slice()) : [];
      var advSum=r2(openAdv(e)), cusSum=r2(custodyDue(e));

      var cc=c.calc;
      var cBase=r2(cc.earn), cBonus=r2(cc.bonus+cc.tier+(cc.orderBonus||0)), cNet=r2(cc.salary);
      var cDed=r2(cNet-cBase-cBonus);   /* تعديلات الملف + خصومات العقد + فرق الضمان/السقف */
      e.finance={
        base:cBase, days:String(c.dayCnt), bonus:cBonus, advance:0, accident:0,
        deduction:cDed, net:cNet,
        iban:e.iban||'', account:e.name_ar||'', name:e.name_ar||'',
        note:c.note||'', project:proj, period:per, source:'رواتب '+proj+' · '+per,
        advances:adv,
        /* أرقام الملف كما هي — للتدقيق */
        file_cost:r2(c.cost), file_bonus:r2(c.bonus), file_adjust:r2(c.adj), file_net:r2(c.net),
        captain_id:String(c.cid||''), branch:c.branch||'', supplier:c.sup||'',
        shifts:c.shifts, hours:r2(c.hours), orders:c.orders,
        per_hour:r2(c.avgPh), returning_perc:r2(c.avgRet),
        vat:r2(c.vat), total_dues:r2(c.total),
        /* العقد */
        contract_name:cc.name||'', contract_mode:cc.mode||'file', contract_label:cc.label||'',
        contract_note:cc.note||'', work_days:cc.workDays||0, extra_orders:r2(cc.extraOrders||0),
        order_bonus:r2(cc.orderBonus||0), short_orders:r2(cc.shortOrders||0), order_penalty:r2(cc.orderPenalty||0),
        target_orders:N(CT&&CT.target_orders), full_days:N(CT&&CT.full_days),
        contract_deds:cc.deds||[], contract_ded_total:r2(cc.dedTotal), contract_tier_bonus:r2(cc.tier),
        guarantee_topup:r2(cc.guarantee), cap_cut:r2(cc.capCut), margin:r2(cc.margin),
        adv_open:advSum, custody_due:cusSum, payable:r2(cNet-advSum-cusSum),
        approved_by:by, approved_at:at
      };
      if(oLink && c.cid){ e.project_ids=e.project_ids||{}; if(e.project_ids[proj]!==String(c.cid)){ e.project_ids[proj]=String(c.cid); rep.links++; } }
      if(oProj && proj && e.project!==proj){ e.project=proj; }
      e.updatedAt=at;
      rep.cards++; rep.net=r2(rep.net+cNet); rep.adv=r2(rep.adv+advSum); rep.cus=r2(rep.cus+cusSum);
      rep.pay=r2(rep.pay+cNet-advSum-cusSum); rep.margin=r2((rep.margin||0)+cc.margin);
      rep.rows.push([e.iqama, e.name_ar||'', proj, per, c.shifts, c.dayCnt, r2(c.hours), c.orders,
                     r2(c.cost), r2(c.bonus), r2(c.adj), r2(c.net), r2(c.vat), r2(c.total),
                     cc.label||'', cBase, cBonus, r2(cc.dedTotal), cNet, r2(cc.margin),
                     advSum, cusSum, r2(cNet-advSum-cusSum), by]);
    });

    try{ recomputeStats(); }catch(e){}
    try{ persist(); }catch(e){}
    try{ fillProjects(); }catch(e){}
    try{ renderAll(); }catch(e){}
    window.__wx6rep=rep;
    wx6CloseW();
    openW('✅ تم التعميد والتطبيق',
      '<div class="wx6-tiles">'
      +'<div><b>'+rep.cards+'</b><span>كرت مالي محدّث</span></div>'
      +'<div><b>'+rep.arch+'</b><span>كرت مؤرشف</span></div>'
      +'<div><b>'+rep.links+'</b><span>ربط جديد</span></div>'
      +'<div><b>'+rep.skipped+'</b><span>متجاهَل</span></div>'
      +'</div>'
      +'<div class="wx6-tiles money">'
      +'<div><b>'+F(rep.net)+'</b><span>إجمالي رواتب العقد</span></div>'
      +'<div><b>'+F(rep.margin)+'</b><span>هامش الشركة</span></div>'
      +'<div><b>'+F(rep.adv)+'</b><span>سلف قائمة</span></div>'
      +'<div><b>'+F(rep.cus)+'</b><span>خصم عهد</span></div>'
      +'<div><b>'+F(rep.pay)+'</b><span>الصافي للصرف</span></div>'
      +'</div>'
      +'<div class="wx6-mut">💾 حُفِظت الكروت محلياً. عند صرف الرواتب فعلياً اضغط «تسوية السلف والعهد» لإيقاف خصمها في الشهور القادمة.</div>',
      '<button class="btn ghost" onclick="wx6ExportApplied()">⬇️ تصدير كشف الصرف</button>'
      +(rep.adv||rep.cus ? '<button class="btn ghost" onclick="wx6Settle(\''+per+'\')">✅ تسوية السلف والعهد</button>' : '')
      +'<button class="btn" onclick="wx6CloseW();wx6Cancel()">تم</button>');
    T('✅ تم تعميد رواتب '+proj+' — '+rep.cards+' كرت');
  };
  window.wx6ExportApplied=function(){
    var rep=window.__wx6rep; if(!rep) return;
    var head=['رقم الإقامة','الاسم','المشروع','الفترة','ورديات','أيام','ساعات','طلبات',
              'تكلفة المورد','حوافز الملف','تعديلات الملف','صافي الملف','الضريبة','الإجمالي',
              'آلية العقد','أساسي العقد','حوافز العقد','خصومات العقد','راتب الموظف','هامش الشركة',
              'سلف قائمة','خصم عهد','الصافي للصرف','المُعمِّد'];
    var csv='\ufeff'+[head].concat(rep.rows).map(function(r){
      return r.map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
    var b=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='كشف-صرف-الرواتب.csv'; document.body.appendChild(a); a.click(); a.remove();
    T('تم تصدير كشف الصرف');
  };
  window.wx6Settle=function(per){
    var n=0, m=0;
    (state.employees||[]).forEach(function(e){
      if(!e.finance || e.finance.period!==per) return;
      (((e.finance||{}).advances)||[]).forEach(function(a){
        if((a.status||'new')!=='settled' && !a.settled_period){ a.status='settled'; a.settled_period=per; a.settled_at=nowISO(); n++; }
      });
      (e.custody||[]).forEach(function(c){
        if(c.settled_period) return;
        var stopped=(e.employment_status==='stopped' || String(e.status_label||'').indexOf('متوقف')>=0);
        if(c.status==='deducted' || (c.status==='held' && stopped)){ c.status='deducted'; c.settled_period=per; m++; }
      });
    });
    try{ recomputeStats(); persist(); renderAll(); }catch(e){}
    wx6CloseW(); wx6Cancel();
    T('✅ تسوية '+n+' سلفة و'+m+' عهدة على فترة '+per);
  };

  /* ============================================================
     ربط الرفع بتبويب «ملفات الرواتب»
     ============================================================ */
  function wire(){
    var sec=document.getElementById('view-wf_payroll'); if(!sec) return;
    var up=sec.querySelector('#wfpUpload'); if(!up || up.__wx6) return;
    up.__wx6=true;
    up.setAttribute('accept','.xlsx,.xls,.csv');
    var card=up.closest('.wfp-card');
    if(card){
      var p=card.querySelector('p');
      if(p) p.innerHTML='ارفع ملف رواتب المشروع (Excel / CSV) بأعمدة الكباتن — يُقرأ ويُجمَّع لكل كابتن، '
        +'وتُعرض <b>كل التفاصيل للمراجعة والتعميد</b> قبل تطبيقه على كروت الموظفين.'
        +'<div class="wx6-cols">'+['captain_started_at','supplier_id','Supplier Name','captain_id','shift_id','captain_name',
          'branch_name','wallet_transaction_note','delivery_returning_perc','Working Hour','Orders','Dymanic Per Hour',
          'Suppliers costs','Bouns Ftr','Adjustments +-','Net Cost','Vat 15%','Total Dues']
          .map(function(c){ return '<span class="wx6-col">'+E(c)+'</span>'; }).join('')+'</div>';
    }
    up.onchange=function(){
      var f=up.files && up.files[0]; if(!f) return;
      if(!isAdmin()){ T('رفع ملفات الرواتب متاح للموظف الاداري فقط'); return; }
      _file=f.name; _links={};
      T('⏳ جارٍ قراءة ' + f.name);
      readFile(f).then(function(rows){
        try{ _data=parse(rows, f.name); }
        catch(err){ T(typeof err==='string'?err:'تعذّر تحليل الملف'); return; }
        if(!_data.caps.length){ T('لم يُعثر على بيانات كباتن في الملف'); return; }
        wx6Render();
        var b=document.getElementById('wx6Box'); if(b) b.scrollIntoView({behavior:'smooth', block:'start'});
      }).catch(function(err){ T(typeof err==='string'?err:'تعذّرت قراءة الملف'); });
      up.value='';
    };
  }

  /* ---------- تفاصيل راتب المشروع داخل الكرت المالي ---------- */
  function finBox(){
    var pane=document.getElementById('pane-fin');
    if(!pane || document.getElementById('wx6Fin') || state.current==null) return;
    var e=state.employees[state.current]; if(!e || !e.finance) return;
    var f=e.finance;
    if(!(f.hours || f.orders || f.vat || f.captain_id)) return;
    var ctd=(f.contract_deds||[]).map(function(x){ return E(x.name)+' −'+F(x.amount); }).join(' · ');
    var advS=openAdv(e), cusS=custodyDue(e), payable=N(f.net)-advS-cusS;
    var d=document.createElement('div');
    d.className='wx6-fin'; d.id='wx6Fin';
    d.innerHTML='<div class="hd">📊 تفاصيل راتب المشروع — '+E(f.project||'')+' · '+E(f.period||'')+'</div>'
      +'<div class="wx6-fg">'
      +'<div class="c"><div class="k">captain_id</div><div class="v">'+E(f.captain_id||'—')+'</div></div>'
      +'<div class="c"><div class="k">الفرع</div><div class="v">'+E(f.branch||'—')+'</div></div>'
      +'<div class="c"><div class="k">ورديات</div><div class="v">'+F(f.shifts)+'</div></div>'
      +'<div class="c"><div class="k">ساعات عمل</div><div class="v">'+F(f.hours)+'</div></div>'
      +'<div class="c"><div class="k">طلبات</div><div class="v">'+F(f.orders)+'</div></div>'
      +'<div class="c"><div class="k">متوسط الساعة</div><div class="v">'+F(f.per_hour)+'</div></div>'
      +'<div class="c"><div class="k">ضريبة ١٥٪</div><div class="v">'+F(f.vat)+'</div></div>'
      +'<div class="c"><div class="k">إجمالي المستحق</div><div class="v">'+F(f.total_dues)+'</div></div>'
      +'</div>'
      +(f.contract_note ? ('<div class="wx6-mut" style="margin-top:9px">🧾 <b>احتساب الراتب:</b> '+E(f.contract_note)
          +(N(f.order_bonus)?('<br>🎁 <b>'+F(f.extra_orders)+'</b> طلب زائد عن الهدف → بونص <b>'+F(f.order_bonus)+'</b> ريال'):'')
          +(N(f.order_penalty)?('<br>⛔ <b>'+F(f.short_orders)+'</b> طلب ناقص عن الهدف → خصم <b>'+F(f.order_penalty)+'</b> ريال'):'')
          +'</div>') : '')
      +(f.contract_mode ? ('<div class="wx6-mut" style="margin-top:6px">📜 <b>'+E(f.contract_name||'العقد')+'</b> — '+E(f.contract_label||'')
          +' · صافي الملف <b>'+F(f.file_net)+'</b> → راتب الموظف <b>'+F(f.net)+'</b> · هامش الشركة <b>'+F(f.margin)+'</b>'
          +(ctd?('<br>خصومات العقد: '+ctd):'')
          +(N(f.guarantee_topup)?('<br>فرق الحد الأدنى المضمون: +'+F(f.guarantee_topup)):'')
          +(N(f.cap_cut)?('<br>تخفيض السقف الأعلى: −'+F(f.cap_cut)):'')+'</div>') : '')
      +'<div class="wx6-pay"><span>💰 الصافي للصرف = '+F(f.net)+' − سلف '+F(advS)+' − عهد '+F(cusS)+'</span>'
      +'<span>'+F(payable)+' ريال</span></div>'
      +(f.approved_by?('<div class="wx6-mut" style="margin-top:6px">✅ مُعتمد بواسطة <b>'+E(f.approved_by)+'</b>'
        +(f.approved_at?(' — '+E(String(f.approved_at).slice(0,10))):'')+'</div>'):'');
    var anchor=document.getElementById('wx5Fin');
    if(anchor && anchor.nextSibling) pane.insertBefore(d, anchor.nextSibling);
    else if(anchor) pane.appendChild(d);
    else pane.insertBefore(d, pane.firstChild);
  }
  function observe(){
    var m=document.getElementById('modal'); if(!m || m.__wx6) return;
    m.__wx6=true;
    new MutationObserver(function(){ try{ finBox(); }catch(e){} }).observe(m,{childList:true, subtree:true});
  }

  /* ---------- قائمة البيانات ---------- */
  function menu(){
    var dm=document.getElementById('dataMenu'); if(!dm || document.getElementById('wx6Menu')) return;
    var sep=document.createElement('div'); sep.className='sep';
    var b=document.createElement('button'); b.id='wx6Menu'; b.innerHTML='🧾 استخراج رواتب المشاريع';
    b.onclick=function(){
      try{ closeMenus(); }catch(e){}
      if(!isAdmin()){ T('متاح للموظف الاداري فقط'); return; }
      try{ window.go('wf_payroll'); }catch(e){}
      setTimeout(function(){ var u=document.getElementById('wfpUpload'); if(u) u.click(); }, 250);
    };
    dm.appendChild(sep); dm.appendChild(b);
  }

  function boot(){ wire(); observe(); menu(); finBox(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  setInterval(function(){ try{ wire(); observe(); menu(); finBox(); }catch(e){} }, 2500);
})();
</script>

.wx7-prev{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:14px;padding:12px 14px;margin-top:12px}
.wx7-prev .h{font-size:12px;opacity:.9;margin-bottom:8px}
.wx7-prev .in{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.wx7-prev .in input{width:82px;padding:5px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:12.5px}
.wx7-prev .in input::placeholder{color:rgba(255,255,255,.7)}

.wx7-prev .out .k{font-size:10.5px;opacity:.85}
.wx7-prev .out .v{font-size:14px;font-weight:700;margin-top:1px}
.wx7-note{font-size:11.5px;color:var(--muted);line-height:1.8;margin-top:8px}
</style>

<script id="wx7-js">
/* ============================================================
   وثيق — الطبقة (٧): عقود المشاريع
   ربط آلية حساب الرواتب بعقد كل مشروع:
   آلية الاحتساب (ملف/ساعة/طلب/ساعة+طلب/نسبة/ثابت) + شرائح حوافز
   + حد أدنى مضمون + سقف + خصومات ثابتة → راتب الموظف وهامش الشركة.
   ============================================================ */
(function(){
  if(window.__wx7) return; window.__wx7=true;

  function E(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
  function N(v){ var n=parseFloat(String(v==null?'':v).replace(/[, ]/g,'')); return isNaN(n)?0:n; }
  function r2(n){ return Math.round((Number(n)||0)*100)/100; }
  function F(n){ return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
  function T(m){ try{ toast(m); }catch(e){} }
  function LS(){ return window.wfLocalStore || {getData:function(){return null;}, setData:function(){return false;}}; }
  function isAdmin(){
    try{ var r=sessionStorage.getItem('wf_session_v3'); if(!r) return true; var u=JSON.parse(r);
      return !!(u && (u.role==='admin' || (u.perms&&u.perms.finance))); }catch(e){ return true; }
  }

  var KEY='contracts';
  function all(){ var o=LS().getData(KEY); return (o&&typeof o==='object')?o:{}; }
  /* عقد نينجا الافتراضي — يُضاف مرة واحدة إن لم يوجد عقد للمشروع */
  (function seedNinja(){
    try{
      var o=(LS().getData(KEY)&&typeof LS().getData(KEY)==='object')?LS().getData(KEY):{};
      if(o.NINJA || (LS().getData('wx7_seed_ninja_v2'))) return;
      o.NINJA={ project:'NINJA', name:'عقد نينجا', contract_no:'', party:'', start:'', end:'',
        mode:'monthly', monthly_salary:2500, full_days:26, day_min_hours:12, target_orders:650,
        bonus_per_order:0, penalty_per_order:0, prorate:true,
        day_rate:0, target_basis:'day', hour_rate:0, order_rate:0, fixed_base:0, share_perc:0, vat:15,
        use_file_bonus:true, use_file_adjust:true, min_guarantee:0, min_hours:0, min_days:0, max_cap:0,
        tiers:[], deductions:[], notes:'أُضيف تلقائياً', updatedAt:new Date().toISOString() };
      LS().setData(KEY,o); LS().setData('wx7_seed_ninja_v2',1);
    }catch(e){}
  })();
  function get(project){ if(!project) return null; var o=all(); return o[project]||null; }
  function put(project, ct){ var o=all(); o[project]=ct; LS().setData(KEY,o); }
  function del(project){ var o=all(); delete o[project]; LS().setData(KEY,o); }

  var MODES={
    daily :'يوم عمل + هدف طلبات + بونص للطلب الزائد',
    monthly:'راتب شهري لعدد أيام دوام + هدف طلبات وساعات',
    file  :'حسب الملف — صافي التكلفة كما هو',
    hourly:'حسب ساعة العمل',
    orders:'حسب عدد الطلبات',
    hybrid:'ساعات + طلبات',
    share :'نسبة من صافي الملف',
    fixed :'راتب ثابت'
  };
  var BASIS={ day:'الهدف لكل يوم عمل', period:'الهدف على الفترة كاملة' };
  var APPLIES={ all:'كل موظفي المشروع', vehicle:'أصحاب المركبات فقط', car:'سائقي السيارات', motorcycle:'سائقي الدراجات' };

  function blank(project){
    return { project:project||'', name:'عقد '+(project||''), contract_no:'', party:'', start:'', end:'',
             mode:'daily', day_rate:0, target_orders:0, target_basis:'day', bonus_per_order:0,
             penalty_per_order:0, day_min_hours:0,
             monthly_salary:0, full_days:0, prorate:true,
             hour_rate:0, order_rate:0, fixed_base:0, share_perc:0, vat:15,
             use_file_bonus:true, use_file_adjust:true,
             min_guarantee:0, min_hours:0, min_days:0, max_cap:0,
             tiers:[], deductions:[], notes:'', updatedAt:'' };
  }

  /* ---------- محرّك الحساب ---------- */
  function applies(d, emp){
    var a=d.applies||'all';
    if(a==='all') return true;
    if(!emp) return false;
    var hasVeh=(emp.vehicles||[]).some(function(v){ return v.active; });
    if(a==='vehicle') return hasVeh;
    if(a==='car') return hasVeh && emp.category==='car';
    if(a==='motorcycle') return hasVeh && emp.category==='motorcycle';
    return true;
  }
  /* cap = تجميعة الكابتن من الملف {net,bonus,adj,hours,orders,dayCnt} */
  function calc(ct, cap, emp){
    var fileNet=r2(N(cap&&cap.net)), fBonus=N(cap&&cap.bonus), fAdj=N(cap&&cap.adj);
    var hours=N(cap&&cap.hours), orders=N(cap&&cap.orders), days=N(cap&&cap.dayCnt);
    if(!ct){
      return { has:false, mode:'file', label:'بلا عقد — صافي الملف', earn:fileNet, bonus:0, tier:0, adjust:0,
               workDays:0, extraOrders:0, orderBonus:0, shortOrders:0, orderPenalty:0, note:'صافي الملف',
               guarantee:0, capCut:0, deds:[], dedTotal:0, gross:fileNet, salary:fileNet, fileNet:fileNet, margin:0 };
    }
    var m=ct.mode||'file', earn=0, workDays=0, extraOrders=0, orderBonus=0, note='';
    var shortOrders=0, orderPenalty=0;
    if(!days) days=N(cap&&cap.shifts);
    if(m==='daily'){
      var dr=N(ct.day_rate), tgt=N(ct.target_orders), bpo=N(ct.bonus_per_order),
          ppo=N(ct.penalty_per_order), minH=N(ct.day_min_hours), basis=(ct.target_basis||'day');
      var bd=(cap&&cap.byDay)||null, keys=bd?Object.keys(bd):[];
      if(keys.length){
        keys.forEach(function(k){
          var o=bd[k];
          if(minH && N(o.hours)<minH) return;                 /* يوم لم يستوفِ الحد الأدنى للساعات */
          workDays++;
          if(basis==='day'){
            extraOrders += Math.max(0, N(o.orders)-tgt);
            shortOrders += Math.max(0, tgt-N(o.orders));      /* نقص عن الهدف في هذا اليوم */
          }
        });
        if(basis!=='day'){
          extraOrders = Math.max(0, orders - tgt);
          shortOrders = Math.max(0, tgt - orders);
        }
      } else {                                                 /* تقدير: توزيع متساوٍ (المحاكاة) */
        workDays = days;
        var tgtTot = (basis==='day') ? workDays*tgt : tgt;
        extraOrders = Math.max(0, orders - tgtTot);
        shortOrders = Math.max(0, tgtTot - orders);
      }
      earn = workDays*dr;
      orderBonus  = extraOrders*bpo;
      orderPenalty= shortOrders*ppo;
      note = F(workDays)+' يوم × '+F(dr)
           + (orderBonus  ? (' + '+F(extraOrders)+' طلب زائد × '+F(bpo)) : '')
           + (orderPenalty? (' − '+F(shortOrders)+' طلب ناقص × '+F(ppo)) : '');
    }
    else if(m==='monthly'){
      var ms=N(ct.monthly_salary), fd=N(ct.full_days), tgtM=N(ct.target_orders),
          bpoM=N(ct.bonus_per_order), ppoM=N(ct.penalty_per_order), minHM=N(ct.day_min_hours);
      var bdM=(cap&&cap.byDay)||null, ksM=bdM?Object.keys(bdM):[];
      if(ksM.length){
        ksM.forEach(function(k){ if(minHM && N(bdM[k].hours)<minHM) return; workDays++; });
      } else {
        workDays = days;                                 /* بلا تفصيل يومي: كل الأيام تُحتسب */
      }
      var ratio = (fd>0) ? Math.min(1, workDays/fd) : 1; /* لا يتجاوز الراتب الشهري */
      earn = (ct.prorate===false) ? ms : r2(ms*ratio);
      extraOrders  = Math.max(0, orders - tgtM);
      shortOrders  = Math.max(0, tgtM - orders);
      orderBonus   = extraOrders*bpoM;
      orderPenalty = shortOrders*ppoM;
      note = (ct.prorate===false ? ('راتب شهري '+F(ms)) : (F(workDays)+'/'+F(fd)+' يوم × راتب '+F(ms)))
           + (orderBonus  ? (' + '+F(extraOrders)+' طلب زائد × '+F(bpoM)) : '')
           + (orderPenalty? (' − '+F(shortOrders)+' طلب ناقص × '+F(ppoM)) : '');
    }
    else if(m==='hourly'){ earn=hours*N(ct.hour_rate); note=F(hours)+' س × '+F(ct.hour_rate); }
    else if(m==='orders'){ earn=orders*N(ct.order_rate); note=F(orders)+' طلب × '+F(ct.order_rate); }
    else if(m==='hybrid'){ earn=hours*N(ct.hour_rate)+orders*N(ct.order_rate);
                           note=F(hours)+' س × '+F(ct.hour_rate)+' + '+F(orders)+' طلب × '+F(ct.order_rate); }
    else if(m==='share'){  earn=fileNet*N(ct.share_perc)/100; note=F(ct.share_perc)+'٪ من '+F(fileNet); }
    else if(m==='fixed'){  earn=N(ct.fixed_base); note='راتب ثابت'; }
    else {                 earn=fileNet; note='صافي الملف'; }

    var bonus=(ct.use_file_bonus!==false)? fBonus : 0;
    var tier=0;
    (ct.tiers||[]).forEach(function(t){
      var v=(t.metric==='hours')?hours:((t.metric==='days')?days:orders);
      if(v>=N(t.from)) tier=Math.max(tier, N(t.amount));      /* أعلى شريحة محققة */
    });
    var adjust=(ct.use_file_adjust!==false)? fAdj : 0;
    var gross=earn+bonus+tier+orderBonus-orderPenalty+adjust;

    var guarantee=0;
    if(N(ct.min_guarantee)>0){
      var ok=(!N(ct.min_hours)||hours>=N(ct.min_hours)) && (!N(ct.min_days)||days>=N(ct.min_days));
      if(ok && gross<N(ct.min_guarantee)){ guarantee=N(ct.min_guarantee)-gross; gross=N(ct.min_guarantee); }
    }
    var capCut=0;
    if(N(ct.max_cap)>0 && gross>N(ct.max_cap)){ capCut=gross-N(ct.max_cap); gross=N(ct.max_cap); }

    var deds=[], dedTotal=0;
    (ct.deductions||[]).forEach(function(d){
      if(!applies(d,emp)) return;
      var amt=(d.per==='day') ? N(d.amount)*days : N(d.amount);
      if(!amt) return;
      deds.push({name:d.name||'خصم', amount:r2(amt)}); dedTotal+=amt;
    });
    var salary=gross-dedTotal;
    return { has:true, mode:m, label:MODES[m]||m, name:ct.name||('عقد '+ct.project), note:note,
             workDays:workDays, extraOrders:r2(extraOrders), orderBonus:r2(orderBonus),
             shortOrders:r2(shortOrders), orderPenalty:r2(orderPenalty),
             earn:r2(earn), bonus:r2(bonus), tier:r2(tier), adjust:r2(adjust),
             guarantee:r2(guarantee), capCut:r2(capCut), deds:deds, dedTotal:r2(dedTotal),
             gross:r2(gross), salary:r2(salary), fileNet:fileNet, margin:r2(fileNet-salary) };
  }
  function summary(ct){
    if(!ct) return '';
    var m=ct.mode||'file', s=MODES[m]||m;
    if(m==='daily'){
      s='يوم العمل '+F(ct.day_rate)+' ريال · الهدف '+F(ct.target_orders)+' طلب '
        +((ct.target_basis||'day')==='day'?'/يوم':'/الفترة')+' · بونص '+F(ct.bonus_per_order)+' ريال للطلب الزائد';
      if(N(ct.penalty_per_order)) s+=' · خصم '+F(ct.penalty_per_order)+' ريال للطلب الناقص';
      if(N(ct.day_min_hours)) s+=' · يوم العمل ≥ '+F(ct.day_min_hours)+' ساعة';
    }
    if(m==='monthly'){
      s='راتب شهري '+F(ct.monthly_salary)+' ريال لـ '+F(ct.full_days)+' يوم دوام';
      if(N(ct.day_min_hours)) s+=' · اليوم '+F(ct.day_min_hours)+' ساعة';
      if(N(ct.target_orders)) s+=' · هدف '+F(ct.target_orders)+' طلب';
      if(N(ct.bonus_per_order)) s+=' · بونص '+F(ct.bonus_per_order)+'/طلب زائد';
      if(N(ct.penalty_per_order)) s+=' · خصم '+F(ct.penalty_per_order)+'/طلب ناقص';
      if(ct.prorate===false) s+=' · راتب مقطوع';
    }
    if(m==='hourly') s+=' · '+F(ct.hour_rate)+' ريال/ساعة';
    if(m==='orders') s+=' · '+F(ct.order_rate)+' ريال/طلب';
    if(m==='hybrid') s+=' · '+F(ct.hour_rate)+'/ساعة + '+F(ct.order_rate)+'/طلب';
    if(m==='share')  s+=' · '+F(ct.share_perc)+'٪ للسائق';
    if(m==='fixed')  s+=' · '+F(ct.fixed_base)+' ريال';
    if(N(ct.min_guarantee)) s+=' · ضمان '+F(ct.min_guarantee);
    if((ct.tiers||[]).length) s+=' · '+ct.tiers.length+' شريحة حوافز';
    if((ct.deductions||[]).length) s+=' · '+ct.deductions.length+' خصم ثابت';
    return s;
  }

  /* ---------- المحرّر ---------- */
  var _ct=null, _proj='', _after=null;
  function scrim(){
    var s=document.getElementById('wx7Scrim');
    if(!s){
      s=document.createElement('div'); s.className='wf-scrim'; s.id='wx7Scrim';
      s.innerHTML='<div class="wf-modal" id="wx7Modal" style="max-width:720px"></div>';
      document.body.appendChild(s);
      s.addEventListener('click',function(ev){ if(ev.target===s) closeWx7(); });
    }
    return s;
  }
  window.closeWx7=function(){ var s=document.getElementById('wx7Scrim'); if(s) s.classList.remove('on'); };

  function fld(id,label,val,type,ph){
    return '<div class="wf-field"><label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+E(val==null?'':val)+'"'+(ph?' placeholder="'+E(ph)+'"':'')+'></div>';
  }
  function tierRow(t,i){
    t=t||{metric:'orders',from:0,amount:0};
    return '<div class="wx7-line" data-t="'+i+'">'
      +'<select class="tm"><option value="orders"'+(t.metric==='orders'?' selected':'')+'>طلبات</option>'
      +'<option value="hours"'+(t.metric==='hours'?' selected':'')+'>ساعات</option>'
      +'<option value="days"'+(t.metric==='days'?' selected':'')+'>أيام</option></select>'
      +'<span style="font-size:12px;color:var(--muted)">≥</span>'
      +'<input class="tf" type="number" value="'+E(t.from)+'" placeholder="من">'
      +'<span style="font-size:12px;color:var(--muted)">→ حافز</span>'
      +'<input class="ta" type="number" value="'+E(t.amount)+'" placeholder="ريال">'
      +'<button class="wx7-x" data-dt="'+i+'">✕</button></div>';
  }
  function dedRow(d,i){
    d=d||{name:'',amount:0,applies:'all',per:'month'};
    return '<div class="wx7-line" data-d="'+i+'">'
      +'<input class="dn g" value="'+E(d.name)+'" placeholder="اسم البند (إيجار مركبة…)">'
      +'<input class="da" type="number" value="'+E(d.amount)+'" placeholder="ريال">'
      +'<select class="dp"><option value="month"'+(d.per!=='day'?' selected':'')+'>شهري</option>'
      +'<option value="day"'+(d.per==='day'?' selected':'')+'>يومي × الأيام</option></select>'
      +'<select class="dap">'+Object.keys(APPLIES).map(function(k){
          return '<option value="'+k+'"'+((d.applies||'all')===k?' selected':'')+'>'+APPLIES[k]+'</option>'; }).join('')+'</select>'
      +'<button class="wx7-x" data-dd="'+i+'">✕</button></div>';
  }
  function modeFields(ct){
    var m=ct.mode||'file';
    var h='';
    if(m==='daily'){
      h+=fld('ct-day','قيمة يوم العمل (ريال)',ct.day_rate,'number')
        +fld('ct-tgt','الطلبات الهدف',ct.target_orders,'number')
        +'<div class="wf-field"><label>أساس الهدف</label><select id="ct-basis">'
          +Object.keys(BASIS).map(function(k){ return '<option value="'+k+'"'+((ct.target_basis||'day')===k?' selected':'')+'>'+BASIS[k]+'</option>'; }).join('')
        +'</select></div>'
        +fld('ct-bpo','🎁 بونص الطلب بعد الهدف (ريال/طلب)',ct.bonus_per_order,'number')
        +fld('ct-ppo','⛔ خصم الطلب الناقص عن الهدف (ريال/طلب)',ct.penalty_per_order,'number','0 = بلا خصم')
        +fld('ct-dmh','الحد الأدنى لساعات اليوم (اختياري)',ct.day_min_hours,'number','0 = أي يوم فيه عمل')
        +'<div class="wf-field full"><div class="wx7-note">الراتب = (أيام العمل × قيمة اليوم) + (الطلبات الزائدة × بونص الطلب) − (الطلبات الناقصة عن الهدف × خصم الطلب). '
        +'مع «الهدف لكل يوم» يُحسب الزائد والناقص <b>يوماً بيوم</b> من الملف — فقد يجتمع للسائق بونص في أيام وخصم في أيام أخرى. '
        +'ومع «الهدف على الفترة» يُقارَن إجمالي الطلبات بالهدف مرة واحدة.</div></div>';
    }
    if(m==='monthly'){
      h+=fld('ct-msal','💰 الراتب الشهري (ريال)',ct.monthly_salary,'number')
        +fld('ct-fdays','📅 عدد أيام الدوام للراتب الكامل',ct.full_days,'number','مثال: 26')
        +fld('ct-dmh2','⏱️ هدف ساعات اليوم (يوم الدوام)',ct.day_min_hours,'number','مثال: 12')
        +fld('ct-tgtm','🎯 هدف الطلبات (للفترة)',ct.target_orders,'number','مثال: 650')
        +fld('ct-bpom','🎁 بونص الطلب بعد الهدف (اختياري)',ct.bonus_per_order,'number','0 = بلا بونص')
        +fld('ct-ppom','⛔ خصم الطلب الناقص عن الهدف (اختياري)',ct.penalty_per_order,'number','0 = بلا خصم')
        +'<div class="wf-field"><label>احتساب الراتب</label><select id="ct-prorate">'
          +'<option value="1"'+(ct.prorate!==false?' selected':'')+'>متناسب مع أيام الدوام المكتملة</option>'
          +'<option value="0"'+(ct.prorate===false?' selected':'')+'>راتب مقطوع (كامل بلا تناسب)</option></select></div>'
        +'<div class="wf-field full"><div class="wx7-note">يوم الدوام = يوم ساعاته ≥ هدف الساعات (من الملف). '
        +'الراتب = الراتب الشهري × (أيام الدوام المكتملة ÷ عدد أيام الدوام)، ولا يتجاوز الراتب الشهري. '
        +'وهدف الطلبات يُقارَن بإجمالي طلبات الفترة (بونص/خصم للطلب اختياري).</div></div>';
    }
    if(m==='hourly'||m==='hybrid') h+=fld('ct-hour','سعر الساعة للسائق (ريال)',ct.hour_rate,'number');
    if(m==='orders'||m==='hybrid') h+=fld('ct-order','سعر الطلب للسائق (ريال)',ct.order_rate,'number');
    if(m==='share')  h+=fld('ct-share','نسبة السائق من صافي الملف (٪)',ct.share_perc,'number');
    if(m==='fixed')  h+=fld('ct-fixed','الراتب الثابت (ريال)',ct.fixed_base,'number');
    if(m==='file')   h+='<div class="wf-field full"><div class="wx7-note">راتب الموظف = صافي التكلفة من الملف كما هو (بلا هامش للشركة).</div></div>';
    return h;
  }
  function body(){
    var ct=_ct;
    return ''
    +'<div class="wf-sec">بيانات العقد</div><div class="wf-grid">'
      +'<div class="wf-field"><label>المشروع</label><input value="'+E(ct.project)+'" readonly></div>'
      +fld('ct-name','اسم العقد',ct.name)
      +fld('ct-no','رقم العقد',ct.contract_no)
      +fld('ct-party','الطرف الآخر',ct.party,'text','اسم العميل/المورد')
      +fld('ct-start','بداية العقد',ct.start,'date')
      +fld('ct-end','نهاية العقد',ct.end,'date')
    +'</div>'
    +'<div class="wf-sec">آلية حساب راتب الموظف</div>'
    +'<div class="wf-grid">'

    +'«هامش الشركة» = صافي الملف − راتب الموظف.</div>';
  }
  function read(){
    function g(id){ var el=document.getElementById(id); return el?el.value.trim():''; }
    function gc(id){ var el=document.getElementById(id); return el?el.checked:false; }
    var ct=_ct;
    ct.name=g('ct-name'); ct.contract_no=g('ct-no'); ct.party=g('ct-party');
    ct.start=g('ct-start'); ct.end=g('ct-end');
    ct.mode=g('ct-mode')||'file';
    ct.day_rate=N(g('ct-day')); ct.target_orders=N(g('ct-tgt'));
    ct.bonus_per_order=N(g('ct-bpo')); ct.penalty_per_order=N(g('ct-ppo')); ct.day_min_hours=N(g('ct-dmh'));
    if(document.getElementById('ct-msal')){
      ct.monthly_salary=N(g('ct-msal')); ct.full_days=N(g('ct-fdays'));
      ct.day_min_hours=N(g('ct-dmh2')); ct.target_orders=N(g('ct-tgtm'));
      ct.bonus_per_order=N(g('ct-bpom')); ct.penalty_per_order=N(g('ct-ppom'));
      var pr=document.getElementById('ct-prorate'); ct.prorate = pr ? (pr.value==='1') : true;
    }
    var bs=document.getElementById('ct-basis'); if(bs) ct.target_basis=bs.value;
    ct.hour_rate=N(g('ct-hour')); ct.order_rate=N(g('ct-order'));
    ct.share_perc=N(g('ct-share')); ct.fixed_base=N(g('ct-fixed'));
    ct.use_file_bonus=gc('ct-fb'); ct.use_file_adjust=gc('ct-fa');
    ct.min_guarantee=N(g('ct-ming')); ct.max_cap=N(g('ct-cap'));
    ct.min_hours=N(g('ct-minh')); ct.min_days=N(g('ct-mind'));
    ct.notes=g('ct-notes');
    var ts=[]; Array.prototype.forEach.call(document.querySelectorAll('#ct-tiers .wx7-line'), function(r){
      var m=r.querySelector('.tm').value, f=N(r.querySelector('.tf').value), a=N(r.querySelector('.ta').value);
      if(f||a) ts.push({metric:m, from:f, amount:a});
    });
    ct.tiers=ts;
    var ds=[]; Array.prototype.forEach.call(document.querySelectorAll('#ct-deds .wx7-line'), function(r){
      var n=r.querySelector('.dn').value.trim(), a=N(r.querySelector('.da').value);
      if(n||a) ds.push({name:n||'خصم', amount:a, per:r.querySelector('.dp').value, applies:r.querySelector('.dap').value});

  }
  function preview(){
    var box=document.getElementById('ct-prev'); if(!box) return;
    var s=window.__wx7s || {hours:180, orders:420, net:3500, days:24, bonus:200, adj:-50};
    var ct=read();

    box.innerHTML='<div class="h">🧮 محاكاة على كابتن نموذجي (عدّل الأرقام لترى أثر العقد فوراً)</div>'

      +'<input id="ps-o" type="number" value="'+s.orders+'" placeholder="طلبات">'

      +'<input id="ps-n" type="number" value="'+s.net+'" placeholder="صافي الملف">'
      +'<input id="ps-b" type="number" value="'+s.bonus+'" placeholder="حوافز الملف">'
      +'<input id="ps-a" type="number" value="'+s.adj+'" placeholder="تعديلات">'

    ['ps-h','ps-o','ps-d','ps-n','ps-b','ps-a'].forEach(function(id){

        preview();

  function wire(){
    var md=document.getElementById('ct-mode');
    if(md) md.onchange=function(){
      read(); _ct.mode=md.value;
      var f=document.getElementById('ct-modef'); if(f) f.innerHTML=modeFields(_ct);
      bindLive(); preview();
    };
    var at=document.getElementById('ct-addt');
    if(at) at.onclick=function(){ read(); _ct.tiers.push({metric:'orders',from:0,amount:0}); redraw(); };
    var ad=document.getElementById('ct-addd');
    if(ad) ad.onclick=function(){ read(); _ct.deductions.push({name:'',amount:0,per:'month',applies:'all'}); redraw(); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-dt]'), function(b){
      b.onclick=function(){ read(); _ct.tiers.splice(+b.getAttribute('data-dt'),1); redraw(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-dd]'), function(b){
      b.onclick=function(){ read(); _ct.deductions.splice(+b.getAttribute('data-dd'),1); redraw(); };
    });
    bindLive();
  }
  function bindLive(){
    Array.prototype.forEach.call(document.querySelectorAll('#wx7Modal input,#wx7Modal select,#wx7Modal textarea'), function(el){
      if(el.id && el.id.indexOf('ps-')===0) return;
      if(el.__lv) return; el.__lv=true;
      el.addEventListener('input', function(){ try{ preview(); }catch(e){} });
      el.addEventListener('change', function(){ try{ preview(); }catch(e){} });
    });
  }
  function redraw(){
    document.querySelector('#wx7Modal .wf-body').innerHTML=body();
    wire(); preview();
  }
  function edit(project, after){
    if(!isAdmin()){ T('العقود متاحة للموظف الاداري فقط'); return; }
    _proj=project; _after=after||null;
    _ct=get(project) ? JSON.parse(JSON.stringify(get(project))) : blank(project);
    _ct.project=project;
    scrim();
    document.getElementById('wx7Modal').innerHTML=
      '<div class="wf-head"><div class="nm">📜 عقد مشروع '+E(project)+'</div><div class="x" onclick="closeWx7()">✕</div></div>'
      +'<div class="wf-body">'+body()+'</div>'
      +'<div class="wf-foot">'
      +(get(project)?'<button class="btn ghost" style="margin-inline-end:auto;color:var(--bad)" onclick="wx7Del()">🗑️ حذف العقد</button>':'')
      +'<button class="btn ghost" onclick="closeWx7()">إلغاء</button>'
      +'<button class="btn" onclick="wx7Save()">💾 حفظ العقد</button></div>';
    document.getElementById('wx7Scrim').classList.add('on');
    wire(); preview();
  }
  window.wx7Save=function(){
    var ct=read(); ct.updatedAt=new Date().toISOString();
    put(_proj, ct);
    closeWx7(); T('📜 تم حفظ عقد '+_proj);
    try{ renderProj(); }catch(e){}
    try{ cards(); }catch(e){}
    if(_after) try{ _after(); }catch(e){}
  };
  window.wx7Del=function(){
    del(_proj); closeWx7(); T('تم حذف العقد');
    try{ renderProj(); }catch(e){}
    try{ cards(); }catch(e){}
    if(_after) try{ _after(); }catch(e){}
  };
  window.wx7Edit=function(p, cb){ edit(p, cb); };

  /* ---------- عرض العقد داخل كروت المشاريع ---------- */
  function projCards(){
    var host=document.getElementById('projCards'); if(!host) return;
    Array.prototype.forEach.call(host.querySelectorAll('.pcard'), function(card){
      if(card.querySelector('.wx7-c')) return;
      var h=card.querySelector('h3'); if(!h) return;
      var p=h.textContent.replace(/^[^\wأ-ي]+/,'').trim();
      if(!p || p==='غير محدد') return;
      var ct=get(p);
      var d=document.createElement('div'); d.className='wx7-c';
      d.innerHTML='<div class="t">📜 '+(ct?('<b>'+E(ct.name||('عقد '+p))+'</b><br>'+E(summary(ct))):'<span style="color:var(--warn)">لا يوجد عقد — الراتب من الملف كما هو</span>')+'</div>'
        +'<button class="wx7-btn'+(ct?'':' none')+'">'+(ct?'✏️ تعديل العقد':'➕ إنشاء عقد')+'</button>';
      d.querySelector('button').onclick=function(ev){ ev.stopPropagation(); edit(p); };
      d.onclick=function(ev){ ev.stopPropagation(); };
      card.appendChild(d);
    });
  }
  (function(){
    var o=window.renderProj;
    if(typeof o==='function' && !o.__wx7){
      window.renderProj=function(){ var r=o.apply(this,arguments); try{ projCards(); }catch(e){} return r; };
      window.renderProj.__wx7=true;
    }
  })();

  /* ---------- بطاقة إدارة العقود في تبويب الرواتب ---------- */
  function cards(){
    var host=document.querySelector('#view-wf_payroll .wfp-wrap'); if(!host) return;
    var b=document.getElementById('wx7Card');
    if(!b){
      b=document.createElement('div'); b.id='wx7Card'; b.className='wx6-card';
      host.insertBefore(b, host.firstChild);
    }
    var set={};
    (state.employees||[]).forEach(function(e){ if(e.project) set[e.project]=1; });
    try{ var a=JSON.parse(localStorage.getItem('wf_acl_cache_v3')||'null');
      if(a&&a.projects) a.projects.forEach(function(p){ set[p]=1; }); }catch(e){}
    var ps=Object.keys(set).sort();
    b.innerHTML='<h3>📜 عقود المشاريع</h3>'
      +'<div class="wx6-mut">آلية حساب الرواتب لكل مشروع تُؤخذ من عقده — تُطبَّق تلقائياً عند استخراج رواتب المشروع، '
      +'ويظهر «راتب الموظف» و«هامش الشركة» في شاشة التعميد.</div>'
      +'<div class="wx7-list" style="margin-top:12px">'
      +(ps.length?ps.map(function(p){
        var ct=get(p);
        return '<div class="wx7-row"><span class="nm">'+E(p)+'</span>'
          +'<span class="ds">'+(ct?E(summary(ct)):'<span style="color:var(--warn)">لا يوجد عقد — يُحتسب الراتب من صافي الملف كما هو</span>')+'</span>'
          +'<span class="sp"><button class="wx7-btn'+(ct?'':' none')+'" data-p="'+E(p)+'">'+(ct?'✏️ تعديل':'➕ إنشاء عقد')+'</button></span></div>';
      }).join(''):'<div class="wx6-mut">لا توجد مشاريع بعد.</div>')
      +'</div>';
    Array.prototype.forEach.call(b.querySelectorAll('[data-p]'), function(btn){
      btn.onclick=function(){ edit(btn.getAttribute('data-p'), cards); };
    });
  }

  /* ---------- تضمين العقود في النسخة الاحتياطية على الجهاز ---------- */
  (function(){
    var s=window.wx4Snapshot;
    /* wx4 لا يصدّر snapshot — نضيف العقود عبر تغليف الاسترجاع/الحفظ بمفتاح محلي مستقل */
  })();

  window.wxContract={ get:get, all:all, put:put, calc:calc, summary:summary, edit:edit, MODES:MODES, blank:blank };

  function boot(){ try{ cards(); projCards(); }catch(e){} }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  setInterval(function(){ try{ cards(); projCards(); }catch(e){} }, 3000);
})();
</script>

<script id="wx8-js">
/* ============================================================
   وثيق — الطبقة (٨): حذف بيانات تسجيل الدخول وما يتبعها
   يفتح اللوحة مباشرةً بلا بوّابة دخول (وصول كامل)، ويُزيل
   الحسابات/كلمات السر المخزّنة وواجهة الدخول — دون المساس
   بكتلة wf-integration (تبقى مطابقة حرفياً لملف الأسطول).
   ============================================================ */
(function(){
  if(window.__wx8) return; window.__wx8=true;

  var SESS='wf_session_v3', ACL_CACHE='wf_acl_cache_v3';

  /* هوية إدارية محلية → currentUser() يصير صادقاً فتنكشف اللوحة بوصول كامل */
  var ADMIN={ username:'admin', name:'الأدمن', role:'admin', project:'',
              perms:{view:true, edit:true, finance:true, manage:true} };

  function seedSession(){
    try{
      var r=sessionStorage.getItem(SESS);
      var u=r?JSON.parse(r):null;
      if(!u || u.role!=='admin'){ sessionStorage.setItem(SESS, JSON.stringify(ADMIN)); }
    }catch(e){ try{ sessionStorage.setItem(SESS, JSON.stringify(ADMIN)); }catch(_){} }
  }

  /* حذف بيانات الدخول المخزّنة (الحسابات/كلمات السر) مع الإبقاء على المشاريع */
  function wipeLogin(){
    var projects=[];
    try{
      var a=JSON.parse(localStorage.getItem(ACL_CACHE)||'null');
      if(a && Array.isArray(a.projects)) projects=a.projects;
    }catch(e){}
    var clean={ requireLogin:false, users:[], projects:projects };
    try{ localStorage.setItem(ACL_CACHE, JSON.stringify(clean)); }catch(e){}
    /* نفس البيانات في مخزن الجهاز المحلي (يقرأها pullAcl) */
    try{ if(window.wfLocalStore){ window.wfLocalStore.setData('acl3', clean); } }catch(e){}
  }

  /* كشف اللوحة فوراً وإزالة أي أثر للبوّابة */
  function reveal(){
    try{ var h=document.getElementById('wfiHideAll'); if(h) h.remove(); }catch(e){}
    try{ document.documentElement.style.overflow=''; }catch(e){}
    try{ document.body.style.visibility=''; }catch(e){}
    try{ var g=document.getElementById('wfiGate'); if(g) g.remove(); }catch(e){}
    try{ var b=document.getElementById('wfiBtn'); if(b) b.style.display=''; }catch(e){}
  }

  /* إزالة تبويب «تسجيل الدخول» وخيار «طلب تسجيل الدخول» من لوحة الصلاحيات */
  function stripPanel(){
    try{
      var t=document.querySelector('.wfi-tab[data-t="login"]'); if(t) t.remove();
    }catch(e){}
    try{
      var req=document.getElementById('wfiReq');
      if(req){ var row=req.closest('.wfi-row'); if(row) row.style.display='none'; else req.style.display='none'; }
    }catch(e){}
    /* لو كان تبويب الدخول مفتوحاً، حوّل للمشاريع */
    try{
      var active=document.querySelector('.wfi-tab.on[data-t="login"]');
      if(active){ var proj=document.querySelector('.wfi-tab[data-t="projects"]'); if(proj) proj.click(); }
    }catch(e){}
  }

  seedSession();
  wipeLogin();
  reveal();

  /* شبكة أمان: البوّابة تُبنى داخل wf-integration بشكل غير متزامن — راقب وأزِل */
  var tries=0;
  var iv=setInterval(function(){
    seedSession();       /* يضمن بقاء الجلسة الإدارية حتى لو أُعيد ضبطها */
    reveal();
    stripPanel();
    if(++tries>40) clearInterval(iv);   /* ~20 ثانية ثم نكتفي بالمراقبة الخفيفة */
  }, 500);
  setInterval(function(){ try{ reveal(); stripPanel(); }catch(e){} }, 3000);

  /* راقب ظهور البوّابة لحظياً لإزالتها قبل أن تُرى */
  try{
    new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        var ad=muts[i].addedNodes;
        for(var j=0;j<ad.length;j++){
          var n=ad[j];
          if(n && n.id==='wfiGate'){ reveal(); }
          if(n && n.id==='wfiHideAll'){ try{ n.remove(); }catch(e){} }
        }
      }
    }).observe(document.documentElement,{childList:true, subtree:true});
  }catch(e){}
})();
</script>

<script id="wx9-js">
/* ============================================================
   وثيق — الطبقة (٩): جعل ملف Fleet OS (JSON) قابلاً للاستيراد
   من زر «استيراد (JSON/Excel)» العام أيضاً — يتعرّف النظام على
   ملف المركبات ويوجّهه تلقائياً إلى «مستورد المركبات» للمراجعة
   والتعميد، بدل رفضه بـ«صيغة غير متوقّعة».
   ============================================================ */
(function(){
  if(window.__wx9) return; window.__wx9=true;

  function T(m){ try{ toast(m); }catch(e){} }

  /* ملف مركبات Fleet OS: كائن فيه vehicles كمصفوفة، وليس ملف موظفين */
  function isFleetFile(o){
    if(!o || typeof o!=='object' || Array.isArray(o)) return false;
    if(Array.isArray(o.employees)) return false;               /* ملف/نسخة موظفين */
    if(o.data && Array.isArray(o.data.vehicles)) return true;  /* غلاف مخزَّن */
    return Array.isArray(o.vehicles);
  }

  /* تمرير الكائن المقروء إلى مستورد المركبات (يعيد استخدام مساره الكامل) */
  function routeToVeh(o){
    if(typeof window.wx4OpenVehImport!=='function'){ T('مستورد المركبات غير متاح'); return; }
    window.wx4OpenVehImport();
    var tries=0;
    (function feed(){
      var input=document.querySelector('#wx4Modal input[type=file]');
      var next =document.getElementById('wx4Next');
      if(!input && tries<20){ tries++; return setTimeout(feed, 120); }
      if(!input){ return; }
      try{
        var f=new File([JSON.stringify(o)], 'fleet_os_import.json', {type:'application/json'});
        var dt=new DataTransfer(); dt.items.add(f);
        input.files=dt.files;
        input.dispatchEvent(new Event('change', {bubbles:true}));
        T('📥 ملف مركبات Fleet OS — جارٍ التحليل للمراجعة قبل التعميد');
        /* انتظر قراءة الملف ثم اعرض المعاينة (زر «تحليل الملفات») تلقائياً */
        var t2=0;
        (function analyze(){
          var nx=document.getElementById('wx4Next');
          if(nx && !nx.disabled){ nx.click(); return; }
          if(t2<40){ t2++; setTimeout(analyze, 120); }
        })();
      }catch(e){
        /* متصفح لا يدعم ضبط input.files برمجياً → استخدم حقن مباشر إن توفّر */
        if(typeof window.wx4ImportParsed==='function') window.wx4ImportParsed(o, 'fleet_os_import.json');
      }
    })();
  }

  /* تغليف الاستيراد العام: لو الملف Fleet OS وجّهه، وإلا سلوك طبيعي */
  function wrap(){
    if(typeof window.mergeJSON!=='function' || window.mergeJSON.__wx9) return;
    var orig=window.mergeJSON;
    window.mergeJSON=function(o){
      if(isFleetFile(o)){ routeToVeh(o.data && Array.isArray(o.data.vehicles) ? o.data : o); return; }
      return orig.apply(this, arguments);
    };
    window.mergeJSON.__wx9=true;
  }
  wrap();
  var t=0, iv=setInterval(function(){ wrap(); if(++t>20) clearInterval(iv); }, 300);
})();
</script>

<script id="wx10-js">
/* ============================================================

(function(){
  if(window.__wx10) return; window.__wx10=true;

  function E(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
  function N(v){ var n=parseFloat(String(v==null?'':v).replace(/[, ]/g,'')); return isNaN(n)?0:n; }
  function F(n){ return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0}); }
  function T(m){ try{ toast(m); }catch(e){} }
  function PL(x){ return String(x==null?'':x).toUpperCase().replace(/\s+/g,''); }
  function nowISO(){ return new Date().toISOString(); }
  function LS(){ return window.wfLocalStore || {getData:function(){return null;}, setData:function(){return false;}}; }
  function isAdmin(){
    try{ var r=sessionStorage.getItem('wf_session_v3'); if(!r) return true; var u=JSON.parse(r);
      return !!(u && (u.role==='admin' || (u.perms&&u.perms.finance))); }catch(e){ return true; }
  }
  function save(){ try{ recomputeStats(); }catch(e){} try{ persist(); }catch(e){} }

  /* نافذة موحّدة بنفس تصميم النظام */
  function modal(){
    var s=document.getElementById('wx10Scrim');

      s.innerHTML='<div class="wf-modal" id="wx10Modal" style="max-width:620px"></div>';

  }
  window.wx10Close=function(){ closeW(); };
  function closeW(){ var s=document.getElementById('wx10Scrim'); if(s) s.classList.remove('on'); }
  function openW(title, body, foot){

  /* ============================================================
     (٢) عدم إظهار الحفظ في كرت الموظف — إخفاء الشارة أثناء الفتح

    var apply=function(){ document.body.classList.toggle('wx-card-open', sc.classList.contains('on')); };

  /* ============================================================
     (٣) مشاركة الملف عبر واتساب — بكل البيانات

  function fullSnapshot(){
    var acl=null; try{ acl=JSON.parse(localStorage.getItem('wf_acl_cache_v3')||'null'); }catch(e){}
    return {
      app:'watheeq', kind:'full-backup', savedAt:nowISO(),
      employees:(state.employees)||[],
      acl: acl,
      fleet: LS().getData('fleetos')||null,
      contracts: LS().getData('contracts')||null
    };
  }
  function caption(snap){
    var emp=snap.employees.length;
    var active=snap.employees.filter(function(e){ return e.employment_status==='active'; }).length;
    var stopped=snap.employees.filter(function(e){ return e.employment_status==='stopped' || String(e.status_label||'').indexOf('متوقف')>=0; }).length;
    var veh=snap.fleet && snap.fleet.vehicles ? snap.fleet.vehicles.length : 0;
    var projects=0; try{ projects=Object.keys(state.stats.byProject||{}).length; }catch(e){}
    var d=new Date();
    return '📋 *بيانات نظام وثيق*\n'
      +'🗓️ '+d.toLocaleDateString('ar-EG')+' — '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+'\n'
      +'━━━━━━━━━━━━━━\n'
      +'👥 الموظفون: *'+emp+'*\n'
      +'  • على رأس العمل: '+active+'\n'
      +'  • متوقفون: '+stopped+'\n'
      +'🚗 المركبات: *'+veh+'*\n'
      +'🗂️ المشاريع: *'+projects+'*\n'
      +'━━━━━━━━━━━━━━\n'
      +'📎 الملف المرفق يحتوي *كل البيانات*.\n'
      +'لفتحه: طبّق «وثيق» ← قائمة البيانات ← استيراد (JSON) ← اختر الملف.';
  }
  window.wx10Share=function(){
    try{ closeMenus(); }catch(e){}
    var snap=fullSnapshot();
    var cap=caption(snap);
    var json=JSON.stringify(snap);
    var fname='watheeq-backup-'+new Date().toISOString().slice(0,10)+'.json';
    var file;
    try{ file=new File([json], fname, {type:'application/json'}); }catch(e){ file=null; }

    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({ files:[file], title:'بيانات وثيق', text:cap })
        .then(function(){ T('تم فتح المشاركة'); })
        .catch(function(){ /* ألغى المستخدم */ });
      return;
    }
    /* بديل: تنزيل الملف ثم فتح واتساب بالرسالة */
    openW('💾 مشاركة نسخة كاملة عبر واتساب',
      '<div style="font-size:14px;line-height:1.95">جهازك لا يدعم إرفاق الملف مباشرة في المشاركة.<br>'
      +'سيتم <b>تنزيل ملف البيانات</b> على الجهاز، ثم فتح واتساب برسالة جاهزة — أرفق الملف المنزَّل يدوياً في المحادثة.</div>'
      +'<div class="wx6-mut" style="margin-top:10px;white-space:pre-line;border:1px dashed var(--line);border-radius:12px;padding:10px 12px">'+E(cap)+'</div>',
      '<button class="btn ghost" onclick="wx10Close()">إلغاء</button>'
      +'<button class="btn" onclick="wx10ShareFallback()">⬇️ تنزيل + فتح واتساب</button>');
    window.__wx10cap=cap; window.__wx10json=json; window.__wx10fname=fname;
  };
  window.wx10ShareFallback=function(){
    try{
      var b=new Blob([window.__wx10json],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=window.__wx10fname;
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){}
    closeW();
    setTimeout(function(){ try{ window.open('https://wa.me/?text='+encodeURIComponent(window.__wx10cap),'_blank'); }catch(e){} }, 500);
    T('تم تنزيل الملف — أرفقه في واتساب');
  };

  /* ============================================================
     (٤) إضافة مركبة في تفاصيل المركبات
     ============================================================ */
  function projectList(){
    var set={}; (state.employees||[]).forEach(function(e){ if(e.project) set[e.project]=1; });
    try{ var a=JSON.parse(localStorage.getItem('wf_acl_cache_v3')||'null'); if(a&&a.projects) a.projects.forEach(function(p){ set[p]=1; }); }catch(e){}
    return Object.keys(set).sort();
  }
  window.wx10AddVeh=function(){
    if(state.current==null) return;
    if(!isAdmin()){ T('إضافة المركبات متاحة للموظف الاداري فقط'); return; }
    var e=state.employees[state.current]; if(!e) return;
    var today=new Date().toISOString().slice(0,10);
    var projOpts='<option value="">— اختر —</option>'+projectList().map(function(p){
      return '<option'+(p===e.project?' selected':'')+'>'+E(p)+'</option>'; }).join('');
    openW('➕ إضافة مركبة لـ '+E(e.name_ar||e.iqama),
      '<div class="wf-grid">'
      +'<div class="wf-field"><label>رقم اللوحة *</label><input id="wv-plate" placeholder="مثال: 1234ABC"></div>'
      +'<div class="wf-field"><label>نوع المركبة</label><input id="wv-type" placeholder="Toyota - Yaris"></div>'
      +'<div class="wf-field"><label>الفئة</label><select id="wv-sheet"><option value="CAR">سيارة</option><option value="MOTORCYCLE">دراجة نارية</option></select></div>'
      +'<div class="wf-field"><label>المشروع</label><select id="wv-project">'+projOpts+'</select></div>'
      +'<div class="wf-field"><label>المنطقة</label><input id="wv-area" value="'+E(e.area||'')+'"></div>'
      +'<div class="wf-field"><label>مكتب التأجير</label><input id="wv-office"></div>'
      +'<div class="wf-field"><label>الوقود</label><input id="wv-fuel" placeholder="PETROL"></div>'
      +'<div class="wf-field"><label>الحالة</label><select id="wv-status"><option value="active">نشطة / تفويض ساري</option><option value="past">منتهية</option></select></div>'
      +'<div class="wf-field"><label>تاريخ الاستلام</label><input id="wv-recv" type="date" value="'+today+'"></div>'
      +'<div class="wf-field"><label>تاريخ التسليم</label><input id="wv-deliv" type="date"></div>'
      +'<div class="wf-field"><label>فرع الاستلام</label><input id="wv-brecv"></div>'
      +'<div class="wf-field"><label>فرع التسليم</label><input id="wv-bdeliv"></div>'
      +'<div class="wf-field full"><label>ملاحظة</label><input id="wv-notes" placeholder="اختياري"></div>'
      +'</div><div class="wx6-mut" style="margin-top:8px">تُضاف المركبة إلى سجل الموظف مباشرة. اختيار «نشطة» يجعلها المركبة الحالية.</div>',
      '<button class="btn ghost" onclick="wx10Close()">إلغاء</button><button class="btn" onclick="wx10SaveVeh()">💾 إضافة</button>');
    setTimeout(function(){
      var st=document.getElementById('wv-status'), dl=document.getElementById('wv-deliv');
      if(st&&dl) st.onchange=function(){ dl.disabled=(st.value==='active'); if(st.value==='active') dl.value=''; };
      if(st) st.onchange();
    },0);
  };
  window.wx10SaveVeh=function(){
    function g(id){ var el=document.getElementById(id); return el?String(el.value).trim():''; }
    var e=state.employees[state.current]; if(!e) return;
    var plate=PL(g('wv-plate'));
    if(!plate){ T('أدخل رقم اللوحة'); return; }
    var active=(g('wv-status')==='active');
    var rec={
      plate:plate, vehicle_type:g('wv-type'), sheet:g('wv-sheet')||'CAR',
      project:g('wv-project'), area:g('wv-area'), rental_office:g('wv-office'), fuel:g('wv-fuel'),
      date_receive:g('wv-recv'), date_deliver:active?'':g('wv-deliv'),
      status:active?'Active':'Stopped', branch_receive:g('wv-brecv'), branch_deliver:g('wv-bdeliv'),
      reason:'', notes:g('wv-notes'), active:active, added_manual:true
    };
    e.vehicles=e.vehicles||[];
    e.vehicles.push(rec);
    e.vehicles.sort(function(x,y){
      if(!!x.active!==!!y.active) return x.active?-1:1;
      return String(y.date_receive||'').localeCompare(String(x.date_receive||''));
    });
    if(g('wv-notes')){
      e.notes=e.notes||[];
      e.notes.push({text:g('wv-notes'), kind:/حادث|توالف/.test(g('wv-notes'))?'accident':'note', plate:plate});
    }
    e.updatedAt=nowISO();
    save();
    closeW();
    try{ openModal(state.current,'veh'); }catch(e2){}
    T('🚗 تمت إضافة المركبة');

  function injectAddVeh(){
    var pane=document.getElementById('pane-veh');

  /* مراقبة النافذة لحقن زر إضافة المركبة */
  function watchModal(){
    var m=document.getElementById('modal'); if(!m || m.__wx10) return;
    m.__wx10=true;
    new MutationObserver(function(){ try{ injectAddVeh(); }catch(e){} }).observe(m,{childList:true, subtree:true});

  /* ============================================================
     (٦) تجميع بالمشاريع — شريط جانبي يسار الشاشة
     ============================================================ */
  function buildSide(){
    var view=document.getElementById('view-emp'); if(!view) return;
    var cards=document.getElementById('empCards'); if(!cards) return;
    if(!document.getElementById('wxEmpWrap')){
      var wrap=document.createElement('div'); wrap.className='wx-emp-wrap'; wrap.id='wxEmpWrap';
      cards.parentNode.insertBefore(wrap, cards);
      wrap.appendChild(cards);                                  /* البطاقات أولاً = يمين (RTL) */
      var side=document.createElement('aside'); side.className='wx-proj-side'; side.id='wxProjSide';
      wrap.appendChild(side);                                    /* الشريط بعدها = يسار (RTL) */
      side.style.display='none';
    }
    /* زر التبديل في شريط الأدوات */
    var bar=view.querySelector('.toolbar');
    if(bar && !document.getElementById('wxSideBtn')){
      var btn=document.createElement('button');
      btn.id='wxSideBtn'; btn.className='btn ghost'; btn.textContent='🗂️ تجميع بالمشاريع';
      btn.onclick=window.wx10ToggleSide;
      bar.appendChild(btn);
    }
  }
  window.wx10ToggleSide=function(){
    var side=document.getElementById('wxProjSide'); if(!side) return;
    var show=(side.style.display==='none');
    side.style.display=show?'':'none';
    var btn=document.getElementById('wxSideBtn'); if(btn) btn.classList.toggle('on', show);
    try{ LS().setData('wx10_side', show?1:0); }catch(e){}
    if(show) updateSide();
  };
  function updateSide(){
    var side=document.getElementById('wxProjSide'); if(!side || side.style.display==='none') return;
    var bp={}; try{ bp=state.stats.byProject||{}; }catch(e){}
    var cur=''; try{ cur=state.filter.project||''; }catch(e){}
    var total=(state.employees||[]).length;
    var html='<div class="wx-ps-hd">🗂️ تجميع بالمشاريع</div>'
      +'<div class="wx-ps-item'+(!cur?' on':'')+'" data-p="">📊 كل المشاريع <span>'+total+'</span></div>';
    Object.keys(bp).sort(function(a,b){ return bp[b]-bp[a]; }).forEach(function(p){
      html+='<div class="wx-ps-item'+(cur===p?' on':'')+'" data-p="'+E(p)+'">'+E(p)+' <span>'+bp[p]+'</span></div>';
    });
    side.innerHTML=html;
    Array.prototype.forEach.call(side.querySelectorAll('.wx-ps-item'), function(it){
      it.onclick=function(){
        try{ state.filter.project=it.getAttribute('data-p'); }catch(e){}
        try{ syncControls(); }catch(e){}
        try{ renderEmp(); }catch(e){}
        updateSide();
      };
    });
  }
  /* حدّث الشريط عند إعادة رسم الموظفين */
  (function(){
    var o=window.renderEmp;
    if(typeof o==='function' && !o.__wx10){
      window.renderEmp=function(){ var r=o.apply(this,arguments); try{ updateSide(); }catch(e){} return r; };
      window.renderEmp.__wx10=true;
    }
  })();

  /* ============================================================
     قائمة البيانات: مشاركة واتساب
     ============================================================ */
  function injectMenu(){
    var dm=document.getElementById('dataMenu'); if(!dm || document.getElementById('wx10Wa')) return;
    var sep=document.createElement('div'); sep.className='sep';
    var b=document.createElement('button'); b.id='wx10Wa'; b.innerHTML='💾 مشاركة نسخة كاملة (كل البيانات)'; b.onclick=window.wx10Share;
    dm.appendChild(sep); dm.appendChild(b);
  }

  function boot(){
    try{ watchCard(); watchModal(); buildSide(); injectMenu(); }catch(e){}
    /* استعادة حالة الشريط */
    try{ if(LS().getData('wx10_side')){ var s=document.getElementById('wxProjSide'); if(s&&s.style.display==='none') window.wx10ToggleSide(); } }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  setInterval(function(){ try{ watchCard(); watchModal(); buildSide(); injectMenu(); injectAddVeh(); }catch(e){} }, 2500);
})();
</script>

      '<div class="wf-head"><div class="nm">'+title+'</div><div class="x" onclick="wx11Close()">✕</div></div>'

    document.getElementById('wx11Scrim').classList.add('on');
  }

  function openAdv(e){
    return (((e.finance||{}).advances)||[]).reduce(function(s,a){
      return ((a.status||'new')!=='settled' && !a.settled_period) ? s+N(a.amount) : s; },0);
  }
  function custodyDue(e){
    var stopped=(e.employment_status==='stopped' || String(e.status_label||'').indexOf('متوقف')>=0);
    return (e.custody||[]).reduce(function(s,c){
      if(c.settled_period) return s;
      if(c.status==='deducted') return s+N(c.value);
      if(c.status==='held' && stopped) return s+N(c.value);
      return s;
    },0);
  }

  /* ---------- بناء ملخّص الموظف — بيانات أساسية فقط ---------- */
  function summary(e){
    var L=[];
    var nm=e.name_ar||e.name_en||'—';
    L.push('👤 *'+nm+'*'+(e.name_en&&e.name_ar?('\n   '+e.name_en):''));
    L.push('━━━━━━━━━━━━━━');
    if(e.iqama)          L.push('🆔 الإقامة: '+e.iqama);
    if(e.mobile)         L.push('📱 الجوال: '+e.mobile);
    if(e.email)          L.push('✉️ البريد: '+e.email);
    if(e.nationality)    L.push('🌍 الجنسية: '+e.nationality);
    if(e.profession)     L.push('🧰 المهنة: '+e.profession);
    if(e.status_label)   L.push('💼 الحالة: '+e.status_label);
    var pj=e.project||e.job_title; if(pj) L.push('🗂️ المشروع: '+pj);
    if(e.area)           L.push('📍 مدينة العمل: '+e.area);
    if(e.license_type)   L.push('🪪 نوع الرخصة: '+e.license_type);
    if(e.iban)           L.push('🏦 الآيبان: '+e.iban);
