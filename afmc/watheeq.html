<script id="wx3-js">
/* ============================================================
   وثيق Watheeq — الطبقة (٣): تحسينات غير مدمّرة
   ١) تعديل/إضافة/حذف الموظفين (تقوية + حقول إضافية)
   ٢) كرت مالي احترافي + تاريخ مالي متعدد السنوات (بلا حد زمني)
   ٣) سجل مركبات بتفاصيل أوسع
   لا يتم المساس بسطر قاعدة البيانات المدمجة إطلاقاً.
   ============================================================ */
(function(){
  if(window.__wx3) return; window.__wx3 = true;

  /* ---------------- أدوات ---------------- */
  function E(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
  function N(v){ var n=Number(v); return isNaN(n)?0:n; }
  function F(v){ return N(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function clone(o){ try{ return JSON.parse(JSON.stringify(o)); }catch(e){ return {}; } }
  function T(m){ try{ toast(m); }catch(e){} }
  function dbet(a,b){ var t1=Date.parse(a),t2=Date.parse(b); if(isNaN(t1)||isNaN(t2)) return null; return Math.round((t2-t1)/86400000); }
  function todayS(){ return new Date().toISOString().slice(0,10); }
  function isAdmin(){
    try{ var r=sessionStorage.getItem('wf_session_v3'); if(!r) return true; var u=JSON.parse(r); return !!(u && u.role==='admin'); }
    catch(e){ return true; }
  }
  var MN={'01':'يناير','02':'فبراير','03':'مارس','04':'أبريل','05':'مايو','06':'يونيو','07':'يوليو','08':'أغسطس','09':'سبتمبر','10':'أكتوبر','11':'نوفمبر','12':'ديسمبر'};
  function perLabel(p){ var m=/^(\d{4})-(\d{2})/.exec(String(p||'')); return m ? (MN[m[2]]+' '+m[1]) : (p||'—'); }
  function perYear(p){ var m=/^(\d{4})/.exec(String(p||'')); return m ? m[1] : 'غير محدد'; }
  function durTxt(d){
    if(d==null) return '—';
    if(d<30) return d+' يوم';
    var mo=Math.floor(d/30), rd=d%30;
    return d+' يوم (≈ '+mo+' شهر'+(rd?' و'+rd+' يوم':'')+')';
  }

  /* ---------------- حماية التخزين (التاريخ الطويل يكبر الحجم) ---------------- */
  var _origPersist = window.persist;
  window.persist = function(){
    try{
      localStorage.setItem('watheeq_db_v1', JSON.stringify({employees: state.employees}));
      var q=document.getElementById('wx3Quota'); if(q) q.remove();
    }catch(err){
      showQuota();
    }
  };
  function showQuota(){
    if(document.getElementById('wx3Quota')) return;
    var d=document.createElement('div'); d.id='wx3Quota'; d.className='wx3-quota';
    d.innerHTML='⚠️ امتلأت مساحة التخزين بالمتصفح — آخر تعديل لم يُحفظ محلياً. صدّر نسخة احتياطية فوراً.'
      +'<button onclick="try{exportJSON()}catch(e){}">تصدير الآن</button>';
    document.body.appendChild(d);
  }

  /* ---------------- نافذة تأكيد بنفس تصميم النظام ---------------- */
  function scrim(){
    var s=document.getElementById('wx3Scrim');
    if(!s){
      s=document.createElement('div'); s.className='wf-scrim'; s.id='wx3Scrim';
      s.innerHTML='<div class="wf-modal" id="wx3Modal"></div>';
      document.body.appendChild(s);
      s.addEventListener('click',function(ev){ if(ev.target===s) closeWx3(); });
    }
    return s;
  }
  window.closeWx3=function(){ var s=document.getElementById('wx3Scrim'); if(s) s.classList.remove('on'); };
  function openWx3(title, body, footer){
    scrim();
    document.getElementById('wx3Modal').innerHTML=
      '<div class="wf-head"><div class="nm">'+title+'</div><div class="x" onclick="closeWx3()">✕</div></div>'
      +'<div class="wf-body">'+body+'</div>'
      +'<div class="wf-foot">'+footer+'</div>';
    document.getElementById('wx3Scrim').classList.add('on');
  }
  var _cfn=null;
  window.wx3Yes=function(){ var f=_cfn; _cfn=null; closeWx3(); if(f) f(); };
  function ask(msg, fn){
    _cfn=fn;
    openWx3('تأكيد', '<div style="font-size:14px;line-height:1.9">'+msg+'</div>',
      '<button class="btn ghost" onclick="closeWx3()">إلغاء</button><button class="btn" onclick="wx3Yes()">تأكيد</button>');
  }

  /* ============================================================
     (٢) الكرت المالي — نموذج البيانات
     ============================================================ */
  var DEF_PERIOD='2026-05';                     /* فترة الكرت المستورد إن لم تُحدَّد */
  function curPeriod(e){ return (e.finance && e.finance.period) || DEF_PERIOD; }
  function advSum(p){ return N(p.advance) + (p.advances||[]).reduce(function(s,a){ return s+N(a.amount); },0); }
  function allPeriods(e){
    var out=[];
    (e.finance_periods||[]).forEach(function(p,i){ var c=clone(p); c._pi=i; c._manual=true; out.push(c); });
    if(e.finance){ var c=clone(e.finance); c._cur=true; c.period=curPeriod(e); out.push(c); }
    out.sort(function(a,b){ return String(b.period||'').localeCompare(String(a.period||'')); });
    return out;
  }
  var ADVST={ 'new':'بانتظار التعميد', 'approved':'معتمدة', 'disbursed':'مصروفة', 'settled':'مسوّاة' };

  var _finYear='all';

  function finHTML(e, idx){
    var adm=isAdmin();
    var ps=allPeriods(e);
    if(!ps.length){
      return '<p style="color:var(--muted)">لا يوجد كرت مالي لهذا الموظف بعد.</p>'
        + (adm ? '<div class="wx3-bar"><button class="wx3-mini pri" data-a="addper">➕ إضافة فترة راتب</button></div>' : '')
        + hint();
    }
    var years={}; ps.forEach(function(p){ var y=perYear(p.period); (years[y]=years[y]||[]).push(p); });
    var ykeys=Object.keys(years).sort().reverse();
    var last=ps[0];
    var totalNet=ps.reduce(function(s,p){ return s+N(p.net); },0);
    var avg=totalNet/ps.length;
    var openAdv=0;
    (((e.finance||{}).advances)||[]).forEach(function(a){ if((a.status||'new')!=='settled') openAdv+=N(a.amount); });
    var span=(ykeys.length>1) ? (ykeys[ykeys.length-1]+' — '+ykeys[0]) : ykeys[0];

    /* KPIs */
    var kpis='<div class="wx3-kpis">'
      +kpi('صافي آخر راتب', F(last.net)+' <small>ريال</small>', 'ok', perLabel(last.period))
      +kpi('إجمالي المدفوع', F(totalNet)+' <small>ريال</small>', '', ps.length+' فترة')
      +kpi('متوسط الصافي', F(avg)+' <small>ريال</small>', '', 'لكل فترة')
      +kpi('سلف قائمة', F(openAdv)+' <small>ريال</small>', openAdv>0?'warn':'', 'غير مسوّاة')
      +'</div>';

    /* شريط السنوات */
    var chips='<div class="wx3-bar"><button class="wx3-yr'+(_finYear==='all'?' on':'')+'" data-y="all">كل السنوات ('+ps.length+')</button>'
      + ykeys.map(function(y){ return '<button class="wx3-yr'+(_finYear===y?' on':'')+'" data-y="'+E(y)+'">'+E(y)+' ('+years[y].length+')</button>'; }).join('')
      + '<span class="wx3-spacer"></span>'
      + '<button class="wx3-mini" data-a="exp">⬇️ تصدير التاريخ</button>'
      + (adm ? '<button class="wx3-mini pri" data-a="addper">➕ فترة</button>' : '')
      + '</div>';

    /* رسم بياني — آخر ١٢ فترة */
    var chartSrc=ps.slice(0,12).slice().reverse();
    var mx=Math.max.apply(null, chartSrc.map(function(p){ return N(p.net)||0; }).concat([1]));
    var chart = chartSrc.length>1 ? '<div class="wx3-chart">'+chartSrc.map(function(p){
      var h=Math.max(3, Math.round(N(p.net)/mx*70));
      return '<div class="wx3-col'+(p._manual?' dim':'')+'" title="'+E(perLabel(p.period))+' — '+F(p.net)+' ريال">'
        +'<div class="wx3-cv">'+F(p.net)+'</div>'
        +'<div class="wx3-cb" style="height:'+h+'px"></div>'
        +'<div class="wx3-cl">'+E(String(p.period||'').slice(2))+'</div></div>';
    }).join('')+'</div>' : '';

    /* المجموعات السنوية */
    var shown = ykeys.filter(function(y){ return _finYear==='all' || _finYear===y; });
    var groups = shown.map(function(y){
      var arr=years[y];
      var tn=arr.reduce(function(s,p){ return s+N(p.net); },0);
      var tb=arr.reduce(function(s,p){ return s+N(p.base); },0);
      var tbo=arr.reduce(function(s,p){ return s+N(p.bonus); },0);
      var tdd=arr.reduce(function(s,p){ return s+N(p.deduction); },0);
      var tav=arr.reduce(function(s,p){ return s+advSum(p); },0);
      return '<div class="wx3-grp">'
        +'<div class="wx3-gh" data-tg="1"><span class="y">'+E(y)+'</span>'
        +'<span class="s">'+arr.length+' فترة · أساسي '+F(tb)+' · حوافز '+F(tbo)+' · سلف '+F(tav)+' · خصميات '+F(tdd)+'</span>'
        +'<span class="n">صافي السنة: '+F(tn)+' ريال</span></div>'
        +'<div class="wx3-gb"><div class="wx3-tblwrap"><table class="wx3-tbl">'
        +'<thead><tr><th>الفترة</th><th>أيام</th><th>الأساسي</th><th>الحوافز</th><th>السلف</th><th>الخصميات</th><th>حوادث/توالف</th><th>الصافي</th><th>المصدر</th></tr></thead>'
        +'<tbody>'+arr.map(function(p){ return rowHTML(e, idx, p, adm); }).join('')+'</tbody>'
        +'</table></div></div></div>';
    }).join('');

    return kpis + chips + chart + groups + hint(span, ps.length);
  }
  function kpi(k,v,cls,sub){
    return '<div class="wx3-kpi '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div>'
      +(sub?'<div class="k" style="margin-top:2px">'+E(sub)+'</div>':'')+'</div>';
  }
  function hint(span, n){
    return '<div class="wx3-hint">📦 التاريخ المالي يُحفظ بالكامل بلا حد زمني'
      +(span?(' — المدى الحالي: <b>'+E(span)+'</b> ('+n+' فترة)'):'')
      +'. عند استيراد ملف رواتب جديد يُؤرشَف الكرت السابق تلقائياً بدل استبداله. يُنصح بتصدير نسخة احتياطية شهرياً.</div>';
  }
  function rowHTML(e, idx, p, adm){
    var badge = p._cur ? '<span class="chip ok">الحالي</span>'
      : (p._archived ? '<span class="chip sand">مؤرشف</span>' : '<span class="chip line">يدوي</span>');
    var tr='<tr class="r" data-p="'+E(String(p.period||''))+'" data-pi="'+(p._manual?p._pi:'cur')+'">'
      +'<td class="per">'+E(perLabel(p.period))+' '+badge+'</td>'
      +'<td>'+E(p.days||'—')+'</td>'
      +'<td>'+F(p.base)+'</td>'
      +'<td>'+F(p.bonus)+'</td>'
      +'<td>'+F(advSum(p))+'</td>'
      +'<td class="'+(N(p.deduction)<0?'neg':'')+'">'+F(p.deduction)+'</td>'
      +'<td>'+F(p.accident)+'</td>'
      +'<td class="net">'+F(p.net)+'</td>'
      +'<td style="color:var(--muted)">'+E(p.source||(p._manual?'إدخال يدوي':'—'))+'</td></tr>';

    /* صف التفاصيل */
    var advs = p._cur ? (((e.finance||{}).advances)||[]) : [];
    var advHTML='';
    if(p._cur){
      var list = advs.map(function(a,ai){
        var st=a.status||'new';
        return '<div class="adv-item"><span>'+F(a.amount)+' ريال</span>'
          +'<span class="chip '+(st==='settled'?'ok':(st==='new'?'warn':'line'))+'">'+(ADVST[st]||st)+'</span>'
          +'<span style="color:var(--muted)">'+E(a.note||'')+(a.date?' · '+E(a.date):'')+'</span>'
          +(adm?'<button class="del" style="margin-inline-start:auto" onclick="event.stopPropagation();delAdvance('+idx+','+ai+')">✕</button>':'')
          +'</div>';
      }).join('');
      advHTML='<div style="margin-top:6px"><div style="font-weight:600;font-size:13px;margin-bottom:7px">السلف اليدوية</div>'
        +(list||'<p style="color:var(--muted);font-size:12.5px">لا توجد سلف يدوية.</p>')
        +(adm?'<div class="adv-add" onclick="event.stopPropagation()"><input type="number" id="advAmt" placeholder="المبلغ"><input id="advNote" placeholder="ملاحظة (اختياري)">'
          +'<button class="btn sm" onclick="addAdvance('+idx+')">+ إضافة سلفة</button></div>':'')
        +'</div>';
    }
    var acts='';
    if(adm){
      acts = p._manual
        ? '<button class="wx3-mini" data-a="editper" data-pi="'+p._pi+'">✏️ تعديل الفترة</button> <button class="wx3-mini" data-a="delper" data-pi="'+p._pi+'">🗑️ حذف الفترة</button>'
        : '<button class="wx3-mini" data-a="setper">📅 تحديد فترة الكرت المستورد</button>';
    }
    var det='<tr class="wx3-det" style="display:none"><td colspan="9">'
      +'<div class="wx3-dg">'
      + f('صاحب الحساب', p.account||p.name)
      + f('الآيبان', p.iban)
      + f('المشروع', p.project)
      + f('ملف المصدر', p.source)
      + f('ملاحظة', p.note)
      + f('تاريخ الأرشفة', p.archived_at ? String(p.archived_at).slice(0,10) : '')
      +'</div>'
      + advHTML
      + (acts?'<div class="wx3-bar" style="margin-bottom:0" onclick="event.stopPropagation()">'+acts+'</div>':'')
      +'</td></tr>';
    return tr+det;
  }
  function f(k,v){ return v ? '<div class="f"><div class="k">'+k+'</div><div class="v">'+E(v)+'</div></div>' : ''; }

  /* ---------- ربط أحداث الكرت المالي ---------- */
  function wireFin(pane, idx){
    if(pane.__wx3Fin) return; pane.__wx3Fin=true;
    pane.addEventListener('click', function(ev){
      var t=ev.target.closest('[data-y]');
      if(t){ _finYear=t.getAttribute('data-y'); renderFin(idx); return; }
      var a=ev.target.closest('[data-a]');
      if(a){
        var act=a.getAttribute('data-a');
        if(act==='addper') return openPeriodForm(idx, null);
        if(act==='editper') return openPeriodForm(idx, Number(a.getAttribute('data-pi')));
        if(act==='delper'){ var pi=Number(a.getAttribute('data-pi'));
          return ask('سيتم حذف هذه الفترة من التاريخ المالي نهائياً. متابعة؟', function(){
            var e=state.employees[idx]; e.finance_periods.splice(pi,1); persist(); renderFin(idx); T('تم حذف الفترة');
          });
        }
        if(act==='setper') return openCurPeriodForm(idx);
        if(act==='exp') return exportFinHistory(idx);
      }
      var gh=ev.target.closest('.wx3-gh');
      if(gh){ gh.parentNode.classList.toggle('closed'); return; }
      var r=ev.target.closest('tr.r');
      if(r){ var d=r.nextElementSibling; if(d && d.classList.contains('wx3-det')) d.style.display = (d.style.display==='none'?'table-row':'none'); }
    });
  }
  function renderFin(idx){
    var pane=document.getElementById('pane-fin'); if(!pane) return;
    var e=state.employees[idx]; if(!e) return;
    pane.innerHTML=finHTML(e, idx);
    wireFin(pane, idx);
  }

  /* ---------- نموذج الفترة المالية ---------- */
  function fld(id,label,type,val,ph){
    return '<div class="wf-field"><label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+E(val==null?'':val)+'"'+(ph?' placeholder="'+E(ph)+'"':'')+'></div>';
  }
  var _pIdx=null, _pPi=null;
  function openPeriodForm(idx, pi){
    var e=state.employees[idx]; if(!e) return;
    _pIdx=idx; _pPi=(pi==null?null:pi);
    var p=(pi==null)?{}:((e.finance_periods||[])[pi]||{});
    var body='<div class="wf-sec">بيانات الفترة</div><div class="wf-grid">'
      +fld('wxp-period','الفترة (شهر/سنة)','month',p.period||'')
      +fld('wxp-days','أيام الدوام','text',p.days||'')
      +fld('wxp-base','الراتب الأساسي','number',p.base||'')
      +fld('wxp-bonus','الحوافز','number',p.bonus||'')
      +fld('wxp-advance','السلف','number',p.advance||'')
      +fld('wxp-accident','التوالف والحوادث','number',p.accident||'')
      +fld('wxp-deduction','الخصميات','number',p.deduction||'','سالب أو موجب')
      +fld('wxp-net','صافي الراتب','number',p.net||'')
      +'</div>'
      +'<label class="wf-check" style="margin-top:8px"><input type="checkbox" id="wxp-auto" checked> حساب الصافي تلقائياً (أساسي + حوافز − سلف − حوادث + خصميات)</label>'
      +'<div class="wf-sec">بيانات الحساب</div><div class="wf-grid">'
      +fld('wxp-account','اسم صاحب الحساب','text',p.account||e.name_ar||'')
      +fld('wxp-iban','الآيبان','text',p.iban||e.iban||'')
      +fld('wxp-project','المشروع','text',p.project||e.project||'')
      +fld('wxp-source','المصدر','text',p.source||'إدخال يدوي')
      +'<div class="wf-field full"><label>ملاحظة</label><textarea id="wxp-note">'+E(p.note||'')+'</textarea></div>'
      +'</div>';
    openWx3((pi==null?'➕ إضافة فترة راتب':'✏️ تعديل الفترة المالية'), body,
      '<button class="btn ghost" onclick="closeWx3()">إلغاء</button><button class="btn" onclick="wx3SavePeriod()">💾 حفظ</button>');
    ['wxp-base','wxp-bonus','wxp-advance','wxp-accident','wxp-deduction'].forEach(function(id){
      var el=document.getElementById(id); if(el) el.addEventListener('input', autoNet);
    });
    var au=document.getElementById('wxp-auto'); if(au) au.addEventListener('change', autoNet);
  }
  function autoNet(){
    var au=document.getElementById('wxp-auto'); if(!au||!au.checked) return;
    function g(id){ var el=document.getElementById(id); return el?N(el.value):0; }
    var net=g('wxp-base')+g('wxp-bonus')-g('wxp-advance')-g('wxp-accident')+g('wxp-deduction');
    var el=document.getElementById('wxp-net'); if(el) el.value=Math.round(net*100)/100;
  }
  window.wx3SavePeriod=function(){
    function g(id){ var el=document.getElementById(id); return el?String(el.value).trim():''; }
    var e=state.employees[_pIdx]; if(!e) return;
    var per=g('wxp-period'); if(!per){ T('أدخل الفترة (شهر/سنة)'); return; }
    var rec={ period:per, days:g('wxp-days'), base:N(g('wxp-base')), bonus:N(g('wxp-bonus')),
      advance:N(g('wxp-advance')), accident:N(g('wxp-accident')), deduction:N(g('wxp-deduction')),
      net:N(g('wxp-net')), account:g('wxp-account'), iban:g('wxp-iban'), project:g('wxp-project'),
      source:g('wxp-source')||'إدخال يدوي', note:g('wxp-note'), advances:[] };
    e.finance_periods=e.finance_periods||[];
    if(_pPi==null){
      var dup=e.finance_periods.filter(function(x){ return x.period===per; }).length;
      if(dup){ T('تنبيه: توجد فترة بنفس الشهر — أُضيفت كسجل منفصل'); }
      e.finance_periods.push(rec);
    } else {
      var old=e.finance_periods[_pPi]||{};
      rec._archived=old._archived; rec.archived_at=old.archived_at;
      e.finance_periods[_pPi]=rec;
    }
    persist(); closeWx3(); renderFin(_pIdx); T(_pPi==null?'تمت إضافة الفترة':'تم حفظ الفترة');
  };
  function openCurPeriodForm(idx){
    _pIdx=idx;
    var e=state.employees[idx];
    openWx3('📅 فترة الكرت المستورد',
      '<p style="font-size:13px;color:var(--muted);margin-bottom:10px">حدّد الشهر الذي يخصّه الكرت المالي المستورد حالياً. يُستخدم عند أرشفته تلقائياً بعد استيراد ملف رواتب جديد.</p>'
      +'<div class="wf-grid">'+fld('wxc-period','الفترة (شهر/سنة)','month',curPeriod(e))+'</div>',
      '<button class="btn ghost" onclick="closeWx3()">إلغاء</button><button class="btn" onclick="wx3SaveCurPeriod()">💾 حفظ</button>');
  }
  window.wx3SaveCurPeriod=function(){
    var el=document.getElementById('wxc-period'); var v=el?el.value.trim():'';
    if(!v){ T('أدخل الفترة'); return; }
    var e=state.employees[_pIdx]; if(!e||!e.finance) return;
    e.finance.period=v; persist(); closeWx3(); renderFin(_pIdx); T('تم تحديد فترة الكرت');
  };

  /* ---------- تصدير التاريخ المالي ---------- */
  function csv(rows){
    return '\ufeff'+rows.map(function(r){ return r.map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  }
  function dl(name, content, type){
    var b=new Blob([content],{type:type}); var u=URL.createObjectURL(b);
    var a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
  }
  function exportFinHistory(idx){
    var e=state.employees[idx];
    var head=['الفترة','النوع','أيام','الأساسي','الحوافز','السلف','الخصميات','حوادث','الصافي','صاحب الحساب','الآيبان','المصدر'];
    var rows=[head].concat(allPeriods(e).map(function(p){
      return [p.period, p._cur?'الكرت الحالي':(p._archived?'مؤرشف':'يدوي'), p.days, p.base, p.bonus, advSum(p), p.deduction, p.accident, p.net, p.account||p.name, p.iban, p.source||''];
    }));
    dl('finance-'+(e.iqama||'emp')+'.csv', csv(rows), 'text/csv;charset=utf-8');
    T('تم تصدير التاريخ المالي');
  }
  window.wx3ExportAllFinance=function(){
    try{ closeMenus(); }catch(e){}
    var head=['رقم الإقامة','الاسم','المشروع','الفترة','النوع','أيام','الأساسي','الحوافز','السلف','الخصميات','حوادث','الصافي','الآيبان','المصدر'];
    var rows=[head];
    state.employees.forEach(function(e){
      allPeriods(e).forEach(function(p){
        rows.push([e.iqama, e.name_ar||e.name_en, e.project||'', p.period, p._cur?'الكرت الحالي':(p._archived?'مؤرشف':'يدوي'),
          p.days, p.base, p.bonus, advSum(p), p.deduction, p.accident, p.net, p.iban||'', p.source||'']);
      });
    });
    try{
      var wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'التاريخ المالي');
      XLSX.writeFile(wb, 'watheeq-finance-history.xlsx');
    }catch(err){
      dl('watheeq-finance-history.csv', csv(rows), 'text/csv;charset=utf-8');
    }
    T('تم تصدير التاريخ المالي لكل الموظفين ('+(rows.length-1)+' سجل)');
  };

  /* ---------- الأرشفة التلقائية عند استيراد ملف رواتب جديد ---------- */
  function finSig(f){ return f ? [f.period||'', f.net, f.base, f.bonus, f.deduction, f.source||''].join('|') : ''; }
  function prevMonth(){
    var d=new Date(); d.setMonth(d.getMonth()-1);
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
  }
  ['mergeXLSX','mergeJSON'].forEach(function(fn){
    var orig=window[fn];
    if(typeof orig!=='function' || orig.__wx3) return;
    window[fn]=function(){
      var snap={};
      try{ state.employees.forEach(function(e){ if(e.iqama && e.finance) snap[e.iqama]=clone(e.finance); }); }catch(e){}
      var r=orig.apply(this, arguments);
      try{
        var n=0;
        state.employees.forEach(function(e){
          var old=snap[e.iqama]; if(!old || !e.finance) return;
          if(finSig(old)===finSig(e.finance)) return;                 /* لم يتغيّر */
          if(!N(old.net) && !N(old.base)) return;                     /* كرت فارغ لا يُؤرشف */
          var per=old.period || DEF_PERIOD;
          if(e.finance.period && e.finance.period===per) per=prevMonth();
          e.finance_periods=e.finance_periods||[];
          var exists=e.finance_periods.some(function(p){ return p.period===per && N(p.net)===N(old.net); });
          if(exists) return;
          old.period=per; old._archived=true; old.archived_at=new Date().toISOString();
          e.finance_periods.push(old); n++;
        });
        if(n){ persist(); T('📦 أُرشِف '+n+' كرت مالي سابق ضمن التاريخ المالي'); }
      }catch(e){}
      return r;
    };
    window[fn].__wx3=true;
  });

  /* ============================================================
     (٣) سجل المركبات — تفاصيل أوسع
     ============================================================ */
  var _vehFilter='all';
  function vehHTML(e){
    var vs=(e.vehicles||[]).slice().sort(function(a,b){ return String(b.date_receive||'').localeCompare(String(a.date_receive||'')); });
    if(!vs.length) return '<p style="color:var(--muted)">لا توجد مركبات مسجّلة (سجل راتب فقط).</p>';

    var act=vs.filter(function(v){ return v.active; });
    var offices={}, projects={}, plates={}, totalDays=0;
    vs.forEach(function(v){
      if(v.rental_office) offices[v.rental_office]=1;
      if(v.project) projects[v.project]=1;
      if(v.plate) plates[v.plate]=1;
      var end=v.date_deliver || (v.active?todayS():'');
      var d=dbet(v.date_receive, end); if(d && d>0) totalDays+=d;
    });
    var first=vs[vs.length-1]||{};
    var accidents=(e.notes||[]).filter(function(n){ return n.kind==='accident'; }).length;

    var kpis='<div class="wx3-kpis">'
      +kpi('إجمالي السجلات', vs.length+' <small>سجل</small>', '', Object.keys(plates).length+' لوحة مختلفة')
      +kpi('نشطة الآن', act.length ? (E(act[0].plate)) : 'لا يوجد', act.length?'ok':'bad', act.length? (E(act[0].vehicle_type||'')) : 'بلا تفويض ساري')
      +kpi('إجمالي أيام التفويض', totalDays+' <small>يوم</small>', '', durTxt(totalDays))
      +kpi('المكاتب / المشاريع', Object.keys(offices).length+' / '+Object.keys(projects).length, '', 'أول استلام: '+E(first.date_receive||'—'))
      +'</div>';

    var bar='<div class="wx3-bar">'
      +'<button class="wx3-yr'+(_vehFilter==='all'?' on':'')+'" data-vf="all">الكل ('+vs.length+')</button>'
      +'<button class="wx3-yr'+(_vehFilter==='active'?' on':'')+'" data-vf="active">نشطة ('+act.length+')</button>'
      +'<button class="wx3-yr'+(_vehFilter==='past'?' on':'')+'" data-vf="past">منتهية ('+(vs.length-act.length)+')</button>'
      +'<span class="wx3-spacer"></span>'
      +'<button class="wx3-mini" data-va="exp">⬇️ تصدير السجل</button>'
      +(accidents?'<span class="chip bad">حوادث/توالف: '+accidents+'</span>':'')
      +'</div>';

    var shown=vs.filter(function(v){ return _vehFilter==='all' || (_vehFilter==='active'? !!v.active : !v.active); });
    var nodes=shown.map(function(v, i){
      var end=v.date_deliver || (v.active?todayS():'');
      var d=dbet(v.date_receive, end);
      var notes=(e.notes||[]).filter(function(n){ return n.plate && n.plate===v.plate; });
      var gap='';
      /* فجوة بدون مركبة بين هذا السجل والأحدث منه */
      if(i>0){
        var newer=shown[i-1];
        var g=dbet(v.date_deliver, newer.date_receive);
        if(g!=null && g>1) gap='<div class="wx3-gap">⏳ فترة بدون مركبة: '+g+' يوم ('+E(v.date_deliver)+' → '+E(newer.date_receive)+')</div>';
      }
      var card='<div class="node '+(v.active?'active':'')+'">'
        +'<div class="vc">'
        +'<div class="hd">🚗 '+E(v.plate||'—')+' <span style="font-weight:400;color:var(--muted)">'+E(v.vehicle_type||'')+'</span> '
        +(v.active?'<span class="chip ok">نشطة — '+(d!=null?d+' يوم حتى الآن':'')+'</span>':'<span class="chip line">منتهية</span>')
        +'</div>'
        +'<div class="rows">'
        +(v.project?'<span class="chip sand">'+E(v.project)+'</span>':'')
        +(v.area?'<span class="chip">'+E(v.area)+'</span>':'')
        +(v.sheet?'<span class="chip">'+(v.sheet==='MOTORCYCLE'?'دراجة':'سيارة')+'</span>':'')
        +(v.rental_office?'<span class="chip line">🏢 '+E(v.rental_office)+'</span>':'')
        +(v.status?'<span class="chip line">'+E(v.status)+'</span>':'')
        +(v.reason?'<span class="chip warn">'+E(v.reason)+'</span>':'')
        +'</div>'
        +'<div class="wx3-vdet">'
        + vf('تاريخ الاستلام', v.date_receive)
        + vf('تاريخ التسليم', v.date_deliver || (v.active?'مستمرة حتى الآن':'—'))
        + vf('مدة التفويض', durTxt(d))
        + vf('فرع الاستلام', v.branch_receive)
        + vf('فرع التسليم', v.branch_deliver)
        + vf('نوع الوقود', v.fuel)
        + vf('مكتب التأجير', v.rental_office)
        + vf('المشروع', v.project)
        + vf('المنطقة', v.area)
        + vf('حالة السجل', v.status)
        + vf('سبب التسليم', v.reason)
        + vf('الفئة', v.sheet==='MOTORCYCLE'?'دراجة نارية':(v.sheet?'سيارة':''))
        +'</div>'
        +(v.notes?'<div class="wx3-note">📝 '+E(v.notes)+'</div>':'')
        +(notes.length?'<div class="wx3-vnotes">'+notes.map(function(n){
            return '<div class="wx3-vnote'+(n.kind==='accident'?' acc':'')+'">'+(n.kind==='accident'?'⚠️ ':'🗒️ ')+E(n.text)+'</div>';
          }).join('')+'</div>':'')
        +'</div></div>';
      return gap+card;
    }).join('');

    return kpis + bar + '<div class="tl">'+(nodes||'<p style="color:var(--muted)">لا توجد سجلات مطابقة.</p>')+'</div>';
  }
  function vf(k,v){ return v ? '<div class="f"><div class="k">'+k+'</div><div class="v">'+E(v)+'</div></div>' : ''; }

  function renderVeh(idx){
    var pane=document.getElementById('pane-veh'); if(!pane) return;
    var e=state.employees[idx]; if(!e) return;
    pane.innerHTML=vehHTML(e);
    if(pane.__wx3Veh) return; pane.__wx3Veh=true;
    pane.addEventListener('click', function(ev){
      var b=ev.target.closest('[data-vf]');
      if(b){ _vehFilter=b.getAttribute('data-vf'); renderVeh(idx); return; }
      var x=ev.target.closest('[data-va]');
      if(x){
        var head=['اللوحة','النوع','الفئة','الوقود','مكتب التأجير','المشروع','المنطقة','الاستلام','التسليم','المدة (يوم)','فرع الاستلام','فرع التسليم','الحالة','السبب','ملاحظات'];
        var rows=[head].concat((e.vehicles||[]).map(function(v){
          var end=v.date_deliver||(v.active?todayS():'');
          return [v.plate,v.vehicle_type,(v.sheet==='MOTORCYCLE'?'دراجة':'سيارة'),v.fuel,v.rental_office,v.project,v.area,
            v.date_receive,v.date_deliver||(v.active?'مستمرة':''),(dbet(v.date_receive,end)||''),v.branch_receive,v.branch_deliver,v.status,v.reason,v.notes];
        }));
        dl('vehicles-'+(e.iqama||'emp')+'.csv', csv(rows),'text/csv;charset=utf-8');
        T('تم تصدير سجل المركبات');
      }
    });
  }

  /* ============================================================
     (١) الموظفون — تقوية التعديل/الإضافة + حقول إضافية + حذف (أدمن)
     ============================================================ */
  function extraFields(){
    var m=document.getElementById('wfModal'); if(!m) return;
    var body=m.querySelector('.wf-body'); if(!body || body.querySelector('#ef2-city')) return;
    var e=(_editing!=null)?state.employees[_editing]:{};
    e=e||{};
    var box=document.createElement('div');
    box.innerHTML='<div class="wf-sec">بيانات إضافية</div><div class="wf-grid">'
      +'<div class="wf-field"><label>المدينة</label><input id="ef2-city" value="'+E(e.city||'')+'"></div>'
      +'<div class="wf-field"><label>تاريخ الالتحاق</label><input id="ef2-join" type="date" value="'+E(e.join_date||'')+'"></div>'
      +'<div class="wf-field full"><label>ملاحظة إدارية</label><textarea id="ef2-note">'+E(e.admin_note||'')+'</textarea></div>'
      +'</div>';
    body.appendChild(box);
    /* زر حذف الموظف — للأدمن فقط وفي التعديل فقط */
    var foot=m.querySelector('.wf-foot');
    if(foot && _editing!=null && isAdmin() && !foot.querySelector('#wx3DelEmp')){
      var b=document.createElement('button');
      b.id='wx3DelEmp'; b.className='btn ghost'; b.style.marginInlineEnd='auto';
      b.style.color='var(--bad)'; b.textContent='🗑️ حذف الموظف';
      b.onclick=function(){
        var idx=_editing, emp=state.employees[idx];
        try{ closeEmployeeForm(); }catch(_){}
        ask('سيتم حذف الموظف <b>'+E(emp.name_ar||emp.iqama)+'</b> نهائياً مع كرته المالي وسجل مركباته. متابعة؟', function(){
          state.employees.splice(idx,1);
          try{ recomputeStats(); }catch(_){}
          persist();
          try{ fillProjects(); }catch(_){}
          try{ renderAll(); }catch(_){}
          try{ closeModal(); }catch(_){}
          T('تم حذف الموظف');
        });
      };
      foot.insertBefore(b, foot.firstChild);
    }
  }
  var _editing=null;
  ['openEmployeeEdit','openAddEmployee'].forEach(function(fn){
    var orig=window[fn];
    if(typeof orig!=='function' || orig.__wx3) return;
    window[fn]=function(idx){
      _editing = (fn==='openEmployeeEdit' && typeof idx==='number') ? idx : null;
      var r=orig.apply(this, arguments);
      setTimeout(extraFields, 60);
      return r;
    };
    window[fn].__wx3=true;
  });

  var _saveEmp=window.saveEmployee;
  if(typeof _saveEmp==='function' && !_saveEmp.__wx3){
    window.saveEmployee=function(isNew){
      var el=document.getElementById('ef-iqama');
      var iq=el?String(el.value).trim():'';
      if(iq && !/^\d{6,}$/.test(iq)){ T('رقم الإقامة يجب أن يكون أرقاماً فقط'); return; }
      function g(id){ var x=document.getElementById(id); return x?String(x.value).trim():''; }
      var extra={ city:g('ef2-city'), join_date:g('ef2-join'), admin_note:g('ef2-note') };
      var r=_saveEmp.apply(this, arguments);
      try{
        var rec=null;
        for(var i=0;i<state.employees.length;i++){ if(String(state.employees[i].iqama)===iq){ rec=state.employees[i]; break; } }
        if(rec){
          if(extra.city) rec.city=extra.city;
          rec.join_date=extra.join_date; rec.admin_note=extra.admin_note;
          rec.updatedAt=new Date().toISOString();
          persist();
        }
      }catch(e){}
      return r;
    };
    window.saveEmployee.__wx3=true;
  }

  /* زر «موظف جديد» — إعادة الحقن بعد كل رسم */
  function addBtn(){
    var hrow=document.querySelector('#view-emp .h-row');
    if(!hrow || document.getElementById('wxAddEmp')) return;
    var b=document.createElement('button');
    b.id='wxAddEmp'; b.className='btn'; b.textContent='➕ موظف جديد';
    b.style.marginInlineStart='auto';
    b.onclick=function(){ window.openAddEmployee(); };
    hrow.style.display='flex'; hrow.style.alignItems='center'; hrow.style.gap='12px';
    hrow.appendChild(b);
  }
  ['renderEmp','renderAll','go'].forEach(function(fn){
    var orig=window[fn];
    if(typeof orig!=='function' || orig.__wx3b) return;
    window[fn]=function(){ var r=orig.apply(this, arguments); try{ addBtn(); }catch(e){} return r; };
    window[fn].__wx3b=true;
  });

  /* ============================================================
     تغليف openModal — إعادة بناء تبويبَي «الكرت المالي» و«سجل المركبات»
     ============================================================ */
  var _om=window.openModal;
  if(typeof _om==='function' && !_om.__wx3){
    window.openModal=function(idx, tab){
      var r=_om.apply(this, arguments);
      try{
        if(typeof idx==='number' && state.employees[idx]){
          _finYear='all'; _vehFilter='all';
          renderFin(idx);
          renderVeh(idx);
        }
      }catch(e){ try{ console.error(e); }catch(_){} }
      return r;
    };
    window.openModal.__wx3=true;
  }

  /* بند تصدير التاريخ المالي في قائمة البيانات */
  (function(){
    var dm=document.getElementById('dataMenu');
    if(dm && !document.getElementById('wx3ExpFin')){
      var b=document.createElement('button');
      b.id='wx3ExpFin'; b.innerHTML='📊 تصدير التاريخ المالي (كل السنوات)';
      b.onclick=window.wx3ExportAllFinance;
      dm.appendChild(b);
    }
  })();

  try{ addBtn(); }catch(e){}
  try{ if(state.current!=null) openModal(state.current); }catch(e){}
})();
</script>

<script id="wx4-js">
/* ============================================================
   وثيق Watheeq — الطبقة (٤)
   ١) حذف مزامنة Google Drive نهائياً + حفظ محلي على جهاز التشغيل
      (localStorage تلقائي + ملف حقيقي على القرص عبر File System Access)
   ٢) رفع ملفات المركبات (JSON) → تطبيقها في النظام → تكوين كروت الموظفين
   لا يتم المساس بسطر قاعدة البيانات المدمجة إطلاقاً.
   ============================================================ */
(function(){
  if(window.__wx4) return; window.__wx4 = true;

  /* ------------------------- أدوات ------------------------- */
  function E(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
  function T(m){ try{ toast(m); }catch(e){} }
  function V(x){ return String(x==null?'':x).trim(); }
  function IQ(x){ return String(x==null?'':x).replace(/\.0$/,'').replace(/[^0-9]/g,''); }
  function PL(x){ return V(x).toUpperCase().replace(/\s+/g,''); }
  function nowISO(){ return new Date().toISOString(); }
  function hhmm(){ var d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  function isAdmin(){
    try{ var r=sessionStorage.getItem('wf_session_v3'); if(!r) return true; var u=JSON.parse(r); return !!(u && u.role==='admin'); }
    catch(e){ return true; }
  }
  function LS(){ return window.wfLocalStore || {getData:function(){return null;}, setData:function(){return false;}, remove:function(){}}; }

  /* نافذة بنفس تصميم النظام */
  function scrim(){
    var s=document.getElementById('wx4Scrim');
    if(!s){
      s=document.createElement('div'); s.className='wf-scrim'; s.id='wx4Scrim';
      s.innerHTML='<div class="wf-modal" id="wx4Modal" style="max-width:760px"></div>';
      document.body.appendChild(s);
      s.addEventListener('click', function(ev){ if(ev.target===s) closeWx4(); });
    }
    return s;
  }
  window.closeWx4=function(){ var s=document.getElementById('wx4Scrim'); if(s) s.classList.remove('on'); };
  function openWx4(title, body, footer){
    scrim();
    document.getElementById('wx4Modal').innerHTML=
      '<div class="wf-head"><div class="nm">'+title+'</div><div class="x" onclick="closeWx4()">✕</div></div>'
      +'<div class="wf-body">'+body+'</div>'
      +'<div class="wf-foot">'+footer+'</div>';
    document.getElementById('wx4Scrim').classList.add('on');
  }
  var _ask=null;
  window.wx4Yes=function(){ var f=_ask; _ask=null; closeWx4(); if(f) f(); };
  function ask(title,msg,fn,okLabel){
    _ask=fn;
    openWx4(title, '<div style="font-size:14px;line-height:1.95">'+msg+'</div>',
      '<button class="btn ghost" onclick="closeWx4()">إلغاء</button><button class="btn" onclick="wx4Yes()">'+(okLabel||'تأكيد')+'</button>');
  }

  /* ============================================================
     (١) الحفظ المحلي على الجهاز
     ============================================================ */
  var FS_DB='watheeq_fs_v1', FS_STORE='kv', FS_KEY='handle';
  var _h=null, _timer=null, _writing=false, _dirty=false;

  function idb(){
    return new Promise(function(res,rej){
      try{
        var r=indexedDB.open(FS_DB,1);
        r.onupgradeneeded=function(){ try{ r.result.createObjectStore(FS_STORE); }catch(e){} };
        r.onsuccess=function(){ res(r.result); };
        r.onerror=function(){ rej(r.error); };
      }catch(e){ rej(e); }
    });
  }
  function idbGet(k){
    return idb().then(function(db){ return new Promise(function(res,rej){
      var t=db.transaction(FS_STORE,'readonly').objectStore(FS_STORE).get(k);
      t.onsuccess=function(){ res(t.result||null); }; t.onerror=function(){ rej(t.error); };
    });}).catch(function(){ return null; });
  }
  function idbPut(k,v){
    return idb().then(function(db){ return new Promise(function(res,rej){
      var t=db.transaction(FS_STORE,'readwrite').objectStore(FS_STORE).put(v,k);
      t.onsuccess=function(){ res(true); }; t.onerror=function(){ rej(t.error); };
    });}).catch(function(){ return false; });
  }
  function idbDel(k){
    return idb().then(function(db){ return new Promise(function(res){
      var t=db.transaction(FS_STORE,'readwrite').objectStore(FS_STORE).delete(k);
      t.onsuccess=function(){ res(true); }; t.onerror=function(){ res(false); };
    });}).catch(function(){ return false; });
  }

  /* شارة الحالة أسفل الشاشة */
  var pill;
  function mountPill(){
    if(document.getElementById('wx4Pill')) return;
    pill=document.createElement('div'); pill.id='wx4Pill'; pill.className='wx4-pill';
    pill.innerHTML='<span class="dot"></span><span class="txt">الحفظ المحلي…</span>';
    pill.onclick=onPillClick;
    document.body.appendChild(pill);
  }
  function setPill(cls, txt, link){
    var p=document.getElementById('wx4Pill'); if(!p) return;
    p.className='wx4-pill '+(cls||'');
    p.innerHTML='<span class="dot"></span><span class="txt">'+txt+'</span>'+(link?'<span class="lnk">'+link+'</span>':'');
    p.onclick=onPillClick;
  }
  function onPillClick(){ if(!_h) linkFile(); else writeNow(true); }

  function snapshot(){
    var acl=null; try{ acl=JSON.parse(localStorage.getItem('wf_acl_cache_v3')||'null'); }catch(e){}
    return {
      app:'watheeq', version:4, savedAt:nowISO(),
      employees:(typeof state!=='undefined' && state.employees)?state.employees:[],
      acl: acl,
      fleet: LS().getData('fleetos') || null,
      contracts: LS().getData('contracts') || null
    };
  }

  function perm(h, request){
    if(!h || !h.queryPermission) return Promise.resolve(true);
    return h.queryPermission({mode:'readwrite'}).then(function(p){
      if(p==='granted') return true;
      if(!request) return false;
      return h.requestPermission({mode:'readwrite'}).then(function(p2){ return p2==='granted'; });
    }).catch(function(){ return false; });
  }

  function writeNow(userGesture){

        return true;
      });

  /* تغليف persist: حفظ محلي فوري + كتابة الملف (مؤجَّلة) */
  var _persist=window.persist;
  window.persist=function(){
    var r; try{ r=_persist.apply(this, arguments); }catch(e){}
    _dirty=true;
    clearTimeout(_timer);

  /* ============================================================
     (٢) رفع ملفات المركبات (JSON) → تطبيقها → تكوين كروت الموظفين
     ============================================================ */
  var _files=[], _parsed=null;

  function readFiles(list){
    _files=[]; _parsed=null;
    var arr=Array.prototype.slice.call(list||[]);
    if(!arr.length) return Promise.resolve(null);
    return Promise.all(arr.map(function(f){
      return new Promise(function(res){
        var rd=new FileReader();
        rd.onload=function(){
          var o=null, err=null;
          try{ o=JSON.parse(rd.result); }catch(e){ err='تعذّرت قراءة JSON'; }
          res({name:f.name, size:f.size, data:o, err:err});
        };
        rd.onerror=function(){ res({name:f.name, size:f.size, data:null, err:'تعذّرت القراءة'}); };
        rd.readAsText(f);
      });
    })).then(function(res){ _files=res; return res; });
  }

  /* ---- استخراج سجلات التفويض من أي صيغة ---- */
  function pushDel(out, base, h){
    var iq=IQ(h.driver_id || h.iqama || h.IQAMA || h.id || '');
    if(iq.length < 8){ out.skipped++; return; }
    var dr=V(h.date_receive || h.receive_date || h.from || '');
    var dd=V(h.date_deliver || h.deliver_date || h.to || '');
    var st=V(h.status) || (dd ? 'Stopped' : 'Active');
    var rec={
      iqama:iq,
      name_ar:V(h.name_ar || h.driver_name || h.name || ''),
      name_en:V(h.name_en || ''),
      mobile :V(h.mobile || h.phone || ''),
      iban   :V(h.iban || ''),
      plate  :PL(base.plate || h.plate),
      vehicle_type :V(h.vehicle_type || base.vehicle_type),
      fuel         :V(h.fuel || base.fuel),
      sheet        :V(h.sheet || base.sheet),
      rental_office:V(h.rental_office || base.rental_office),
      project:V(h.project) || V(base.project),
      area   :V(h.area)    || V(base.area),
      date_receive:dr, date_deliver:dd, status:st,
      branch_receive:V(h.branch_receive), branch_deliver:V(h.branch_deliver),
      reason:V(h.reason), notes:V(h.notes),
      active:(!dd && String(st).toLowerCase()!=='stopped')
    };
    if(!rec.plate){ out.skipped++; return; }
    var k=iq+'|'+rec.plate+'|'+dr;
    if(out.seen[k]) return;
    out.seen[k]=1; out.dels.push(rec);
  }

  function collect(root, out){
    if(!root) return false;
    if(root.data && !Array.isArray(root)) root = root.data;               /* غلاف مخزَّن */
    var vs = Array.isArray(root) ? root : (root.vehicles || null);
    if(!Array.isArray(vs) || !vs.length){
      /* ملف موظفين وثيق؟ */
      var emps = (root && Array.isArray(root.employees)) ? root.employees : null;
      if(emps){ out.isEmployeesFile=true; return false; }
      return false;
    }
    /* ملف موظفين على شكل مصفوفة */
    if(Array.isArray(root) && vs[0] && vs[0].iqama && (vs[0].finance!==undefined || Array.isArray(vs[0].vehicles))){
      out.isEmployeesFile=true; return false;
    }
    var isFleet = vs.some(function(v){ return v && (v.current_driver || Array.isArray(v.history)); });
    var plates={};
    if(isFleet){
      vs.forEach(function(v){
        if(!v) return;
        plates[PL(v.plate)]=1;
        var base={plate:v.plate, vehicle_type:v.vehicle_type||v.model, fuel:v.fuel,
                  sheet:v.sheet||v.category, rental_office:v.rental_office||v.office,
                  project:v.project, area:v.area};
        var ents=[];
        (v.history||[]).forEach(function(h){ if(h) ents.push(h); });
        var cd=v.current_driver;
        if(cd){
          var dup=ents.some(function(h){ return IQ(h.driver_id)===IQ(cd.driver_id) && V(h.date_receive)===V(cd.date_receive); });
          if(!dup) ents.push(cd);
        }
        ents.forEach(function(h){ pushDel(out, base, h); });
      });
    } else {
      var flat = vs.some(function(r){ return r && r.plate && (r.driver_id || r.iqama || r.IQAMA); });
      if(!flat) return false;
      vs.forEach(function(r){
        if(!r) return;
        plates[PL(r.plate)]=1;
        pushDel(out, {plate:r.plate, vehicle_type:r.vehicle_type, fuel:r.fuel, sheet:r.sheet,
                      rental_office:r.rental_office, project:r.project, area:r.area}, r);
      });
    }
    Object.keys(plates).forEach(function(p){ if(p) out.plates[p]=1; });
    return true;
  }

  function parseAll(){
    var out={dels:[], seen:{}, plates:{}, skipped:0, isEmployeesFile:false, bad:[]};
    _files.forEach(function(f){
      if(f.err || !f.data){ out.bad.push(f.name+' — '+(f.err||'ملف فارغ')); return; }
      var ok=collect(f.data, out);
      if(!ok && !out.isEmployeesFile) out.bad.push(f.name+' — صيغة غير معروفة');
    });
    return out;
  }

  /* ---- التحليل قبل التطبيق ---- */
  function empIndex(){
    var m={}; (state.employees||[]).forEach(function(e,i){ var k=IQ(e.iqama); if(k) m[k]=i; });
    return m;
  }
  function analyze(p){
    var map=empIndex(), byIq={};
    p.dels.forEach(function(d){ (byIq[d.iqama]=byIq[d.iqama]||[]).push(d); });
    var a={drivers:0, newEmp:0, updEmp:0, willActive:0, willStopped:0, byIq:byIq,
           plates:Object.keys(p.plates).length, dels:p.dels.length, skipped:p.skipped, absentActive:0, sample:[]};
    var inFile={};
    Object.keys(byIq).forEach(function(iq){
      a.drivers++;
      inFile[iq]=1;
      var hasAct=byIq[iq].some(function(d){ return d.active; });
      if(hasAct) a.willActive++; else a.willStopped++;
      var isNew = (map[iq]==null);
      if(isNew) a.newEmp++; else a.updEmp++;
      if(a.sample.length<40){
        var nm=(byIq[iq].filter(function(d){return d.name_ar;})[0]||{}).name_ar||'';
        var nv=byIq[iq].length;
        a.sample.push({iqama:iq, name:nm||((map[iq]!=null)?(state.employees[map[iq]].name_ar||''):''),
                       n:nv, act:hasAct, isNew:isNew,
                       project:(byIq[iq].filter(function(d){return d.project;})[0]||{}).project||''});
      }
    });
    (state.employees||[]).forEach(function(e){
      if(e && e.employment_status==='active' && !inFile[IQ(e.iqama)]) a.absentActive++;
    });
    return a;
  }

  /* ---- التطبيق ---- */
  function applyImport(p, a, opts){
    var map=empIndex();
    var rep={added:0, updated:0, vehicles:0, activated:0, stopped:0, notes:0, closed:0, rows:[]};
    Object.keys(a.byIq).forEach(function(iq){
      var arr=a.byIq[iq].slice().sort(function(x,y){ return String(y.date_receive||'').localeCompare(String(x.date_receive||'')); });
      var e, isNew=false;
      if(map[iq]!=null){ e=state.employees[map[iq]]; rep.updated++; }
      else{
        if(!opts.createNew) return;
        isNew=true;
        e={ iqama:iq, name_ar:'', name_en:'', mobile:'', email:'', iban:'', nationality:'', birth_date:'',
            profession:'', job_title:'', project:'', employment_status:'stopped', status_label:'متوقف عن العمل',
            category:'', license_type:'', license_number:iq, iqama_issue:'', iqama_expiry:'',
            license_issue:'', license_expiry:'', area:'', city:'', housing_status:'', housing_location:'',
            vehicles:[], finance:null, notes:[], salary_only:false,
            created_from:'ملف المركبات (JSON)', createdAt:nowISO() };
        state.employees.push(e); map[iq]=state.employees.length-1; rep.added++;
      }
      /* الهوية */
      function first(k){ var x=arr.filter(function(d){ return d[k]; })[0]; return x?x[k]:''; }
      if(!e.name_ar)  e.name_ar  = first('name_ar');
      if(!e.name_en)  e.name_en  = first('name_en');
      if(!e.mobile)   e.mobile   = first('mobile');
      if(!e.iban)     e.iban     = first('iban');

      /* المركبات */
      var cur = opts.replace ? [] : (e.vehicles||[]).slice();
      var seen={};
      cur.forEach(function(v){ seen[PL(v.plate)+'|'+V(v.date_receive)]=v; });
      arr.forEach(function(d){
        var rec={ plate:d.plate, vehicle_type:d.vehicle_type, fuel:d.fuel, rental_office:d.rental_office,
                  sheet:d.sheet, project:d.project, area:d.area, date_receive:d.date_receive,
                  date_deliver:d.date_deliver, status:d.status, branch_receive:d.branch_receive,
                  branch_deliver:d.branch_deliver, reason:d.reason, notes:d.notes, active:d.active };
        var k=d.plate+'|'+d.date_receive;
        if(seen[k]){ Object.assign(seen[k], rec); }
        else { cur.push(rec); seen[k]=rec; rep.vehicles++; }
        if(d.notes){
          e.notes=e.notes||[];
          var dup=e.notes.some(function(n){ return n.text===d.notes && n.plate===d.plate; });
          if(!dup){ e.notes.push({text:d.notes, kind:/حادث|توالف|accident/i.test(d.notes)?'accident':'note', plate:d.plate}); rep.notes++; }
        }
      });
      cur.sort(function(x,y){ return String(y.date_receive||'').localeCompare(String(x.date_receive||'')); });
      e.vehicles=cur;

      /* الملف هو المرجع: أي تفويض قديم في وثيق لا يؤكّده الملف يُغلق */
      if(opts.status){
        var actKeys={};
        arr.forEach(function(d){ if(d.active) actKeys[d.plate+'|'+d.date_receive]=1; });
        cur.forEach(function(v){
          var k=PL(v.plate)+'|'+V(v.date_receive);
          if(v.active && !actKeys[k]){
            v.active=false;
            if(!v.status || String(v.status).toLowerCase()==='active') v.status='Stopped';
            rep.closed++;
          }
        });
      }

      /* الاشتقاق من المركبات */
      var act=cur.filter(function(v){ return v.active; });
      var newest=act[0]||cur[0]||{};
      if(newest.project) e.project=newest.project;
      if(!e.job_title && e.project) e.job_title=e.project;
      if(newest.area){ e.area=newest.area; if(!e.city) e.city=newest.area; }
      var moto=String(newest.sheet||'').toUpperCase().indexOf('MOTOR')>=0;
      if(!e.category)     e.category    = moto?'motorcycle':'car';
      if(!e.license_type) e.license_type= moto?'دراجة نارية':'خصوصي';
      if(!e.license_number) e.license_number=iq;

      if(opts.status){
        if(act.length){
          if(e.employment_status!=='active') rep.activated++;
          e.employment_status='active'; e.status_label='موظف'; e.salary_only=false;
        } else {
          if(e.employment_status!=='stopped') rep.stopped++;
          e.employment_status='stopped'; e.status_label='متوقف عن العمل'; e.salary_only=false;
        }
      }
      e.updatedAt=nowISO();
      rep.rows.push([iq, e.name_ar||'', e.project||'', cur.length, act.length?'تفويض ساري':'بلا تفويض',
                     isNew?'كرت جديد':'محدّث']);
    });

    /* مرآة الأسطول محلياً (للمزامنة التلقائية: بلا تفويض = متوقف) */
    if(opts.mirror){
      var byPlate={};
      p.dels.forEach(function(d){
        var v=byPlate[d.plate]=byPlate[d.plate]||{plate:d.plate, vehicle_type:d.vehicle_type,
                project:d.project, area:d.area, vehicle_status:'', current_driver:null};
        if(d.active) { v.current_driver={driver_id:d.iqama, name_ar:d.name_ar, status:'Active',
                        date_receive:d.date_receive, date_deliver:''}; v.vehicle_status='assigned'; }
      });
      var mv=Object.keys(byPlate).map(function(k){ return byPlate[k]; });
      LS().setData('fleetos', {vehicles:mv, savedAt:nowISO(), source:'رفع ملف المركبات'});
    } else {
      LS().remove('fleetos');
    }

    try{ recomputeStats(); }catch(e){}
    try{ persist(); }catch(e){}
    try{ fillProjects(); }catch(e){}
    try{ renderAll(); }catch(e){}
    return rep;
  }

  /* ---- الواجهة ---- */
  function fmtSize(n){ return n>1048576 ? (n/1048576).toFixed(1)+' م.ب' : Math.round(n/1024)+' ك.ب'; }

  window.wx4OpenVehImport=function(){

      +(p.bad.length?('<div class="wx4-bad">'+p.bad.map(E).join('<br>')+'</div>'):'')
      +'<div class="wf-sec">خيارات التطبيق</div>'
      +'<label class="wx4-opt"><input type="checkbox" id="wx4o-new" checked><div><b>إنشاء كروت للموظفين الجدد</b>'
      +'<div class="d">كل سائق في الملف غير موجود في وثيق يُنشأ له كرت كامل ('+a.newEmp+' كرت).</div></div></label>'
      +'<label class="wx4-opt"><input type="checkbox" id="wx4o-status" checked><div><b>تحديث حالة التوظيف من التفويض</b>'
      +'<div class="d">تفويض ساري = على رأس العمل · بلا تفويض = متوقف عن العمل.</div></div></label>'
      +'<label class="wx4-opt"><input type="checkbox" id="wx4o-mirror" checked><div><b>تفعيل المزامنة التلقائية من هذا الملف</b>'
      +'<div class="d">يُحفظ الملف كمرجع للأسطول على هذا الجهاز، ويُطبَّق «لا مركبة = متوقف عن العمل» تلقائياً.</div></div></label>'
      +'<label class="wx4-opt"><input type="checkbox" id="wx4o-replace"><div><b>استبدال سجل المركبات بالكامل</b>'
      +'<div class="d">بدل الدمج — يمسح السجل القديم للموظف ويضع سجل الملف فقط. (غير مُستحسن)</div></div></label>'
      +(a.absentActive?('<div class="wx4-warn">⚠️ يوجد <b>'+a.absentActive+'</b> موظف «على رأس العمل» في وثيق لا يظهر في هذا الملف. '
        +'مع تفعيل المزامنة التلقائية سيُحوَّلون إلى «متوقف عن العمل» خلال دقيقة. '
        +'أزل علامة «المزامنة التلقائية» إن كان الملف جزئياً.</div>'):'')
      +'<div class="wf-sec">عيّنة ('+Math.min(40,a.sample.length)+' من '+a.drivers+')</div>'
      +'<div class="wx4-tblwrap"><table class="wx4-tbl"><thead><tr>'
      +'<th>الإقامة</th><th>الاسم</th><th>المشروع</th><th>سجلات</th><th>الحالة</th><th>الكرت</th></tr></thead><tbody>'
      +a.sample.map(function(s){
        return '<tr><td>'+E(s.iqama)+'</td><td>'+E(s.name||'—')+'</td><td>'+E(s.project||'—')+'</td>'
          +'<td>'+s.n+'</td><td>'+(s.act?'<span class="chip ok">تفويض ساري</span>':'<span class="chip line">بلا تفويض</span>')+'</td>'
          +'<td'+(s.isNew?' class="new"':'')+'>'+(s.isNew?'جديد':'محدّث')+'</td></tr>';
      }).join('')
      +'</tbody></table></div>';

    var foot=document.querySelector('#wx4Modal .wf-foot');
    if(foot) foot.innerHTML='<button class="btn ghost" onclick="closeWx4()">إلغاء</button>'
      +'<button class="btn" onclick="wx4Apply()">✅ تطبيق على النظام</button>';
    body.scrollIntoView({block:'nearest', behavior:'smooth'});
  }

  window.wx4Apply=function(){
    if(!_parsed) return;
    var opts={
      createNew: !!(document.getElementById('wx4o-new')||{}).checked,
      status   : !!(document.getElementById('wx4o-status')||{}).checked,
      mirror   : !!(document.getElementById('wx4o-mirror')||{}).checked,
      replace  : !!(document.getElementById('wx4o-replace')||{}).checked
    };
    var a=_parsed.a, p=_parsed.p;
    ask('تأكيد التطبيق',
      'سيتم تطبيق <b>'+a.dels+'</b> سجل تفويض على <b>'+a.drivers+'</b> سائق'
      +(opts.createNew?('، وإنشاء <b>'+a.newEmp+'</b> كرت موظف جديد'):'، <b>بدون</b> إنشاء كروت جديدة')
      +(opts.replace?'، مع <b>استبدال</b> سجلات المركبات القديمة':'')
      +'. متابعة؟',
      function(){
        var rep=applyImport(p, a, opts);
        showReport(rep, a);
      },'تطبيق');
  };

  function showReport(rep, a){
    openWx4('✅ تقرير الاستيراد',
      '<div class="wx4-tiles">'
      +'<div><b>'+rep.added+'</b><span>كرت موظف جديد</span></div>'
      +'<div><b>'+rep.updated+'</b><span>كرت محدّث</span></div>'
      +'<div><b>'+rep.vehicles+'</b><span>سجل مركبة أُضيف</span></div>'
      +'<div><b>'+rep.notes+'</b><span>ملاحظة/حادث</span></div>'
      +'</div>'
      +'<div class="wx4-tiles g">'
      +'<div><b>'+rep.activated+'</b><span>صار على رأس العمل</span></div>'
      +'<div><b>'+rep.stopped+'</b><span>صار متوقفاً عن العمل</span></div>'
      +'<div><b>'+rep.closed+'</b><span>تفويض قديم أُغلق</span></div>'
      +'</div>'
      +'<div class="wx4-hint">💾 حُفِظت التغييرات محلياً على هذا الجهاز فوراً'
      +'. يمكنك تصدير تقرير مفصّل بكل الموظفين المتأثرين.</div>',
      '<button class="btn ghost" onclick="wx4ExportReport()">⬇️ تصدير التقرير</button>'
      +'<button class="btn" onclick="closeWx4()">تم</button>');
    window.__wx4rep=rep;
  }
  window.wx4ExportReport=function(){
    var rep=window.__wx4rep; if(!rep) return;
    var head=['رقم الإقامة','الاسم','المشروع','عدد سجلات المركبات','التفويض','الكرت'];
    var rows=[head].concat(rep.rows);
    var csv='\ufeff'+rows.map(function(r){ return r.map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
    var b=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var a2=document.createElement('a'); a2.href=URL.createObjectURL(b);
    a2.download='تقرير-استيراد-المركبات-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a2); a2.click(); a2.remove();
    T('تم تصدير التقرير');
  };

  /* ============================================================
     الحقن في الواجهة
     ============================================================ */
  function injectMenu(){
    var dm=document.getElementById('dataMenu'); if(!dm) return;
    if(!document.getElementById('wx4Veh')){
      var sep=document.createElement('div'); sep.className='sep'; sep.id='wx4Sep1';
      var b0=document.createElement('button'); b0.id='wx4Veh';
      b0.innerHTML='🚗 رفع ملفات المركبات (JSON)';
      b0.onclick=window.wx4OpenVehImport;
      dm.appendChild(sep); dm.appendChild(b0);
    }
    if(!document.getElementById('wx4Link')){
      var sep2=document.createElement('div'); sep2.className='sep';
      var b1=document.createElement('button'); b1.id='wx4Link'; b1.innerHTML='🔗 ربط ملف الحفظ على الجهاز'; b1.onclick=window.wx4LinkFile;
      var b2=document.createElement('button'); b2.id='wx4Save'; b2.innerHTML='💾 حفظ الآن على الجهاز'; b2.onclick=window.wx4SaveNow;
      var b3=document.createElement('button'); b3.id='wx4Rest'; b3.innerHTML='📂 استرجاع من ملف الجهاز'; b3.onclick=window.wx4Restore;
      dm.appendChild(sep2); dm.appendChild(b1); dm.appendChild(b2); dm.appendChild(b3);
    }
  }
  function injectBtn(){
    if(!isAdmin()) return;
    var bar=document.querySelector('#view-emp .toolbar');
    if(!bar || document.getElementById('wx4VehBtn')) return;
    var b=document.createElement('button');
    b.id='wx4VehBtn'; b.className='btn ghost'; b.textContent='🚗 رفع ملف المركبات';
    b.onclick=window.wx4OpenVehImport;
    bar.appendChild(b);
  }
  ['renderEmp','renderAll','go'].forEach(function(fn){
    var orig=window[fn];
    if(typeof orig!=='function' || orig.__wx4) return;
    window[fn]=function(){ var r=orig.apply(this, arguments); try{ injectBtn(); }catch(e){} return r; };
    window[fn].__wx4=true;
  });

  /* إزالة أي أثر لكلمة Drive/السحابة من الواجهة */
  function relabel(){
    try{
      var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null), n, arr=[];
      while((n=w.nextNode())){ if(/Drive|سحاب/.test(n.nodeValue)) arr.push(n); }
      arr.forEach(function(t){
        t.nodeValue=t.nodeValue
          .replace(/جارٍ التحميل من Drive…?/g,'جارٍ التحميل من الجهاز…')
          .replace(/تُحفظ في Drive وتتزامن للجميع/g,'تُحفظ محلياً على هذا الجهاز')
          .replace(/(في|من|إلى)\s*Drive/g,'على الجهاز')
          .replace(/Drive/g,'الجهاز')
          .replace(/السحابية/g,'المحلية').replace(/السحابة/g,'الجهاز').replace(/سحابي/g,'محلي');
      });
      var cp=document.getElementById('cloudPill'); if(cp) cp.remove();
    }catch(e){}
  }

  /* الإقلاع */
  function boot(){
    mountPill();
    setPill('','محفوظ في المتصفح فقط','🔗 اربط ملفاً على الجهاز');
    idbGet(FS_KEY).then(function(h){
      if(!h) return;
      _h=h;
      perm(h,false).then(function(ok){
        if(ok) setPill('ok','محفوظ على الجهاز · '+E(h.name));
        else   setPill('warn','ملف الحفظ: '+E(h.name),'اضغط لتفعيل الحفظ');
      });
    });
    injectMenu(); injectBtn(); relabel();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  setInterval(function(){ try{ injectMenu(); injectBtn(); relabel(); }catch(e){} }, 3000);
})();
</script>

  border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;font-weight:500}

  background:#fbecea;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 28%,transparent);
  border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:8px}

<script id="wx5-js">
/* ============================================================
   وثيق — الطبقة (٥)
   ١) فصل شارة الحفظ المحلي عن زر الصلاحيات
   ٢) «مدينة العمل» + كل حقول «بيانات العمل» قوائم منسدلة
   ٣) صفحة «العهد» مرتبطة بالكرت المالي (متوقف + عهدة غير مُرجعة = خصم من الراتب)
   ٤) زر تعديل واحد فقط في كرت الموظف
   ٥) إضافة سلفة خارج فترة الرواتب (حتى لو لا يوجد كرت مالي)
   ============================================================ */
(function(){
  if(window.__wx5) return; window.__wx5=true;

  function E(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
  function N(v){ var n=parseFloat(String(v==null?'':v).replace(/[, ]/g,'')); return isNaN(n)?0:n; }
  function F(n){ return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
  function T(m){ try{ toast(m); }catch(e){} }
  function today(){ return new Date().toISOString().slice(0,10); }
  function uid(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function isAdmin(){
    try{ var r=sessionStorage.getItem('wf_session_v3'); if(!r) return true; var u=JSON.parse(r);
      return !!(u && (u.role==='admin' || (u.perms&&u.perms.finance))); }catch(e){ return true; }
  }
  function LS(){ return window.wfLocalStore || {getData:function(){return null;},setData:function(){},remove:function(){}}; }
  function isStopped(e){ return !!e && (e.employment_status==='stopped' || String(e.status_label||'').indexOf('متوقف')>=0); }

  /* نافذة موحّدة */
  function scrim(){
    var s=document.getElementById('wx5Scrim');
    if(!s){
      s=document.createElement('div'); s.className='wf-scrim'; s.id='wx5Scrim';
      s.innerHTML='<div class="wf-modal" id="wx5Modal" style="max-width:620px"></div>';
      document.body.appendChild(s);
      s.addEventListener('click',function(ev){ if(ev.target===s) closeWx5(); });
    }
    return s;
  }
  window.closeWx5=function(){ var s=document.getElementById('wx5Scrim'); if(s) s.classList.remove('on'); };
  function openWx5(title, body, foot){
    scrim();
    document.getElementById('wx5Modal').innerHTML=
      '<div class="wf-head"><div class="nm">'+title+'</div><div class="x" onclick="closeWx5()">✕</div></div>'
      +'<div class="wf-body">'+body+'</div><div class="wf-foot">'+foot+'</div>';
    document.getElementById('wx5Scrim').classList.add('on');
  }
  var _ask=null;
  window.wx5Yes=function(){ var f=_ask; _ask=null; closeWx5(); if(f) f(); };
  function ask(title,msg,fn,ok){
    _ask=fn;
    openWx5(title,'<div style="font-size:14px;line-height:1.95">'+msg+'</div>',
      '<button class="btn ghost" onclick="closeWx5()">إلغاء</button><button class="btn" onclick="wx5Yes()">'+(ok||'تأكيد')+'</button>');
  }
  function save(){ try{ recomputeStats(); }catch(e){} try{ persist(); }catch(e){} }

  /* ============================================================
     (٢) قوائم بيانات العمل المنسدلة
     ============================================================ */
  var CUSTOM_KEY='wx5lists';
  function customLists(){ var o=LS().getData(CUSTOM_KEY); return (o&&typeof o==='object')?o:{}; }
  function addCustom(kind,val){
    val=String(val||'').trim(); if(!val) return;
    var o=customLists(); o[kind]=o[kind]||[];
    if(o[kind].indexOf(val)<0){ o[kind].push(val); LS().setData(CUSTOM_KEY,o); }
  }
  function uniq(arr){ var s={},o=[]; arr.forEach(function(v){ v=String(v==null?'':v).trim(); if(v&&!s[v]){s[v]=1;o.push(v);} }); return o.sort(function(a,b){return a.localeCompare(b,'ar');}); }
  function aclProjects(){
    try{ var a=JSON.parse(localStorage.getItem('wf_acl_cache_v3')||'null'); return (a&&Array.isArray(a.projects))?a.projects:[]; }catch(e){ return []; }
  }
  function listOf(kind){
    var E2=state.employees||[], c=customLists()[kind]||[];
    if(kind==='areas')       return uniq(E2.map(function(e){return e.area||e.city;}).concat(c));
    if(kind==='professions')  return uniq(E2.map(function(e){return e.profession;})
        .concat(['سائق','سائق دراجة نارية','مندوب توصيل','عامل','فني','مشرف','إداري','حارس أمن','عامل نظافة']).concat(c));
    if(kind==='jobs')         return uniq(E2.map(function(e){return e.job_title;}).concat(c));
    if(kind==='projects')     return uniq(E2.map(function(e){return e.project;}).concat(aclProjects()).concat(c));
    if(kind==='items')        return uniq(['جوال','حقيبة توصيل (بوكس)','جاكيت','خوذة','بطاقة بنزين','شريحة اتصال','شاحن','مفاتيح','لوحة/رخصة تشغيل'].concat(c));
    return uniq(c);
  }
  var OTHER='__wx5other__';
  function makeSelect(id, cls, opts, val){
    var s=document.createElement('select');
    s.id=id; if(cls) s.className=cls;
    var has=false;
    var html='<option value="">— اختر —</option>';
    opts.forEach(function(o){ var sel=(String(o)===String(val||'')); if(sel) has=true; html+='<option'+(sel?' selected':'')+'>'+E(o)+'</option>'; });
    if(val && !has) html+='<option selected>'+E(val)+'</option>';
    html+='<option value="'+OTHER+'">— أخرى (كتابة يدوية) —</option>';
    s.innerHTML=html;
    return s;
  }
  function toDropdown(id, kind){
    var el=document.getElementById(id); if(!el) return;
    if(el.tagName!=='INPUT') return;                       /* حُوّل مسبقاً (مثل حقل المشروع) */
    var val=el.value||'', cls=el.className;
    var sel=makeSelect(id, cls, listOf(kind), val);
    sel.addEventListener('change', function(){
      if(sel.value===OTHER){
        var inp=document.createElement('input'); inp.id=id; inp.className=cls; inp.type='text';
        inp.placeholder='اكتب القيمة الجديدة…'; inp.setAttribute('data-wx5-kind',kind);
        sel.parentNode.replaceChild(inp,sel); inp.focus();
      }
    });
    el.parentNode.replaceChild(sel, el);
  }
  function upgradeWorkFields(){
    if(!document.getElementById('ef-area')) return;
    toDropdown('ef-area','areas');
    toDropdown('ef-profession','professions');
    toDropdown('ef-job_title','jobs');
    toDropdown('ef-project','projects');
  }
  ['openEmployeeEdit','openAddEmployee'].forEach(function(fn){
    var orig=window[fn];
    if(typeof orig!=='function' || orig.__wx5) return;
    window[fn]=function(){
      var r=orig.apply(this, arguments);
      setTimeout(upgradeWorkFields, 0);
      setTimeout(upgradeWorkFields, 280);   /* بعد أن يعالج التكامل حقل المشروع */
      return r;
    };
    window[fn].__wx5=true;
  });
  (function(){
    var orig=window.saveEmployee;
    if(typeof orig!=='function' || orig.__wx5) return;
    window.saveEmployee=function(){
      try{
        [['ef-area','areas'],['ef-profession','professions'],['ef-job_title','jobs'],['ef-project','projects']].forEach(function(p){
          var el=document.getElementById(p[0]);
          if(el && el.tagName==='INPUT' && el.value.trim()) addCustom(p[1], el.value.trim());
        });
      }catch(e){}
      return orig.apply(this, arguments);
    };
    window.saveEmployee.__wx5=true;
  })();

  /* ============================================================
     (٣) العهد
     ============================================================ */
  function cList(e){ return Array.isArray(e.custody)?e.custody:(e.custody=[]); }
  /* الخصم يُحتسب دائماً (بلا تعديل على بيانات الراتب المستوردة حتى لا يُفقد عند الاستيراد التالي) */
  function frozenOf(e){   /* عهد مُثبّت خصمها نهائياً (ولم تُسوَّ على راتب بعد) */
    return cList(e).reduce(function(s,c){ return (c.status==='deducted' && !c.settled_period) ? s+N(c.value) : s; },0);
  }
  function pendingOf(e){  /* موظف متوقف ولم يُرجع العهدة → تُخصم تلقائياً */
    if(!isStopped(e)) return 0;
    return cList(e).reduce(function(s,c){ return (c.status==='held' && !c.settled_period) ? s+N(c.value) : s; },0);
  }
  function dueOf(e){ return frozenOf(e)+pendingOf(e); }
  function stLabel(c,e){
    if(c.status==='returned') return '<span class="chip ok">مُرجعة</span>';
    if(c.status==='deducted') return '<span class="chip bad">مخصومة من الراتب</span>';
    return isStopped(e) ? '<span class="chip warn">متوقف — لم تُرجع</span>' : '<span class="chip line">بعهدة الموظف</span>';
  }

  /* تثبيت الخصم: يُجمَّد على العهدة نفسها ويُطرح من الصافي في الكرت المالي دائماً */
  function applyDeduct(e, c){ c.status='deducted'; c.deducted_at=today(); c.applied=true; }
  function newFinance(e){
    return { base:0, days:'', bonus:0, advance:0, accident:0, deduction:0, net:0,
             iban:e.iban||'', account:e.name_ar||'', name:e.name_ar||'', source:'إدخال يدوي', advances:[] };
  }

  function allRows(){
    var out=[];
    (state.employees||[]).forEach(function(e){
      cList(e).forEach(function(c){ out.push({e:e,c:c}); });
    });
    return out;
  }
  function renderCustody(){
    var box=document.getElementById('wx5Tbl'); if(!box) return;
    var rows=allRows();

    /* KPIs */
    var held=0,heldV=0,ret=0,ded=0,dedV=0,dueV=0,dueN=0;
    rows.forEach(function(r){
      var v=N(r.c.value);
      if(r.c.status==='returned'){ ret++; return; }
      if(r.c.status==='deducted'){ ded++; dedV+=v; return; }
      held++; heldV+=v;
      if(isStopped(r.e)){ dueN++; dueV+=v; }
    });
    var k=document.getElementById('wx5Kpis');
    if(k) k.innerHTML=
       '<div class="wx5-kpi"><div class="k">عهد بعهدة الموظفين</div><div class="v">'+held+' <small>بقيمة '+F(heldV)+' ريال</small></div></div>'
      +'<div class="wx5-kpi bad"><div class="k">مستحقة الخصم (متوقفون لم يُرجعوا)</div><div class="v">'+F(dueV)+' <small>ريال · '+dueN+' عهدة</small></div></div>'
      +'<div class="wx5-kpi warn"><div class="k">مخصومة من الرواتب</div><div class="v">'+F(dedV)+' <small>ريال · '+ded+' عهدة</small></div></div>'
      +'<div class="wx5-kpi ok"><div class="k">مُرجعة</div><div class="v">'+ret+' <small>عهدة</small></div></div>';

    var al=document.getElementById('wx5Alert');
    if(al) al.innerHTML = dueN
      ? '<div class="wx5-alert">⚠️ يوجد <b>'+dueN+'</b> عهدة لدى موظفين <b>متوقفين عن العمل</b> ولم تُرجَع — القيمة المستحقة <b>'+F(dueV)+' ريال</b>.'
        +(isAdmin()?'<button class="btn" onclick="wx5DeductAll()">⛔ خصم الكل من الرواتب</button>':'')+'</div>'
      : '';

    /* فلتر المشاريع */
    var pr=document.getElementById('wx5Pr');
    if(pr){
      var set={}; rows.forEach(function(r){ if(r.e.project) set[r.e.project]=1; });
      var cur=_cf.pr;
      pr.innerHTML='<option value="">كل المشاريع</option>'+Object.keys(set).sort().map(function(p){
        return '<option'+(cur===p?' selected':'')+'>'+E(p)+'</option>'; }).join('');
    }

    var q=(_cf.q||'').trim().toLowerCase();
    var list=rows.filter(function(r){
      if(_cf.pr && r.e.project!==_cf.pr) return false;
      if(_cf.st==='held'     && !(r.c.status==='held' && !isStopped(r.e))) return false;
      if(_cf.st==='due'      && !(r.c.status==='held' && isStopped(r.e)))  return false;
      if(_cf.st==='deducted' && r.c.status!=='deducted') return false;
      if(_cf.st==='returned' && r.c.status!=='returned') return false;
      if(q){
        var hay=((r.e.name_ar||'')+' '+(r.e.name_en||'')+' '+(r.e.iqama||'')+' '+(r.c.item||'')+' '+(r.c.note||'')).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    var cnt=document.getElementById('wx5Count');
    if(cnt) cnt.textContent=list.length+' سجل عهدة'+(rows.length!==list.length?(' من '+rows.length):'');

    if(!list.length){ box.innerHTML='<div class="wx5-empty">لا توجد عهد مسجّلة. اضغط «➕ تسليم عهدة» للبدء.</div>'; return; }
    var adm=isAdmin();
    box.innerHTML='<table class="wx5-tbl"><thead><tr>'
      +'<th>الموظف</th><th>الإقامة</th><th>المشروع</th><th>الصنف</th><th>القيمة</th><th>تاريخ التسليم</th>'
      +'<th>الحالة</th><th>الإرجاع</th><th>ملاحظة</th><th></th></tr></thead><tbody>'
      +list.map(function(r){
        var e=r.e,c=r.c, i=idxOf(e.iqama);
        var acts='';
        if(c.status!=='returned') acts+='<button class="wx5-mini ok" onclick="wx5Return(\''+E(e.iqama)+'\',\''+c.id+'\')">✅ إرجاع</button>';
        if(adm && c.status==='held') acts+='<button class="wx5-mini bad" onclick="wx5Deduct(\''+E(e.iqama)+'\',\''+c.id+'\')">⛔ خصم</button>';
        if(adm) acts+='<button class="wx5-mini bad" onclick="wx5DelCustody(\''+E(e.iqama)+'\',\''+c.id+'\')">🗑️</button>';
        return '<tr>'
          +'<td><a href="#" onclick="event.preventDefault();openModal('+i+',\'fin\')" style="color:var(--brand);font-weight:600">'+E(e.name_ar||e.name_en||'—')+'</a></td>'
          +'<td>'+E(e.iqama||'')+'</td><td>'+E(e.project||'—')+'</td><td>'+E(c.item)+'</td>'
          +'<td class="val">'+F(c.value)+'</td><td>'+E(c.date_out||'—')+'</td>'
          +'<td>'+stLabel(c,e)+'</td><td>'+E(c.date_in||'—')+'</td>'
          +'<td style="color:var(--muted)">'+E(c.note||'')+'</td><td>'+acts+'</td></tr>';
      }).join('')+'</tbody></table>';
  }
  window.wx5ExportCustody=function(){
    var rows=allRows();
    if(!rows.length){ T('لا توجد عهد'); return; }
    var head=['الاسم','رقم الإقامة','المشروع','حالة الموظف','الصنف','القيمة','تاريخ التسليم','الحالة','تاريخ الإرجاع','خُصمت من الراتب','ملاحظة'];
    var body=rows.map(function(r){
      var st=r.c.status==='returned'?'مُرجعة':(r.c.status==='deducted'?'مخصومة من الراتب':(isStopped(r.e)?'متوقف — لم تُرجع':'بعهدة الموظف'));
      return [r.e.name_ar||r.e.name_en||'', r.e.iqama||'', r.e.project||'', r.e.status_label||'',
              r.c.item||'', N(r.c.value), r.c.date_out||'', st, r.c.date_in||'', (r.c.status==='deducted'||(r.c.status==='held'&&isStopped(r.e)))?'نعم':'لا', r.c.note||''];
    });
    var csv='\ufeff'+[head].concat(body).map(function(r){
      return r.map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
    var b=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='العهد-'+today()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
    T('تم تصدير العهد');
  };

  var ADVST={ 'new':'بانتظار التعميد', 'approved':'معتمدة', 'disbursed':'مصروفة', 'settled':'مسوّاة' };
  function finStrip(idx){
    var e=state.employees[idx]; if(!e) return '';
    var adm=isAdmin();
    var advs=((e.finance||{}).advances)||[];
    var open=advs.filter(function(a){ return (a.status||'new')!=='settled'; });
    var openSum=open.reduce(function(s,a){ return s+N(a.amount); },0);
    var due=dueOf(e), pend=pendingOf(e);
    var net=N((e.finance||{}).net);

    /* صندوق السلف */
    var advHTML='<div class="wx5-box"><div class="hd">💸 السلف'
      +(openSum?(' <span class="chip warn">قائمة: '+F(openSum)+' ريال</span>'):'')
      +(adm?'<button class="btn sm" onclick="wx5AddAdv('+idx+')">➕ سلفة (خارج فترة الرواتب)</button>':'')+'</div>'
      +(advs.length ? advs.map(function(a,ai){
          var st=a.status||'new';
          return '<div class="wx5-row"><span class="amt">'+F(a.amount)+' ريال</span>'
            +'<span class="chip '+(st==='settled'?'ok':(st==='new'?'warn':'line'))+'">'+(ADVST[st]||st)+'</span>'
            +(a.outside?'<span class="chip sand">خارج فترة الرواتب</span>':'')
            +(a.settled_period?('<span class="chip ok">خُصمت من راتب '+E(a.settled_period)+'</span>'):'')
            +'<span style="color:var(--muted)">'+E(a.note||'')+(a.date?' · '+E(a.date):'')
            +(a.deduct_period?(' · تُخصم من '+E(a.deduct_period)):'')+'</span>'
            +(adm?('<span class="sp">'
              +(st!=='settled'?'<button class="wx5-mini ok" onclick="wx5SetAdv('+idx+','+ai+',\'settled\')">✅ تسوية</button>':'')
              +'<button class="wx5-mini bad" onclick="wx5DelAdv('+idx+','+ai+')">🗑️</button></span>'):'')
            +'</div>';
        }).join('')
        : '<div class="wx5-none">لا توجد سلف مسجّلة.</div>')
      +'</div>';

    /* صندوق العهد */
    var cs=cList(e);
    var cHTML='<div class="wx5-box"><div class="hd">📦 العهد'
      +(cs.length?(' <span class="chip line">'+cs.length+'</span>'):'')
      +(adm?'<button class="btn sm" onclick="wx5AddCustody('+idx+')">➕ تسليم عهدة</button>':'')+'</div>'
      +(cs.length ? cs.map(function(c){
          return '<div class="wx5-row"><span>'+E(c.item)+'</span><span class="amt">'+F(c.value)+' ريال</span>'
            +stLabel(c,e)
            +'<span style="color:var(--muted)">'+E(c.date_out||'')+(c.note?(' · '+E(c.note)):'')+'</span>'
            +'<span class="sp">'
            +(c.status!=='returned'?'<button class="wx5-mini ok" onclick="wx5Return(\''+E(e.iqama)+'\',\''+c.id+'\')">✅ إرجاع</button>':'')
            +(adm&&c.status==='held'?'<button class="wx5-mini bad" onclick="wx5Deduct(\''+E(e.iqama)+'\',\''+c.id+'\')">⛔ خصم</button>':'')
            +'</span></div>';
        }).join('')
        : '<div class="wx5-none">لا توجد عهد مسلّمة لهذا الموظف.</div>')
      +(due ? ('<div class="wx5-due"><span>⛔ خصم عهد: '+F(due)+' ريال</span>'
              +'<span>'+(net>0 ? ('الصافي بعد خصم العهد: '+F(net-due)+' ريال') : 'يُخصم من أول راتب مستحق')+'</span></div>') : '')
      +(pend ? ('<div class="wx5-hint">⚠️ الموظف متوقف عن العمل ولم يُرجع عهدة بقيمة <b>'+F(pend)+'</b> ريال — '
              +'تُخصم تلقائياً من راتبه'+(adm?'، واضغط «⛔ خصم» لتثبيتها نهائياً.':'.')+'</div>') : '')
      +'</div>';

    return '<div class="wx5-fin" id="wx5Fin">'+advHTML+cHTML+'</div>';
  }
  function injectFin(){
    var pane=document.getElementById('pane-fin');
    if(!pane || document.getElementById('wx5Fin')) return;
    if(state.current==null) return;
    var d=document.createElement('div');
    d.innerHTML=finStrip(state.current);
    if(d.firstChild) pane.insertBefore(d.firstChild, pane.firstChild);
  }
  function observe(){
    var m=document.getElementById('modal'); if(!m || m.__wx5) return;
    m.__wx5=true;
    new MutationObserver(function(){ try{ injectFin(); }catch(e){} }).observe(m,{childList:true, subtree:true});
  }

  /* ============================================================
     الإقلاع
     ============================================================ */
  function refresh(){
    try{ renderCustody(); }catch(e){}
    try{ if(state.view==='emp') renderEmp(); }catch(e){}
  }
  (function(){
    var orig=window.go;
    if(typeof orig==='function' && !orig.__wx5){
      window.go=function(v){
        var r=orig.apply(this, arguments);
        if(v==='wx5_custody'){ try{ renderCustody(); }catch(e){} }
        return r;
      };
      window.go.__wx5=true;
    }
  })();
  function boot(){ buildTab(); observe(); injectFin(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  setInterval(function(){ try{ buildTab(); observe(); injectFin(); }catch(e){} }, 2500);
})();
</script>
