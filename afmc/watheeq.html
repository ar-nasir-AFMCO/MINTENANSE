  var st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);

  /* ===================== الزر العائم + النافذة ===================== */
  var scrim, modalBody, modalTabs, activeTab='projects';
  function mountUI(){
    if(!document.body){ return setTimeout(mountUI,300); }
    var btn=document.createElement('button');
    btn.className='wfi-btn'; btn.id='wfiBtn';
    btn.innerHTML='⚙️ الصلاحيات والتكامل';
    btn.onclick=openPanel;
    document.body.appendChild(btn);

    scrim=document.createElement('div'); scrim.className='wfi-scrim';
    scrim.innerHTML='<div class="wfi-modal">'
      +'<div class="wfi-head"><div style="font-weight:700">لوحة التكامل — '+(APP==='watheeq'?'وثيق':'Fleet OS')+'</div><div class="x" id="wfiClose">✕</div></div>'
      +'<div class="wfi-tabs" id="wfiTabs"></div>'
      +'<div class="wfi-body" id="wfiBody"></div></div>';
    document.body.appendChild(scrim);
    scrim.addEventListener('click',function(e){ if(e.target===scrim) closePanel(); });
    document.getElementById('wfiClose').onclick=closePanel;
    modalBody=document.getElementById('wfiBody');
    modalTabs=document.getElementById('wfiTabs');
  }
  function openPanel(){ if(!can('manage')){ alert('صفحة الصلاحيات للموظف الاداري فقط.'); return; } scrim.classList.add('on'); renderTabs(); renderTab(); }
  function closePanel(){ scrim.classList.remove('on'); }

  function renderTabs(){
    var tabs=[['projects','المشاريع'],['perms','الصلاحيات'],['online','المتصلون الآن'],['audit','سجل التعديلات']];
    if(APP==='fleetos') tabs.push(['idle','المناديب من وثيق']);
    if(APP==='watheeq') tabs.push(['fleetupd','تحديثات من الأسطول']);
    tabs.push(['login','تسجيل الدخول']);
    modalTabs.innerHTML=tabs.map(function(t){
      return '<div class="wfi-tab'+(activeTab===t[0]?' on':'')+'" data-t="'+t[0]+'">'+t[1]+'</div>';
    }).join('');
    Array.prototype.forEach.call(modalTabs.querySelectorAll('.wfi-tab'),function(el){
      el.onclick=function(){ activeTab=el.getAttribute('data-t'); renderTabs(); renderTab(); };
    });
  }
  function renderTab(){
    if(activeTab==='projects') return renderProjectsTab();
    if(activeTab==='perms')    return renderPermsTab();
    if(activeTab==='online')   return renderOnlineTab();
    if(activeTab==='audit')    return renderAuditTab();
    if(activeTab==='idle')     return renderIdleTab();
    if(activeTab==='fleetupd') return renderFleetUpdTab();
    if(activeTab==='login')    return renderLoginTab();
  }
  function renderOnlineTab(){
    modalBody.innerHTML='<div class="wfi-sec">🟢 المتصلون الآن</div><div class="wfi-warn">جارٍ التحديث…</div>';
    getOnline().then(function(list){
      var html='<div class="wfi-sec">🟢 المتصلون الآن ('+list.length+')</div>';
      if(!list.length){ html+='<div style="color:#64748b">لا يوجد متصلون حالياً.</div>'; modalBody.innerHTML=html; return; }
      html+='<table class="wfi-tbl"><thead><tr><th>المستخدم</th><th>التطبيق</th><th>آخر ظهور</th></tr></thead><tbody>';
      list.forEach(function(p){
        var secs=Math.max(0,Math.round((Date.now()-p.ts)/1000));
        html+='<tr><td>🟢 '+esc(p.name||p.user)+'</td><td>'+(p.app==='watheeq'?'وثيق':'الأسطول')+'</td><td>قبل '+secs+' ث</td></tr>';
      });
      html+='</tbody></table>';
      modalBody.innerHTML=html;
    });
  }
  function renderAuditTab(){
    modalBody.innerHTML='<div class="wfi-sec">📝 سجل التعديلات</div><div class="wfi-warn">جارٍ التحميل…</div>';
    cloudGet('audit').then(function(r){
      var log=(r&&r.data&&Array.isArray(r.data.entries))?r.data.entries.slice().reverse():[];
      var html='<div class="wfi-sec">📝 سجل التعديلات (آخر '+Math.min(log.length,150)+')</div>';
      html+='<div class="wfi-warn">يسجّل من قام بالتعديل ومتى وفي أي تطبيق.</div>';
      if(!log.length){ html+='<div style="color:#64748b">لا توجد تعديلات مسجّلة بعد.</div>'; modalBody.innerHTML=html; return; }
      html+='<table class="wfi-tbl"><thead><tr><th>المستخدم</th><th>التطبيق</th><th>الوقت</th></tr></thead><tbody>';
      log.slice(0,150).forEach(function(e){
        html+='<tr><td>'+esc(e.user||'—')+'</td><td>'+(e.app==='watheeq'?'وثيق':'الأسطول')+'</td><td>'+esc(fmtTime(e.ts))+'</td></tr>';
      });
      html+='</tbody></table>';
      modalBody.innerHTML=html;
    });
  }
  function fmtTime(ts){ try{ var d=new Date(ts); return d.toLocaleString('ar'); }catch(e){ return ''+ts; } }

  /* ---------- تبويب المشاريع ---------- */
  function renderProjectsTab(){
    var canEdit = can('manage');
    var html='<div class="wfi-sec">📁 قائمة المشاريع المشتركة</div>';
    html+='<div class="wfi-warn">هذه القائمة تظهر كقائمة منسدلة في «وثيق» و«Fleet OS» معاً، وتُحفظ في Drive وتتزامن للجميع.</div>';
    html+='<div id="wfiProjChips">'+acl.projects.map(function(p){
      return '<span class="wfi-chip">'+esc(p)+(canEdit?' <b data-p="'+esc(p)+'" title="حذف">✕</b>':'')+'</span>';
    }).join('')+'</div>';
    if(canEdit){
      html+='<div class="wfi-row" style="margin-top:10px"><input class="wfi-inp" id="wfiNewProj" placeholder="اسم مشروع جديد"><button class="wfi-prim" id="wfiAddProj">➕ إضافة</button></div>';
    }
    modalBody.innerHTML=html;
    if(canEdit){
      document.getElementById('wfiAddProj').onclick=function(){
        var v=(document.getElementById('wfiNewProj').value||'').trim();
        if(!v) return;
        if(acl.projects.indexOf(v)<0){ acl.projects.push(v); saveAcl(); }
        renderProjectsTab();
      };
      Array.prototype.forEach.call(modalBody.querySelectorAll('#wfiProjChips b'),function(b){
        b.onclick=function(){
          var p=b.getAttribute('data-p');
          if(confirm('حذف المشروع «'+p+'» من القائمة؟')){ acl.projects=acl.projects.filter(function(x){return x!==p;}); saveAcl(); renderProjectsTab(); }
        };
      });
    }
  }

  /* ---------- تبويب الصلاحيات ---------- */
  function renderPermsTab(){
    if(acl.requireLogin && !can('manage')){ modalBody.innerHTML='<div class="wfi-warn">لا تملك صلاحية إدارة المستخدمين.</div>'; return; }
    var pending=acl.users.filter(function(u){return u.role==='pending';}).length;
    var rows=acl.users.map(function(u,i){
      var roleBadge = u.role==='admin'?'<span class="wfi-badge admin">موظف اداري</span>'
                    : u.role==='pending'?'<span class="wfi-badge pend">بانتظار الاعتماد</span>'
                    : '<span class="wfi-badge sup">مشرف</span>';
      return '<tr'+(u.role==='pending'?' style="background:#fffbeb"':'')+'>'
        +'<td><b>'+esc(u.username)+'</b></td>'
        +'<td>'+roleBadge+'</td>'
        +'<td>'+appsBadges(u)+'</td>'
        +'<td>'+esc(u.project||'الكل')+'</td>'
        +'<td>'+esc(u.section||'—')+'</td>'
        +'<td>'+tabsBadges(u)+'</td>'
        +'<td>'+permBadges(u)+'</td>'
        +'<td style="white-space:nowrap"><button class="wfi-ghost" data-edit="'+i+'">تعديل</button> <button class="wfi-ghost" data-del="'+i+'" style="color:#dc2626;border-color:#fca5a5">حذف</button></td></tr>';
    }).join('');
    modalBody.innerHTML=''
      +'<div class="wfi-sec">🔐 صفحة الصلاحيات</div>'
      +(pending?'<div class="wfi-warn" style="background:#fef9c3;border-color:#fde047">🔔 لديك '+pending+' طلب وصول بانتظار الاعتماد — اضغط «تعديل» على الصف لتحديد صلاحياته.</div>':'')
      +'<div style="overflow:auto"><table class="wfi-tbl"><thead><tr>'
      +'<th>المستخدم</th><th>الدور</th><th>التطبيقات</th><th>المشروع</th><th>القسم</th><th>تبويبات وثيق</th><th>الصلاحيات</th><th>إجراءات</th>'
      +'</tr></thead><tbody>'
      +(rows||'<tr><td colspan="8" style="text-align:center;color:#64748b">لا يوجد مستخدمون بعد</td></tr>')
      +'</tbody></table></div>'
      +'<div style="margin-top:14px"><button class="wfi-prim" id="wfiAddUser">➕ إضافة مستخدم</button> <button class="wfi-ghost" id="wfiResetUsers" style="color:#dc2626;border-color:#fca5a5">🗑 إعادة تعيين كل المستخدمين</button></div>'
      +'<div id="wfiUserForm"></div>';
    document.getElementById('wfiAddUser').onclick=function(){ userForm(null); };
    var rb=document.getElementById('wfiResetUsers');
    if(rb) rb.onclick=function(){
      if(!confirm('سيتم حذف جميع المستخدمين والصلاحيات، وستظهر شاشة إنشاء حساب المالك من جديد على هذا الجهاز. متابعة؟')) return;
      acl.users=[]; saveAcl(); setUser(null);
      closePanel(); window.__wfPresenceStarted=false; hideEverything(); showGateSetup();
    };
    Array.prototype.forEach.call(modalBody.querySelectorAll('[data-edit]'),function(b){ b.onclick=function(){ userForm(parseInt(b.getAttribute('data-edit'),10)); }; });
    Array.prototype.forEach.call(modalBody.querySelectorAll('[data-del]'),function(b){ b.onclick=function(){ var i=parseInt(b.getAttribute('data-del'),10); if(confirm('حذف هذا المستخدم؟')){ acl.users.splice(i,1); saveAcl(); renderPermsTab(); } }; });
  }
  function appsBadges(u){
    if(u.role==='admin') return '<span class="wfi-badge">وثيق</span> <span class="wfi-badge">الأسطول</span>';
    var a=Array.isArray(u.apps)?u.apps:[], m=[];
    if(a.indexOf('watheeq')>=0)m.push('<span class="wfi-badge">وثيق</span>');
    if(a.indexOf('fleetos')>=0)m.push('<span class="wfi-badge">الأسطول</span>');
    return m.join(' ')||'—';
  }
  function tabsBadges(u){
    if(u.role==='admin') return '<span class="wfi-badge">الكل</span>';
    var t=u.tabs||{dash:false,emp:true,proj:false}, m=[];
    if(t.dash)m.push('لوحة'); if(t.emp!==false)m.push('الموظفون'); if(t.proj)m.push('المشاريع');
    return m.length?m.join('، '):'—';
  }
  function permBadges(u){
    if(u.role==='admin') return '<span class="wfi-badge admin">كل الصلاحيات</span>';
    var p=u.perms||{}, m=[];
    if(p.view)m.push('عرض'); if(p.edit)m.push('تعديل'); if(p.finance)m.push('<b style="color:#0f766e">مالي</b>'); if(p.manage)m.push('إدارة');
    return m.length?m.join('، '):'—';
  }
  function userForm(idx){
    var u = idx!=null ? acl.users[idx] : {username:'',project:'',section:'',role:'supervisor',password:'',apps:['watheeq'],tabs:{dash:false,emp:true,proj:false},perms:{view:true,edit:true,finance:false,manage:false}};
    var ua = Array.isArray(u.apps)? u.apps : ['watheeq','fleetos'];
    var ut = u.tabs || {dash:false,emp:true,proj:false};
    var projOpts='<option value="">— كل المشاريع —</option>'+acl.projects.map(function(p){return '<option '+(u.project===p?'selected':'')+'>'+esc(p)+'</option>';}).join('');
    var f=document.getElementById('wfiUserForm');
    f.innerHTML='<div class="wfi-card" style="margin-top:12px">'
      +'<div class="wfi-formhead">'+(idx!=null?('تعديل: '+esc(u.username)):'مستخدم جديد')+'</div>'
      // الأساسيات
      +'<table class="wfi-form"><tr><th>الإيميل / المستخدم</th><td><input class="wfi-inp" id="wfiU_name" value="'+esc(u.username)+'" style="width:100%"></td>'
      +'<th>كلمة السر</th><td><input class="wfi-inp" id="wfiU_pass" value="'+esc(u.password||'')+'" style="width:100%"></td></tr>'
      +'<tr><th>الدور</th><td><select class="wfi-sel" id="wfiU_role" style="width:100%"><option value="supervisor" '+(u.role!=='admin'?'selected':'')+'>مشرف</option><option value="admin" '+(u.role==='admin'?'selected':'')+'>موظف اداري (كل الصلاحيات)</option></select></td>'
      +'<th>القسم/المنطقة</th><td><input class="wfi-inp" id="wfiU_section" value="'+esc(u.section||'')+'" placeholder="اختياري: سيارة/دراجة أو منطقة" style="width:100%"></td></tr>'
      +'<tr><th>المشروع المصرّح</th><td colspan="3"><select class="wfi-sel" id="wfiU_proj" style="min-width:240px">'+projOpts+'</select> <span style="font-size:12px;color:#64748b">«كل المشاريع» = بلا قيد مشروع</span></td></tr>'
      +'</table>'
      // الوصول للتطبيقات + التبويبات + الصلاحيات (جداول)
      +'<div id="wfiU_scope"><table class="wfi-form"><tr><th style="width:130px">الوصول للتطبيقات</th><td>'
      +chk('wfiA_watheeq','وثيق',ua.indexOf('watheeq')>=0)+chk('wfiA_fleetos','الأسطول (Fleet)',ua.indexOf('fleetos')>=0)+'</td></tr>'
      +'<tr><th>تبويبات وثيق المسموحة</th><td>'
      +chk('wfiT_dash','لوحة المعلومات',!!ut.dash)+chk('wfiT_emp','الموظفون',ut.emp!==false)+chk('wfiT_proj','المشاريع',!!ut.proj)+'</td></tr>'
      +'<tr><th>الصلاحيات</th><td>'
      +chk('wfiP_view','عرض',!!(u.perms&&u.perms.view))+chk('wfiP_edit','تعديل',!!(u.perms&&u.perms.edit))+chk('wfiP_finance','بيانات مالية/آيبان',!!(u.perms&&u.perms.finance))+chk('wfiP_manage','إدارة الإعدادات',!!(u.perms&&u.perms.manage))+'</td></tr>'
      +'</table></div>'
      +'<div class="wfi-row" style="margin-top:10px"><button class="wfi-prim" id="wfiU_save">💾 حفظ</button> <button class="wfi-ghost" id="wfiU_cancel">إلغاء</button></div>'

  /* ---------- تبويب تسجيل الدخول/الإعدادات ---------- */

    } else {
      html+='<div class="wfi-card"><div class="wfi-row"><input class="wfi-inp" id="wfiL_name" placeholder="اسم المستخدم"><input class="wfi-inp" id="wfiL_pass" type="password" placeholder="كلمة السر"><button class="wfi-prim" id="wfiLogin">دخول</button></div></div>';

    var li=document.getElementById('wfiLogin'); if(li) li.onclick=function(){ doLogin(document.getElementById('wfiL_name').value, document.getElementById('wfiL_pass').value, function(ok){ if(!ok) alert('بيانات الدخول غير صحيحة'); else { enforcePerms(); renderTabs(); renderTab(); } }); };

  function userHasApp(u){ if(u.role==='admin') return true; var a=Array.isArray(u.apps)?u.apps:[]; return a.indexOf(APP)>=0; }
  function doLogin(name,pass,cb){
    name=(name||'').trim().toLowerCase();
    var u=acl.users.filter(function(x){return (x.username||'').toLowerCase()===name && String(x.password)===String(pass);})[0];
    if(!u || u.role==='pending'){ cb&&cb(false); return; }
    if(!userHasApp(u)){ cb&&cb(false,'noapp'); return; }   // ليس لديه وصول لهذا التطبيق
    setUser({username:u.username,role:u.role,project:u.project,section:u.section||'',apps:u.apps,perms:u.perms}); cb&&cb(true);

  /* ===================== قوائم المشاريع المنسدلة ===================== */

  /* ===================== فرض الصلاحيات (أفضل جهد) ===================== */
  var _financeObserver=null, _maskTimer=null, _masking=false;
  function scheduleMask(){
    if(_maskTimer) return;
    _maskTimer=setTimeout(function(){ _maskTimer=null; runMask(); }, 300);
  }
  function runMask(){
    if(_masking) return;                       // منع الاستدعاء المتداخل
    if(!(acl.requireLogin && !can('finance'))) return;
    _masking=true;
    try{ if(_financeObserver) _financeObserver.disconnect(); }catch(e){}   // لا نراقب أثناء التعديل (يكسر الحلقة)
    try{ maskFinance(); }catch(e){}
    try{ if(_financeObserver && acl.requireLogin && !can('finance')) _financeObserver.observe(document.body||document.documentElement,{childList:true,subtree:true}); }catch(e){}
    _masking=false;
  }
  function enforcePerms(){
    try{
      var hideEdit = !can('edit');
      var hideFinance = !can('finance');
      // إخفاء أزرار الإضافة/التعديل الشائعة
      if(hideEdit){
        Array.prototype.forEach.call(document.querySelectorAll('button,[onclick]'),function(b){
          var t=(b.textContent||'')+''+(b.getAttribute&&b.getAttribute('onclick')||'');
          if(/إضافة|تعديل|حذف|Add|Edit|Delete|➕|✏️|🗑/.test(t) && !b.closest('.wfi-modal')) b.style.display='none';
        });
      }
      // البيانات المالية: لا تظهر إلا بإذن (finance)
      if(hideFinance){
        if(!_financeObserver){
          try{
            _financeObserver=new MutationObserver(function(){ scheduleMask(); });   // مؤجّل + غير متداخل
          }catch(e){}
        }
        runMask();   // تطبيق أولي (يربط المراقب بعدها)
      } else if(_financeObserver){
        try{ _financeObserver.disconnect(); }catch(e){} _financeObserver=null;
      }
      // زر الإعدادات يحتاج صلاحية إدارة
      var gb=document.getElementById('wfiBtn');
      if(gb) gb.style.display=(!can('manage'))?'none':'';
      // تطبيق نطاق المشروع/القسم (عرض فقط)
      applyScope();
      enforceWatheeqTabs();
    }catch(e){}
  }

  /* ===================== نطاق البيانات (مشروع/قسم) — طبقة العرض فقط ===================== */
  var _scopeWired=false;
  function scopeUser(){ var u=currentUser(); if(!u || u.role==='admin') return null; if(!u.project && !u.section) return null; return u; }
  function applyScope(){
    var u=scopeUser();
    showScopeBanner();
    setTimeout(enhanceSearchBoxes, 200);
    if(!u) return;
    if(APP==='watheeq') wireWatheeqScope(u); else if(APP==='fleetos') wireFleetScope(u);
  }
  function enforceWatheeqTabs(){
    if(APP!=='watheeq') return;
    var u=currentUser(); if(!u || u.role==='admin') return;
    var t=u.tabs||{dash:false,emp:true,proj:false};
    var allow={dash:!!t.dash, emp:(t.emp!==false), proj:!!t.proj};
    // المستخدم المقيّد بمشروع/قسم لا يرى لوحة المعلومات ولا المشاريع (تجمّع كل المشاريع)
    if(u.project || u.section){ allow.dash=false; allow.proj=false; }
    var firstAllowed=null; ['emp','dash','proj'].forEach(function(k){ if(allow[k]&&!firstAllowed) firstAllowed=k; });
    ['dash','emp','proj'].forEach(function(k){
      var btn=document.querySelector('[data-view="'+k+'"]');
      if(btn) btn.style.display=allow[k]?'':'none';
    });
    try{
      var cur=(typeof state!=='undefined'&&state.view)?state.view:null;
      if(cur && allow[cur]===false && firstAllowed){ var fb=document.querySelector('[data-view="'+firstAllowed+'"]'); if(fb) fb.click(); }
    }catch(e){}
  }
  function hideEl(el){ if(el){ el.style.display='none'; } }
  function lockWatheeqFilter(u){
    try{
      if(typeof state==='undefined' || !state.filter) return;
      if(u.project) state.filter.project=u.project;
      if(u.section){ var s=u.section.toLowerCase();
        if(/سيار|car|خصوص/.test(s)) state.filter.cat='car';
        else if(/دراج|moto|bike|نار/.test(s)) state.filter.cat='motorcycle';
      }
    }catch(e){}
  }
  function wireWatheeqScope(u){
    try{ hideEl(document.getElementById('fProject')); }catch(e){}
    try{ if(u.section) hideEl(document.getElementById('fCat')); }catch(e){}
    lockWatheeqFilter(u);
    try{ if(typeof window.renderEmp==='function') window.renderEmp(); }catch(e){}
    try{ if(typeof syncControls==='function') syncControls(); }catch(e){}
  }
  function lockFleetFilter(u){
    try{
      var fp=document.getElementById('f-project');
      if(fp && u.project){
        var has=false; for(var i=0;i<fp.options.length;i++){ if(fp.options[i].value===u.project){ has=true; break; } }
        if(!has){ var o=document.createElement('option'); o.value=u.project; o.textContent=u.project; fp.appendChild(o); }
        fp.value=u.project;
      }
      if(u.section){
        var fa=document.getElementById('f-area');
        if(fa){ for(var j=0;j<fa.options.length;j++){ if(fa.options[j].value===u.section){ fa.value=u.section; break; } } }
      }
    }catch(e){}
  }
  function wireFleetScope(u){
    try{ hideEl(document.getElementById('f-project')); }catch(e){}
    try{ if(u.section) hideEl(document.getElementById('f-area')); }catch(e){}
    if(!_scopeWired){
      _scopeWired=true;
      try{
        if(typeof window.applyFilters==='function'){
          var origAF=window.applyFilters;
          window.applyFilters=function(){ var su=scopeUser(); if(su) lockFleetFilter(su); return origAF.apply(this,arguments); };
        }
      }catch(e){}
    }
    lockFleetFilter(u);
    try{ if(typeof window.applyFilters==='function') window.applyFilters(); }catch(e){}
  }

  function maskFinance(){
    try{
      // 1) تمويه الآيبان (SA..) وأرقام الحسابات الطويلة
      var rxIban=/\bSA\d{2}[\d\s]{12,}\b/;
      walkText(document.body,function(node){
        if(node.__wfMasked) return;
        if(node.parentNode && node.parentNode.closest && node.parentNode.closest('.wfi-modal,#wfiGate')) return;
        if(rxIban.test(node.nodeValue)){
          var span=document.createElement('span'); span.className='wfi-iban-mask'; span.textContent=node.nodeValue;
          node.__wfMasked=true; try{ node.parentNode.replaceChild(span,node); }catch(e){}
        }
      });
      // 2) إخفاء عناصر/حقول ذات دلالة مالية (مرّة واحدة لكل عنصر عبر علامة)
      Array.prototype.forEach.call(document.querySelectorAll('.wf-fin,[data-fin],.finance,.fin,#ef-iban,#ev-iban,[id*="iban"],[id*="salary"],[id*="finance"]'),function(el){
        if(el.__wfFinHidden) return;
        if(el.closest('.wfi-modal,#wfiGate')) return;
        var box=el.closest('.wf-field,.ff,.field')||el;
        box.__wfFinHidden=true; box.style.display='none';
      });
    }catch(e){}
  }
  function walkText(root,fn){
    if(!root) return; var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false),n;
    var arr=[]; while((n=w.nextNode())) arr.push(n); arr.forEach(fn);
  }

  /* ===================== المطابقة بين التطبيقين ===================== */
  function normId(x){ return String(x==null?'':x).replace(/\.0$/,'').replace(/[^0-9]/g,''); }
  function normName(x){ return String(x==null?'':x).replace(/\s+/g,' ').trim(); }

  /* ====== الأسطول: مناديب جدد من وثيق (إيدل) ====== */
  function renderIdleTab(){
    modalBody.innerHTML='<div class="wfi-sec">🆕 المناديب من وثيق</div><div class="wfi-warn">جارٍ التحميل من Drive…</div>';
    cloudGet('watheeq').then(function(r){
      var emps=(r&&r.data&&Array.isArray(r.data.employees))?r.data.employees:[];
      // مجموعة معرّفات/أسماء السائقين الحاليين في الأسطول
      var inFleetId={}, inFleetName={};
      try{
        (vehicles||[]).forEach(function(v){
          (v.history||[]).forEach(function(h){
            if(h.driver_id) inFleetId[normId(h.driver_id)]=1;
            if(h.name_ar) inFleetName[normName(h.name_ar)]=1;
          });
          if(v.current_driver){ if(v.current_driver.driver_id) inFleetId[normId(v.current_driver.driver_id)]=1; if(v.current_driver.name_ar) inFleetName[normName(v.current_driver.name_ar)]=1; }
        });
      }catch(e){}
      var ackSet={}; acl.ackFleet.forEach(function(k){ ackSet[k]=1; });
      // مرشّحون: موظف فعّال في وثيق (مندوب) غير موجود في الأسطول وغير مستلَم
      var _su=scopeUser();
      var idle=emps.filter(function(e){
        if(!e || e.employment_status==='salary_only') return false;
        if(_su && _su.project && e.project!==_su.project) return false;
        var id=normId(e.iqama), nm=normName(e.name_ar);
        if(ackSet[id]) return false;
        return !(inFleetId[id] || (nm&&inFleetName[nm]));
      });
      var html='<div class="wfi-sec">🆕 المناديب من وثيق</div>';
      html+='<div class="wfi-warn">مناديب مُضافون في «وثيق» وليس لهم سيارة في الأسطول بعد — يظهرون كـ «إيدل» حتى استلامهم.</div>';
      if(!idle.length){ html+='<div style="color:#64748b">لا يوجد مناديب جدد حالياً.</div>'; modalBody.innerHTML=html; return; }
      _idleList=idle;
      html+='<table class="wfi-tbl"><thead><tr><th>الاسم</th><th>الإقامة</th><th>الجوال</th><th>المشروع</th><th>الحالة</th><th></th></tr></thead><tbody>';
      idle.forEach(function(e,i){
        html+='<tr><td>'+esc(e.name_ar||e.name_en||'')+'</td><td>'+esc(e.iqama||'')+'</td><td>'+esc(e.mobile||'')+'</td><td>'+esc(e.project||'')+'</td>'
          +'<td><span class="wfi-idle">إيدل / IDLE</span></td>'
          +'<td><button class="wfi-prim" data-assign="'+i+'">🚗 إسناد لمركبة</button> <button class="wfi-ghost" data-ack="'+esc(normId(e.iqama))+'">تم الاستلام</button></td></tr>';
      });
      html+='</tbody></table><div id="wfiAssignWrap"></div>';
      modalBody.innerHTML=html;
      Array.prototype.forEach.call(modalBody.querySelectorAll('[data-ack]'),function(b){
        b.onclick=function(){ var k=b.getAttribute('data-ack'); if(acl.ackFleet.indexOf(k)<0){ acl.ackFleet.push(k); saveAcl(); } renderIdleTab(); };
      });
      Array.prototype.forEach.call(modalBody.querySelectorAll('[data-assign]'),function(b){
        b.onclick=function(){ openAssign(_idleList[parseInt(b.getAttribute('data-assign'),10)]); };
      });
    });
  }
  var _idleList=[];

  /* ---------- إسناد مندوب إلى مركبة (بحث + تثبيت في الأسطول ووثيق) ---------- */
  function openAssign(emp){
    if(!emp) return;
    var wrap=document.getElementById('wfiAssignWrap'); if(!wrap) return;
    wrap.innerHTML='<div class="wfi-card" style="margin-top:12px;border-color:#0f766e">'
      +'<div class="wfi-sec">🚗 إسناد «'+esc(emp.name_ar||emp.name_en||'')+'» إلى مركبة</div>'
      +'<div class="wfi-row"><input class="wfi-inp" id="wfiVQ" placeholder="ابحث: لوحة / نوع / مشروع / منطقة" style="min-width:260px">'
      +'<label style="font-size:13px"><input type="checkbox" id="wfiVAvail" checked> المتاحة فقط</label></div>'
      +'<div id="wfiVResults" style="max-height:320px;overflow:auto"></div>'
      +'<div class="wfi-row" style="margin-top:8px"><button class="wfi-ghost" id="wfiVClose">إلغاء</button></div></div>';
    document.getElementById('wfiVClose').onclick=function(){ wrap.innerHTML=''; };
    var q=document.getElementById('wfiVQ'), av=document.getElementById('wfiVAvail');
    function run(){ renderVehResults(emp, q.value, av.checked); }
    q.oninput=run; av.onchange=run; run();
    q.focus();
  }
  function renderVehResults(emp,query,availOnly){
    var box=document.getElementById('wfiVResults'); if(!box) return;
    var ql=(query||'').trim().toLowerCase();
    var list=(vehicles||[]).filter(function(v){
      if(availOnly && v.vehicle_status==='assigned') return false;
      if(!ql) return true;
      return ((v.plate||'')+' '+(v.vehicle_type||'')+' '+(v.project||'')+' '+(v.area||'')+' '+(v.rental_office||'')).toLowerCase().indexOf(ql)>=0;
    }).slice(0,60);
    if(!list.length){ box.innerHTML='<div style="color:#64748b;padding:8px">لا توجد مركبات مطابقة.</div>'; return; }
    box.innerHTML='<table class="wfi-tbl"><thead><tr><th>اللوحة</th><th>النوع</th><th>المشروع</th><th>المنطقة</th><th>الحالة</th><th></th></tr></thead><tbody>'
      +list.map(function(v,i){
        var cur=v.current_driver?('<div style="font-size:11px;color:#b45309">عليها: '+esc(v.current_driver.name_ar||'')+'</div>'):'';
        return '<tr><td>'+esc(v.plate)+cur+'</td><td>'+esc(v.vehicle_type||'')+'</td><td>'+esc(v.project||'')+'</td><td>'+esc(v.area||'')+'</td>'
          +'<td>'+(v.vehicle_status==='assigned'?'<span class="wfi-idle">مُسندة</span>':'متاحة')+'</td>'
          +'<td><button class="wfi-prim" data-vpick="'+esc(v.plate)+'">اختيار</button></td></tr>';
      }).join('')+'</tbody></table>';
    Array.prototype.forEach.call(box.querySelectorAll('[data-vpick]'),function(b){
      b.onclick=function(){ confirmAssign(emp, b.getAttribute('data-vpick')); };
    });
  }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function confirmAssign(emp, plate){
    var v=(vehicles||[]).find(function(x){return x.plate===plate;}); if(!v) return;
    var msg='إسناد «'+(emp.name_ar||emp.name_en||'')+'» إلى المركبة '+plate+'؟';
    if(v.current_driver) msg+='\n\nتنبيه: المركبة عليها سائق حالي ('+(v.current_driver.name_ar||'')+') وسيتم إنهاء تفويضه.';
    if(!confirm(msg)) return;
    var today=todayStr();
    // 1) إنهاء السائق الحالي إن وُجد
    try{
      if(v.current_driver){
        var cd=v.current_driver;
        var last=(v.history||[]).filter(function(h){return normId(h.driver_id)===normId(cd.driver_id) && !h.date_deliver;}).pop();
        if(last){ last.date_deliver=today; last.status='Stopped'; }
      }
    }catch(e){}
    // 2) إنشاء تفويض جديد
    var entry={
      driver_id:String(emp.iqama||''), name_ar:emp.name_ar||'', name_en:emp.name_en||'',
      mobile:emp.mobile||'', date_receive:today, date_deliver:'', status:'Active',
      branch_receive:'', branch_deliver:'', reason:'', notes:'إسناد من وثيق',
      project:v.project||emp.project||'', area:v.area||emp.area||'', id_ninja:'', iban:emp.iban||'', salary_deductions:''
    };
    v.history=v.history||[]; v.history.push(entry);
    v.current_driver=entry; v.vehicle_status='assigned';
    // 3) حفظ الأسطول (يتزامن للسحابة)
    try{ if(typeof persist==='function') persist(); }catch(e){}
    try{ if(typeof applyFilters==='function') applyFilters(); }catch(e){}
    // 4) تثبيت التحديث في وثيق عبر السحابة (الموظف يصبح على رأس العمل)
    pushWatheeqActive(emp, v, today);
    // 5) إخراجه من قائمة الإيدل
    var k=normId(emp.iqama); if(acl.ackFleet.indexOf(k)<0){ acl.ackFleet.push(k); saveAcl(); }
    var wrap=document.getElementById('wfiAssignWrap'); if(wrap) wrap.innerHTML='<div class="wfi-warn">✅ تم الإسناد والتثبيت في الأسطول، وجارٍ التحديث في وثيق…</div>';
    setTimeout(renderIdleTab, 1200);
  }
  function pushWatheeqActive(emp, v, today){
    cloudGet('watheeq').then(function(r){
      var data=(r&&r.data&&Array.isArray(r.data.employees))?r.data:{employees:[]};
      var emps=data.employees;
      var idn=normId(emp.iqama), nm=normName(emp.name_ar);
      var found=emps.filter(function(e){ return normId(e.iqama)===idn || (nm && normName(e.name_ar)===nm); })[0];
      if(found){
        found.employment_status='active';
        if(found.status_label!==undefined) found.status_label='موظف';
        found.vehicles=found.vehicles||[];
        found.vehicles.push({plate:v.plate, vehicle_type:v.vehicle_type||'', date_receive:today, date_deliver:'', status:'Active', active:true, project:v.project||found.project||'', reason:'', notes:'إسناد من الأسطول'});
      }
      cloudPost('watheeq', data);   // يثبّت التحديث في نسخة وثيق السحابية
    });
  }

  /* ====== وثيق: تحديثات من الأسطول (تفويض ملغى → إيقاف) ====== */
  function renderFleetUpdTab(){
    modalBody.innerHTML='<div class="wfi-sec">🔄 تحديثات من الأسطول</div><div class="wfi-warn">جارٍ التحميل من Drive…</div>';
    cloudGet('fleetos').then(function(r){
      var veh=(r&&r.data&&Array.isArray(r.data.vehicles))?r.data.vehicles:[];
      var activeId={}, activeName={};
      veh.forEach(function(v){
        if(v.current_driver && (!v.current_driver.date_deliver) && v.current_driver.status==='Active'){
          if(v.current_driver.driver_id) activeId[normId(v.current_driver.driver_id)]=1;
          if(v.current_driver.name_ar) activeName[normName(v.current_driver.name_ar)]=1;
        }
      });
      // موظفون فعّالون في وثيق لكن بلا تفويض نشط في الأسطول
      var _su2=scopeUser();
      var flagged=(state.employees||[]).map(function(e,i){return {e:e,i:i};}).filter(function(o){
        var e=o.e;
        if(!e || e.employment_status!=='active') return false;
        if(_su2 && _su2.project && e.project!==_su2.project) return false;
        var id=normId(e.iqama), nm=normName(e.name_ar);
        return !(activeId[id] || (nm&&activeName[nm]));
      });
      var html='<div class="wfi-sec">🔄 تحديثات من الأسطول</div>';
      html+='<div class="wfi-warn">موظفون «على رأس العمل» في وثيق لكن ليس لديهم تفويض/سيارة نشطة في الأسطول. غالباً أُلغي تفويضهم. راجِع ثم أوقفهم بنقرة (لن يحدث أي إيقاف تلقائي بدون موافقتك).</div>';
      if(!flagged.length){ html+='<div style="color:#64748b">كل الموظفين الفعّالين لديهم تفويض نشط. لا تحديثات.</div>'; modalBody.innerHTML=html; return; }
      html+='<table class="wfi-tbl"><thead><tr><th>الاسم</th><th>الإقامة</th><th>المشروع</th><th>الإجراء</th></tr></thead><tbody>';
      flagged.forEach(function(o){
        html+='<tr><td>'+esc(o.e.name_ar||o.e.name_en||'')+'</td><td>'+esc(o.e.iqama||'')+'</td><td>'+esc(o.e.project||'')+'</td>'
          +'<td><span class="wfi-idle">تفويض ملغى؟</span> <button class="wfi-prim" data-stop="'+o.i+'">⏹ إيقاف في وثيق</button></td></tr>';
      });
      html+='</tbody></table>';
      html+='<div style="margin-top:10px"><button class="wfi-ghost" id="wfiStopAll">إيقاف الكل (بعد المراجعة)</button></div>';
      modalBody.innerHTML=html;
      Array.prototype.forEach.call(modalBody.querySelectorAll('[data-stop]'),function(b){
        b.onclick=function(){ stopEmployee(parseInt(b.getAttribute('data-stop'),10)); renderFleetUpdTab(); };
      });
      document.getElementById('wfiStopAll').onclick=function(){
        if(!confirm('سيتم إيقاف ('+flagged.length+') موظف في وثيق. متابعة؟')) return;
        flagged.forEach(function(o){ stopEmployeeSilent(o.i); });
        try{ if(typeof persist==='function') persist(); if(typeof renderAll==='function') renderAll(); }catch(e){}
        renderFleetUpdTab();
      };
    });
  }

  /* ===================== المتصلون + سجل التعديلات ===================== */
  var PRESENCE_TTL=90000;   // يُعتبر متصلاً خلال 90 ثانية
  function pruneOnline(map){
    var now=Date.now(), out={};
    Object.keys(map||{}).forEach(function(k){ if(map[k] && (now-map[k].ts)<PRESENCE_TTL) out[k]=map[k]; });

  /* ============================================================
     وحدة إضافية (معزولة) — تعديلات وثيق:
       ١. «راتب فقط» → «متوقف عن العمل» (استبدال المسمّى)
       ٢. إيقاف تلقائي: من لا يملك مركبة فعّالة = متوقف عن العمل
          + مزامنة تلقائية لإلغاء التفويض من الأسطول

  function wfIsAdmin(){ try{ var u=currentUser(); return !!(u && u.role==='admin'); }catch(e){ return false; } }

  /* ---------- (١) استبدال المسمّى «راتب فقط» → «متوقف عن العمل» ---------- */
  function wfRelabel(root){
    root = root || document.body; if(!root) return;
    try{
      var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false), n, hits=[];
      while((n = w.nextNode())){ if(n.nodeValue && n.nodeValue.indexOf('راتب فقط') >= 0) hits.push(n); }
      hits.forEach(function(t){ t.nodeValue = t.nodeValue.replace(/راتب فقط/g, 'متوقف عن العمل'); });
    }catch(e){}
  }
  function wfPatchStatusOption(){
    try{
      var sel = document.getElementById('fStatus'); if(!sel) return;
      Array.prototype.forEach.call(sel.options, function(o){
        if(o.value === 'salary_only' && o.text.indexOf('راتب فقط') >= 0) o.text = 'متوقف عن العمل';
      });
    }catch(e){}
  }

  /* ---------- (٢) «متوقف عن العمل» = لا يوجد تفويض نشط في الأسطول ----------
     القاعدة الموحّدة: الأسطول هو المرجع. أي موظف ليس سائقاً نشطاً لأي مركبة
     في الأسطول (أُوقف / أُلغي تفويضه ولم يُسنَد لمركبة جديدة) = «متوقف عن العمل».
     يُمثَّل بالحالة salary_only التي تظهر نصّياً «متوقف عن العمل» بعد إعادة التسمية. */
  function wfHasActiveVehicle(e){
    return (e && Array.isArray(e.vehicles)) && e.vehicles.some(function(v){
      return v && (v.active === true || String(v.status || '').toLowerCase() === 'active');
    });
  }
  function wfMarkOffWork(e){
    if(!e) return false;
    if(e.employment_status === 'salary_only' && e.salary_only === true) return false; /* بالفعل */
    e.employment_status = 'salary_only';
    e.status_label = 'متوقف عن العمل';
    e.salary_only = true;
    try{ stampRecord(e); }catch(_){}
    return true;
  }
  /* مزامنة «متوقف عن العمل» من الأسطول تلقائياً (مرجعية الأسطول) */
  function wfSyncOffWorkFromFleet(){
    try{
      cloudGet('fleetos').then(function(r){
        try{
          var veh = (r && r.data && Array.isArray(r.data.vehicles)) ? r.data.vehicles : [];
          if(!veh.length) return;                 /* حماية: لا بيانات أسطول → لا تُوقف أحداً */
          var activeId = {}, activeName = {};
          veh.forEach(function(v){
            if(v && v.current_driver && (!v.current_driver.date_deliver) && v.current_driver.status === 'Active'){
              if(v.current_driver.driver_id) activeId[normId(v.current_driver.driver_id)] = 1;
              if(v.current_driver.name_ar) activeName[normName(v.current_driver.name_ar)] = 1;
            }
          });
          var changed = 0;
          (state.employees || []).forEach(function(e){
            if(!e || e.employment_status !== 'active') return;     /* لا نُعيد التفعيل تلقائياً */
            var id = normId(e.iqama), nm = normName(e.name_ar);
            var isFleetActive = activeId[id] || (nm && activeName[nm]);
            if(!isFleetActive){ if(wfMarkOffWork(e)) changed++; }   /* لا تفويض نشط → متوقف عن العمل */
            else if(e.salary_only === true){ e.salary_only = false; changed++; } /* عاد بتفويض → تنظيف علم قديم */
          });
          if(changed){
            try{ if(typeof recomputeStats === 'function') recomputeStats(); }catch(_){}
            try{ if(typeof persist === 'function') persist(); }catch(_){}
            try{ if(typeof renderAll === 'function') renderAll(); }catch(_){}
          }
        }catch(_){}
      });
    }catch(e){}
  }

  /* ============================================================
     وحدة إضافية (٢) — طلب تفويض مركبة (وثيق → الأسطول)
       • زر «طلب تفويض» على كرت الموظف في وثيق (لمن لا يملك مركبة فعّالة)
       • يكتب الطلب في مفتاح سحابي مشترك «vehreq»
       • ويدجت عائم في الأسطول يعرض الطلبات ويربطها بنافذة الإسناد
       • تُحذف الطلبات تلقائياً بعد إسناد مركبة للسائق
     ============================================================ */
  var _wfReqKey = 'vehreq';
  function _wfReqList(r){
    if(!r) return [];
    if(Array.isArray(r.data)) return r.data;
    if(r.data && Array.isArray(r.data.requests)) return r.data.requests;
    return [];
  }

  /* ---------------- جانب وثيق ---------------- */
  var _wfPendingReq = {};
  function wfLoadPendingReq(cb){
    try{
      cloudGet(_wfReqKey).then(function(r){
        var list = _wfReqList(r); _wfPendingReq = {};
        list.forEach(function(q){ if(q && q.status !== 'done' && q.iqama) _wfPendingReq[normId(q.iqama)] = true; });
        if(cb) cb();
      }).catch(function(){ if(cb) cb(); });
    }catch(e){ if(cb) cb(); }
  }
  function wfRequestVehicle(idx){
    if(typeof state === 'undefined' || !state || !Array.isArray(state.employees)) return;
    var e = state.employees[idx]; if(!e) return;
    var nid = normId(e.iqama);
    try{
      cloudGet(_wfReqKey).then(function(r){
        var list = _wfReqList(r).slice();
        if(list.some(function(q){ return q && q.status !== 'done' && normId(q.iqama) === nid; })){
          _wfPendingReq[nid] = true; try{ toast('يوجد طلب تفويض قيد الانتظار لهذا الموظف بالفعل'); }catch(_){}
          wfDecorateCards(); return;
        }
        var u; try{ u = currentUser(); }catch(_){ u = null; }
        list.push({
          id: 'req_' + Date.now() + '_' + nid,
          iqama: String(e.iqama || ''), name_ar: e.name_ar || '', name_en: e.name_en || '',
          mobile: e.mobile || '', project: e.project || '', area: e.area || '', iban: e.iban || '',
          requested_at: new Date().toISOString(), requested_by: (u && u.email) || '', status: 'pending'
        });
        try{ cloudPost(_wfReqKey, list); }catch(_){}
        _wfPendingReq[nid] = true;
        try{ toast('🚗 تم إرسال طلب تفويض مركبة إلى الأسطول'); }catch(_){}
        wfDecorateCards();
      }).catch(function(){ try{ toast('تعذّر إرسال الطلب — تأكد من الاتصال'); }catch(_){} });
    }catch(e2){}
  }
  function wfDecorateCards(){
    if(typeof APP === 'undefined' || APP !== 'watheeq') return;
    var host = document.getElementById('empCards'); if(!host) return;
    var cards = host.querySelectorAll('button.card');
    Array.prototype.forEach.call(cards, function(card){
      var oc = card.getAttribute('onclick') || '';
      var m = oc.match(/openModal\((\d+)\)/); if(!m) return;
      var idx = parseInt(m[1], 10);
      var e = (state.employees || [])[idx]; if(!e) return;
      var meta = card.querySelector('.meta'); if(!meta) return;
      var needs = (e.employment_status !== 'active') || !wfHasActiveVehicle(e); /* أي غير «موظف» = متوقف عن العمل */
      var existing = meta.querySelector('.wf-reqbtn');
      if(!needs){ if(existing) existing.remove(); return; }
      var nid = normId(e.iqama), pending = !!_wfPendingReq[nid];
      if(!existing){
        var b = document.createElement('span');
        b.className = 'wf-reqbtn'; b.setAttribute('role', 'button');
        b.addEventListener('click', function(ev){
          ev.stopPropagation(); ev.preventDefault();
          if(b.getAttribute('data-pending') === '1'){ try{ toast('الطلب قيد الانتظار في الأسطول'); }catch(_){} return; }
          wfRequestVehicle(idx);
        });
        meta.appendChild(b); existing = b;
      }
      existing.setAttribute('data-pending', pending ? '1' : '0');
      existing.textContent = pending ? '✅ تم طلب التفويض' : '🚗 طلب تفويض';
      existing.classList.toggle('wf-reqbtn-on', pending);
    });

  /* ---------------- جانب الأسطول ---------------- */
  function wfFleetActiveDrivers(){
    var set = {};
    try{
      (typeof vehicles !== 'undefined' ? (vehicles || []) : []).forEach(function(v){
        if(v && v.current_driver && (!v.current_driver.date_deliver) && v.current_driver.status === 'Active'){
          if(v.current_driver.driver_id) set[normId(v.current_driver.driver_id)] = 1;
        }
      });
    }catch(e){}
    return set;
  }
  function wfFleetAssign(req){
    try{ if(typeof openPanel === 'function'){ activeTab = 'idle'; openPanel(); } }catch(_){}
    var tries = 0;
    (function wait(){
      var w = document.getElementById('wfiAssignWrap');
      if(w){ try{ openAssign(req); }catch(_){} return; }
      if(tries++ < 25) setTimeout(wait, 150);
    })();
  }
  function wfRenderFleetReq(list){
    var panel = document.getElementById('wfReqPanel'); if(!panel) return;
    var html = '<h4>🔔 طلبات تفويض مركبة من وثيق</h4>';
    if(!list.length){ html += '<div style="color:#64748b;font-size:13px">لا توجد طلبات حالياً.</div>'; panel.innerHTML = html; return; }
    list.forEach(function(q, i){
      html += '<div class="wf-reqrow">'
        + '<div class="nm">' + esc(q.name_ar || q.name_en || '') + '</div>'
        + '<div class="sub">' + esc(q.iqama || '') + (q.project ? ' · ' + esc(q.project) : '') + (q.area ? ' · ' + esc(q.area) : '') + '</div>'
        + '<div class="acts"><button class="wf-reqassign" data-asg="' + i + '">🚗 إسناد مركبة</button>'
        + '<button class="wf-reqdel" data-rdel="' + i + '">✕ إزالة الطلب</button></div></div>';
    });
    panel.innerHTML = html;
    Array.prototype.forEach.call(panel.querySelectorAll('[data-asg]'), function(b){
      b.onclick = function(){ var q = list[parseInt(b.getAttribute('data-asg'), 10)]; if(q) wfFleetAssign(q); };
    });
    Array.prototype.forEach.call(panel.querySelectorAll('[data-rdel]'), function(b){
      b.onclick = function(){
        var i = parseInt(b.getAttribute('data-rdel'), 10); var q = list[i]; if(!q) return;
        if(!confirm('إزالة طلب «' + (q.name_ar || q.name_en || '') + '»؟')) return;
        cloudGet(_wfReqKey).then(function(r){
          var full = _wfReqList(r).filter(function(x){ return x && x.id !== q.id; });
          try{ cloudPost(_wfReqKey, full); }catch(_){}
          wfFleetReqPoll();
        });
      };
    });
  }
  function wfFleetReqPoll(){
    try{
      if(typeof can === 'function' && !can('manage')) return;     /* الإسناد للإدارة فقط */
      cloudGet(_wfReqKey).then(function(r){
        var raw = _wfReqList(r);
        var active = wfFleetActiveDrivers();
        /* تنظيف تلقائي: أزل الطلبات لمن أصبح لديه تفويض نشط */
        var pending = raw.filter(function(q){ return q && q.status !== 'done' && !active[normId(q.iqama)]; });
        if(pending.length !== raw.length){ try{ cloudPost(_wfReqKey, pending); }catch(_){} }
        var pill = document.getElementById('wfReqPill');
        if(pill){
          if(pending.length){ pill.style.display = 'inline-flex'; pill.innerHTML = '🔔 طلبات تفويض (' + pending.length + ')'; }
          else { pill.style.display = 'none'; var pn = document.getElementById('wfReqPanel'); if(pn) pn.style.display = 'none'; }
        }
        var pn2 = document.getElementById('wfReqPanel');
        if(pn2 && pn2.style.display !== 'none') wfRenderFleetReq(pending);
        window._wfFleetReqCache = pending;
      }).catch(function(){});
    }catch(e){}
  }
  function wfBuildFleetReqWidget(){
    if(document.getElementById('wfReqPill') || !document.body) return;
    wfReqStyles();
    var pill = document.createElement('button'); pill.id = 'wfReqPill'; pill.innerHTML = '🔔 طلبات تفويض';
    document.body.appendChild(pill);
    var panel = document.createElement('div'); panel.id = 'wfReqPanel'; panel.style.display = 'none';
    document.body.appendChild(panel);
    pill.onclick = function(){
      var open = panel.style.display !== 'none';
      if(open){ panel.style.display = 'none'; return; }
      panel.style.display = 'block';
      wfRenderFleetReq(window._wfFleetReqCache || []);
    };
  }

  function wfEsc(s){ try{ if(typeof esc==='function') return esc(s); }catch(_){}
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function wfFmt(n){ try{ if(typeof fmt==='function') return fmt(n); }catch(_){}
    var x=Number(n)||0; return x.toLocaleString('en-US'); }

  function wfReadDataURL(file){ return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){res(String(fr.result||''));}; fr.onerror=rej; fr.readAsDataURL(file); }); }
  function wfReadArrayBuffer(file){ return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=rej; fr.readAsArrayBuffer(file); }); }
  function wfLightbox(src){ try{ if(typeof showLightbox==='function'){ showLightbox(src); return; } }catch(_){}
    var w=window.open(); if(w){ w.document.write('<img src="'+src+'" style="max-width:100%">'); } }

  /* ════════════ (١) وثائق الموظف — مفتاح سحابي منفصل «docs» ════════════ */
  var WF_DOC_KEY='docs'; var _wfDocs=null;
  var WF_DOC_KINDS=[['iqama','الإقامة','🪪'],['license','الرخصة','📋'],['contract','العقد','📄']];
  function wfLoadDocs(cb){ cloudGet(WF_DOC_KEY).then(function(r){ _wfDocs=(r&&r.data&&typeof r.data==='object')?r.data:{}; if(cb)cb(); }).catch(function(){ _wfDocs=_wfDocs||{}; if(cb)cb(); }); }
  function wfDocsFor(iq){ if(!_wfDocs) return null; var k=normId(iq); return _wfDocs[k]||null; }
  function wfSaveDoc(iq, kind, file, cb){
    var k=normId(iq); _wfDocs=_wfDocs||{};
    wfReadDataURL(file).then(function(dataUrl){
      _wfDocs[k]=_wfDocs[k]||{};
      _wfDocs[k][kind]={ data:dataUrl, name:file.name||'', type:file.type||'', ts:new Date().toISOString(), by:wfUser() };
      try{ cloudPost(WF_DOC_KEY, _wfDocs); }catch(_){}
      wfToast('✅ تم رفع '+kind);
      if(cb)cb();
    }).catch(function(){ wfToast('تعذّر قراءة الملف'); });
  }
  function wfDeleteDoc(iq, kind, cb){
    var k=normId(iq); if(_wfDocs&&_wfDocs[k]&&_wfDocs[k][kind]){ delete _wfDocs[k][kind]; try{ cloudPost(WF_DOC_KEY,_wfDocs); }catch(_){} wfToast('تم حذف الوثيقة'); }
    if(cb)cb();
  }
  function wfDocBoxHTML(iq, kind, label, icon, readOnly){
    var d=wfDocsFor(iq); var f=d&&d[kind];
    var inner='';
    if(f && f.data){
      if((f.type||'').indexOf('pdf')>=0 || /\.pdf$/i.test(f.name||'')){
        inner='<a class="wf-pdf" href="'+f.data+'" download="'+wfEsc(f.name||(kind+'.pdf'))+'" target="_blank">📄 '+wfEsc(f.name||'ملف PDF')+'</a>';
      } else {
        inner='<img src="'+f.data+'" data-lb="'+kind+'" alt="'+wfEsc(label)+'">';
      }
      if(!readOnly){
        inner+='<div class="wf-doc-actions">'
          +'<label class="wf-doc-up" style="padding:3px 8px">استبدال<input type="file" accept="image/*,.pdf" data-doc-up="'+kind+'"></label>'
          +'<button data-doc-del="'+kind+'">حذف</button></div>';
      }
    } else {
      if(readOnly){ inner='<div style="color:#94a3b8;font-size:12px;padding:14px 0">لا توجد</div>'; }
      else { inner='<label class="wf-doc-up">⬆ رفع<input type="file" accept="image/*,.pdf" data-doc-up="'+kind+'"></label>'; }
    }
    return '<div class="wf-doc-box"><div class="wf-doc-label">'+icon+' '+wfEsc(label)+'</div>'+inner+'</div>';
  }
  function wfDocsGridHTML(iq, readOnly){
    return '<div class="wf-doc-grid">'+WF_DOC_KINDS.map(function(k){ return wfDocBoxHTML(iq,k[0],k[1],k[2],readOnly); }).join('')+'</div>';
  }
  function wfWireDocBoxes(scope, iq, rerender){
    scope.querySelectorAll('[data-doc-up]').forEach(function(inp){
      inp.addEventListener('change',function(){ if(inp.files&&inp.files[0]) wfSaveDoc(iq, inp.getAttribute('data-doc-up'), inp.files[0], rerender); });
    });
    scope.querySelectorAll('[data-doc-del]').forEach(function(b){
      b.addEventListener('click',function(){ wfDeleteDoc(iq, b.getAttribute('data-doc-del'), rerender); });
    });
    scope.querySelectorAll('[data-lb]').forEach(function(img){ img.addEventListener('click',function(){ wfLightbox(img.src); }); });
  }

  function wfWireKafala(scope, idx){
    var chk=scope.querySelector('#wfKafChk'); if(!chk) return;
    chk.addEventListener('change',function(){

      wfPushWatheeq();
      try{ wfKafalaDecorate(); }catch(_){}
      wfToast(e.on_kafala?'أُضيف للكفالة':'أُزيل من الكفالة');

  function wfKafalaDecorate(){
    if(APP!=='watheeq') return;
    var host=document.getElementById('empCards'); if(!host) return;
    var cards=host.querySelectorAll('button.card');
    Array.prototype.forEach.call(cards,function(card){
      var oc=card.getAttribute('onclick')||''; var m=oc.match(/openModal\((\d+)\)/); if(!m) return;
      var e=(state.employees||[])[parseInt(m[1],10)]; if(!e) return;
      var meta=card.querySelector('.meta');
      if(e.on_kafala){
        card.classList.add('wf-kafala');
        if(meta && !meta.querySelector('.wf-kaf-badge')){ var b=document.createElement('span'); b.className='wf-kaf-badge'; b.textContent='🛡 كفالة'; meta.appendChild(b); }

  /* رفع ملف تأكيد الصرف → تثبيت السلف (مثبتة/مصروفة) */
  function wfUploadAdvConfirm(file, done){
    if(typeof XLSX==='undefined'){ wfToast('مكتبة Excel غير محمّلة'); return; }
    wfReadArrayBuffer(file).then(function(buf){
      var wb=XLSX.read(buf,{type:'array'}); var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      var matched=0;
      rows.forEach(function(row){
        var iq=normId(row['الإقامة']||row['iqama']||row['Iqama']||'');
        var amt=Number(row['المبلغ']||row['amount']||0);

          if(normId(e.iqama)!==iq) return; var f=e.finance; if(!f) return;
          (f.advances||[]).forEach(function(a){

            }

  }

  var WF_CFG_KEY='projcfg'; var _wfCfg=null;
  function wfLoadCfg(cb){ cloudGet(WF_CFG_KEY).then(function(r){ _wfCfg=(r&&r.data&&typeof r.data==='object')?r.data:{}; if(cb)cb(); }).catch(function(){ _wfCfg=_wfCfg||{}; if(cb)cb(); }); }
  function wfContractFor(proj){ var c=(_wfCfg&&_wfCfg[proj])||{}; return { hours:Number(c.hours)||0, orders:Number(c.orders)||0, days:Number(c.days)||0, bonusPerDay:Number(c.bonusPerDay)||0, bonusPerOrder:Number(c.bonusPerOrder)||0, formula:c.formula||'', by:c.by||'', at:c.at||'' }; }

  function wfEvalFormula(expr, vars){
    if(!expr || !String(expr).trim()) return null;
    var names=['hours','orders','days','base','bonusPerDay','bonusPerOrder','reqHours','reqOrders','reqDays'];
    var sorted=names.slice().sort(function(a,b){ return b.length-a.length; });
    var test=String(expr); sorted.forEach(function(n){ test=test.split(n).join(' '); });
    if(/[A-Za-z_$]/.test(test)) return null;
    if(!/^[-+*/().,\d\s]*$/.test(test)) return null;
    try{
      var fn=new Function(names.join(','), 'return ('+expr+');');
      var v=fn(Number(vars.hours)||0,Number(vars.orders)||0,Number(vars.days)||0,Number(vars.base)||0,Number(vars.bonusPerDay)||0,Number(vars.bonusPerOrder)||0,Number(vars.reqHours)||0,Number(vars.reqOrders)||0,Number(vars.reqDays)||0);
      return (typeof v==='number' && isFinite(v))? v : null;
    }catch(e){ return null; }
  }
  function wfCalcSalary(contract, m){
    var vars={ hours:m.hours, orders:m.orders, days:m.days, base:m.base||0, bonusPerDay:contract.bonusPerDay, bonusPerOrder:contract.bonusPerOrder, reqHours:contract.hours, reqOrders:contract.orders, reqDays:contract.days };
    var byF=wfEvalFormula(contract.formula, vars);
    if(byF!=null) return byF;
    return (Number(m.base)||0)+(Number(m.days)||0)*(Number(contract.bonusPerDay)||0)+(Number(m.orders)||0)*(Number(contract.bonusPerOrder)||0);
  }

  /* استخراج الرواتب: رفع ملف → Apps Script (وسيط آمن) → مراجعة → تطبيق + تسوية تلقائية */
  function wfAiExtract(project, contract, fileType, content, roster, mediaType){
    return fetch(CLOUD_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'ai_extract', project:project, contract:contract, fileType:fileType, content:content, mediaType:mediaType||'', employees:roster||[] }) })
      .then(function(r){ return r.json(); });
  }
  function wfPayrollPick(proj){
    if(!wfIsAdmin()){ wfToast('استخراج الرواتب للموظف الإداري فقط'); return; }
    var inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls,.csv,.pdf,image/*'; inp.style.display='none';
    document.body.appendChild(inp);
    inp.addEventListener('change',function(){ if(inp.files&&inp.files[0]) wfPayrollUpload(proj, inp.files[0]); inp.remove(); });
    inp.click();
  }
  function wfPayrollUpload(proj, file){
    var contract=wfContractFor(proj);
    var roster=(state.employees||[]).filter(function(e){ return (e.project||'')===proj; }).map(function(e){ return { iqama:String(e.iqama||''), name:e.name_ar||e.name_en||'' }; });
    var name=(file.name||'').toLowerCase();
    wfToast('⏳ جارٍ قراءة الملف وإرساله للتحليل…');
    if(/\.(xlsx|xls|csv)$/.test(name)){
      if(typeof XLSX==='undefined'){ wfToast('مكتبة Excel غير محمّلة'); return; }
      wfReadArrayBuffer(file).then(function(buf){
        var wb=XLSX.read(buf,{type:'array'}); var ws=wb.Sheets[wb.SheetNames[0]];
        var grid=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        var text=grid.map(function(r){ return r.join('\t'); }).join('\n');
        wfAiExtract(proj, contract, 'text', text, roster).then(function(resp){ wfPayrollApply(proj, contract, resp); }).catch(wfPayrollErr);
      }).catch(wfPayrollErr);
    } else if(/\.pdf$/.test(name)){
      wfReadDataURL(file).then(function(u){ var b64=u.split(',')[1]||''; wfAiExtract(proj, contract, 'pdf', b64, roster).then(function(resp){ wfPayrollApply(proj, contract, resp); }).catch(wfPayrollErr); });
    } else if(/\.(png|jpe?g|webp|gif)$/.test(name)){
      wfReadDataURL(file).then(function(u){ var b64=u.split(',')[1]||''; wfAiExtract(proj, contract, 'image', b64, roster, file.type).then(function(resp){ wfPayrollApply(proj, contract, resp); }).catch(wfPayrollErr); });
    } else { wfToast('صيغة ملف غير مدعومة'); }
  }
  function wfPayrollErr(e){ try{ console.error(e); }catch(_){} wfToast('تعذّر التحليل — تأكد من الاتصال وإعداد المفتاح في Apps Script'); }
  function wfPayrollApply(proj, contract, resp){
    if(!resp || !resp.ok){
      if(resp && resp.error==='no_api_key'){ wfToast('أضِف ANTHROPIC_API_KEY في Script Properties أولًا'); }
      else { wfToast('فشل الاستخراج: '+((resp&&resp.error)||'غير معروف')); }
      return;
    }
    var rows=(resp.result&&resp.result.rows)||[];
    if(!rows.length){ wfToast('لم يُستخرج أي صف من الملف'); return; }
    wfPayrollReview(proj, contract, rows);
  }
  function wfMatchEmp(proj, row){
    var iq=normId(row.iqama||'');
    var byIq=(state.employees||[]).filter(function(e){ return normId(e.iqama)===iq && iq; })[0];
    if(byIq) return byIq;
    var nm=normName(row.name||'');
    return (state.employees||[]).filter(function(e){ return (e.project||'')===proj && nm && normName(e.name_ar||e.name_en||'')===nm; })[0]||null;
  }
  function wfPayrollReview(proj, contract, rows){
    var prepared=rows.map(function(row){
      var e=wfMatchEmp(proj, row);
      var base=(e&&e.finance&&Number(e.finance.base))||0;
      var m={ hours:Number(row.hours)||0, orders:Number(row.orders)||0, days:Number(row.days)||0, base:base };
      var gross=wfCalcSalary(contract, m);
      var outAdv=0;
      if(e){ wfAdvList(e).forEach(function(a){ var st=a.status||'new'; if(st==='approved'||st==='disbursed') outAdv+=Number(a.amount)||0; }); }
      return { e:e, row:row, m:m, gross:gross, outAdv:outAdv, net:gross-outAdv, name:(e&&(e.name_ar||e.name_en))||row.name||'—', matched:!!e };
    });
    var body=''
      +'<div style="font-size:13px;color:#475569;margin-bottom:12px">مراجعة استخراج رواتب <b>'+wfEsc(proj)+'</b>. عند الاعتماد تُحتسب الرواتب وتُسوّى السلف المعمدة/المثبتة تلقائيًا.</div>'
      +'<table class="wf-tbl"><thead><tr><th>الموظف</th><th>ساعات</th><th>طلبات</th><th>أيام</th><th>الإجمالي</th><th>سلف للتسوية</th><th>الصافي</th></tr></thead><tbody>'
      + prepared.map(function(p){ return '<tr'+(p.matched?'':' style="background:#fff7ed"')+'><td>'+wfEsc(p.name)+(p.matched?'':' <span style="color:#b45309;font-size:11px">(غير مطابق)</span>')+'</td><td>'+wfFmt(p.m.hours)+'</td><td>'+wfFmt(p.m.orders)+'</td><td>'+wfFmt(p.m.days)+'</td><td>'+wfFmt(p.gross)+'</td><td>'+wfFmt(p.outAdv)+'</td><td><b>'+wfFmt(p.net)+'</b></td></tr>'; }).join('')
      +'</tbody></table>'
      +'<div style="margin-top:14px;display:flex;gap:8px"><button class="wf-prim" id="wfPayCommit">✅ اعتماد وتطبيق الرواتب + تسوية السلف</button></div>';
    var ui=wfOverlay('⬆ استخراج رواتب — '+wfEsc(proj), body, 820);
    ui.body.querySelector('#wfPayCommit').onclick=function(){ wfPayrollCommit(proj, prepared); ui.close(); };
  }
  function wfPayrollCommit(proj, prepared){
    var month=new Date().toISOString().slice(0,7);
    var settled=0, applied=0;
    prepared.forEach(function(p){
      var e=p.e; if(!e) return;
      e.finance=e.finance||{ advances:[] };
      // تسوية السلف المعمدة/المثبتة تلقائيًا
      wfAdvList(e).forEach(function(a){ var st=a.status||'new'; if(st==='approved'||st==='disbursed'){ a.status='settled'; a.settled_at=new Date().toISOString(); a.settle_month=month; settled++; } });
      e.finance.payroll={ month:month, hours:p.m.hours, orders:p.m.orders, days:p.m.days, gross:p.gross, advances_settled:p.outAdv, net:p.net, by:wfUser(), at:new Date().toISOString(), source:'استخراج أونلاين' };
      e.finance.net=p.net;
      applied++;
    });
    try{ if(typeof recomputeStats==='function') recomputeStats(); }catch(_){}
    try{ persist(); }catch(_){} wfPushWatheeq();
    try{ if(typeof renderDash==='function') renderDash(); if(typeof renderProj==='function') renderProj(); }catch(_){}
    wfToast('✅ طُبّقت الرواتب على '+applied+' موظف · سُوّيت '+settled+' سلفة');
  }

  /* تزيين كروت المشاريع: زرّا العقد + الاستخراج (للإداري) */
  function wfDecorateProjectCards(){
    if(APP!=='watheeq') return;
    if(!wfIsAdmin()) return;
    var host=document.getElementById('projCards'); if(!host) return;
    var cards=host.querySelectorAll('.pcard');
    Array.prototype.forEach.call(cards,function(card){
      if(card.querySelector('.wf-proj-actions')) return;
      var h3=card.querySelector('h3'); if(!h3) return;
      var proj=h3.textContent.replace(/^📁\s*/,'').trim(); if(!proj) return;
      var box=document.createElement('div'); box.className='wf-proj-actions';
      var b1=document.createElement('button'); b1.className='wf-mini'; b1.innerHTML='📄 عقد';
      b1.addEventListener('click',function(ev){ ev.stopPropagation(); wfOpenContractEditor(proj); });
      var b2=document.createElement('button'); b2.className='wf-mini'; b2.innerHTML='⬆ استخراج رواتب';
      b2.addEventListener('click',function(ev){ ev.stopPropagation(); wfPayrollPick(proj); });
      box.appendChild(b1); box.appendChild(b2); card.appendChild(box);
    });
  }

  /* زر لوحة السلف في شريط الموظفين (للإداري) */
  function wfAddAdvAdminButton(){
    if(APP!=='watheeq' || !wfIsAdmin()) return;
    var bar=document.querySelector('#view-emp .toolbar'); if(!bar||document.getElementById('wfAdvAdminBtn')) return;
    var b=document.createElement('button'); b.id='wfAdvAdminBtn'; b.className='wf-adm-btn'; b.innerHTML='🧾 السلف والتعميد';
    b.addEventListener('click', wfOpenAdvAdmin); bar.appendChild(b);
  }

  /* استبدال addAdvance: المشرف يُدخل السلفة بحالة «جديدة» */
  function wfInstallAddAdvanceOverride(){
    var add=window.addAdvance;
    window.addAdvance=function(idx){
      try{
        var amtEl=document.getElementById('advAmt'); var amt=Number(amtEl?amtEl.value:0);
        if(!amt){ wfToast('أدخل مبلغ السلفة'); return; }
        var e=state.employees[idx]; if(!e || !e.finance){ wfToast('لا يوجد كرت مالي لهذا الموظف'); return; }
        e.finance.advances=e.finance.advances||[];
        var noteEl=document.getElementById('advNote');
        e.finance.advances.push({ amount:amt, note:(noteEl?noteEl.value:'').trim(), date:wfToday(), status:'new', requested_by:wfUser(), requested_at:new Date().toISOString() });
        try{ if(typeof recomputeStats==='function') recomputeStats(); }catch(_){}
        try{ persist(); }catch(_){} wfPushWatheeq();
        try{ if(typeof renderDash==='function') renderDash(); }catch(_){}
        try{ if(typeof reopenModal==='function') reopenModal('fin'); }catch(_){}
        wfToast('تمت إضافة السلفة (بانتظار التعميد)');
      }catch(err){ try{ console.error(err); }catch(_){} if(typeof add==='function') return add(idx); }
    };
  }

  /* ════════════ تغليف دوال الرسم + الإقلاع ════════════ */
  (function(){
    if(APP==='watheeq'){
      var re=window.renderEmp;
      if(typeof re==='function'){ window.renderEmp=function(){ var r=re.apply(this,arguments); try{ wfKafalaDecorate(); wfAddKafalaFilter(); wfAddAdvAdminButton(); }catch(_){} return r; }; }
      var rp=window.renderProj;
      if(typeof rp==='function'){ window.renderProj=function(){ var r=rp.apply(this,arguments); try{ wfDecorateProjectCards(); }catch(_){} return r; }; }
      var om=window.openModal;
      if(typeof om==='function'){ window.openModal=function(){ var r=om.apply(this,arguments); try{ wfInjectModalExtras(); }catch(_){} return r; }; }
    }
    if(APP==='fleetos'){
      var rc=window.renderCards;
      if(typeof rc==='function'){ window.renderCards=function(){ var r=rc.apply(this,arguments); try{ wfDecorateVehicleCards(); }catch(_){} return r; }; }
      var op=window.openPanel;
      if(typeof op==='function'){ window.openPanel=function(plate){ var r=op.apply(this,arguments); try{ wfInjectFleetDocs(plate); }catch(_){} return r; }; }
    }
  })();

  if(APP==='watheeq'){
    wfInstallAddAdvanceOverride();
    wfInstallExportOverride();
    setTimeout(function(){ try{ wfInjectStyles(); wfLoadDocs(); wfLoadCfg(); wfKafalaDecorate(); wfAddKafalaFilter(); wfAddAdvAdminButton(); }catch(_){} }, 1500);
    setInterval(function(){ try{ wfKafalaDecorate(); }catch(_){} }, 4000);
  }
  if(APP==='fleetos'){
    setTimeout(function(){ try{ wfInjectStyles(); wfLoadDocs(); wfHideFleetUploads(); wfUpdateReqBadge(); }catch(_){} }, 1500);
    setInterval(function(){ try{ wfHideFleetUploads(); wfUpdateReqBadge(); }catch(_){} }, 3000);
  }

})();
</script>
