    L.push('━━━━━━━━━━━━━━');
    L.push('بيانات أساسية للموظف — ملف الكرت مرفق (يُستورد في وثيق عبر: قائمة البيانات ← استيراد JSON).');
    return L.join('\n');
  }

  /* الحقول الأساسية فقط (نظرة عامة) — بلا مالي/مركبات/عهد/ملاحظات */
  var BASIC=['iqama','name_ar','name_en','mobile','email','iban','nationality','birth_date',
    'profession','job_title','project','employment_status','status_label','salary_only',
    'license_type','license_number','area','city','housing_status','housing_location','category',
    'iqama_issue','iqama_expiry','license_issue','license_expiry'];
  function basicEmp(e){
    var o={};
    BASIC.forEach(function(k){ if(e[k]!==undefined && e[k]!==null && e[k]!=='') o[k]=e[k]; });
    /* لا تُدرج vehicles/finance/finance_periods/custody/notes إطلاقاً:
       فلا تُشارَك بيانات حساسة، ولا يُدهَس سجل المستقبِل عند الاستيراد */
    o.shared_basic_only=true;
    return o;
  }
  function empFile(e){
    var snap={ app:'watheeq', kind:'single-employee-basic', savedAt:nowISO(), employees:[basicEmp(e)] };
    var json=JSON.stringify(snap);
    var safe=String(e.name_ar||e.iqama||'employee').replace(/[^\u0621-\u064Aa-zA-Z0-9]+/g,'_').slice(0,40);
    return { json:json, name:'watheeq-'+safe+'.json' };
  }

  window.wx11ShareEmp=function(idx){
    if(idx==null) idx=state.current;
    var e=(state.employees||[])[idx]; if(!e){ T('لا يوجد موظف'); return; }
    var text=summary(e);
    var ef=empFile(e);
    var file=null;
    try{ file=new File([ef.json], ef.name, {type:'application/json'}); }catch(_){}
    window.__wx11=ef; window.__wx11txt=text; window.__wx11file=file;

    /* الحوار يظهر دائماً — يعمل بشكل موثوق على الملفات المحلية (file://) بلا فشل صامت.
       المشاركة الأصلية للجهاز خيار داخل الحوار (لمن يريد إرفاق الملف عبر التطبيقات). */
    var nativeBtn = (typeof navigator!=='undefined' && navigator.share) ?
      '<button class="btn ghost" onclick="wx11Native()">📲 تطبيقات الجهاز</button>' : '';
    openW('📱 مشاركة الموظف',
      '<div class="wx11-pre" id="wx11Txt">'+E(text)+'</div>'
      +'<div class="wx6-mut" style="margin-top:8px">بيانات أساسية فقط (بدون سجل مالي أو مركبات).<br>'
      +'«واتساب» يرسل الملخّص · «ملف الموظف» ينزّل ملفاً قابلاً للاستيراد في وثيق.</div>',
      '<button class="btn ghost" onclick="wx11Copy()">📋 نسخ</button>'
      +nativeBtn
      +'<button class="btn ghost" onclick="wx11File()">⬇️ ملف الموظف</button>'
      +'<button class="btn" onclick="wx11Wa()">📱 واتساب</button>');
  };
  window.wx11Native=function(){
    var file=window.__wx11file, text=window.__wx11txt||'';
    try{
      var payload={ title:'مشاركة موظف', text:text };
      if(file && navigator.canShare && navigator.canShare({files:[file]})) payload.files=[file];
      var pr=navigator.share(payload);
      if(pr && pr.catch) pr.catch(function(err){ if(err && err.name!=='AbortError') T('تعذّرت المشاركة عبر التطبيقات — استخدم واتساب أو نزّل الملف'); });
    }catch(e){ T('تعذّرت المشاركة عبر التطبيقات — استخدم واتساب أو نزّل الملف'); }
  };
  window.wx11Copy=function(){
    var t=window.__wx11txt||'';
    try{ navigator.clipboard.writeText(t).then(function(){ T('تم نسخ الملخّص'); }); }
    catch(e){
      try{ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); T('تم النسخ'); }catch(_){ T('تعذّر النسخ'); }
    }
  };
  window.wx11Wa=function(){
    var t=encodeURIComponent(window.__wx11txt||'');
    var url='https://wa.me/?text='+t;
    var w=null;
    try{ w=window.open(url,'_blank'); }catch(e){}
    if(!w){ try{ location.href=url; }catch(e2){ try{ location.href='whatsapp://send?text='+t; }catch(_){} } }
  };
  window.wx11File=function(){
    var ef=window.__wx11; if(!ef) return;
    try{
      var b=new Blob([ef.json],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=ef.name;
      document.body.appendChild(a); a.click(); a.remove();
      T('تم تنزيل ملف الموظف');
    }catch(e){}
  };

  /* ---------- حقن زر المشاركة في رأس كرت الموظف ---------- */
  function inject(){
    var modal=document.getElementById('modal'); if(!modal) return;
    var head=modal.querySelector('.head'); if(!head) return;
    if(head.querySelector('.wx11-share')) return;
    if(state.current==null) return;
    var x=head.querySelector('.x');
    var b=document.createElement('button');
    b.className='wx11-share'; b.type='button';
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg> مشاركة';
    b.onclick=function(ev){ ev.stopPropagation(); window.wx11ShareEmp(state.current); };
    if(x && x.parentNode){ x.parentNode.insertBefore(b, x); }   /* داخل مجموعة الأزرار قبل ✕ */
    else head.appendChild(b);
  }
  function watch(){
    var m=document.getElementById('modal'); if(!m || m.__wx11) return;
    m.__wx11=true;
    new MutationObserver(function(){ try{ inject(); }catch(e){} }).observe(m,{childList:true, subtree:true});
  }
  function boot(){ try{ watch(); inject(); }catch(e){} }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  setInterval(function(){ try{ watch(); inject(); }catch(e){} }, 2500);
})();
</script>

<script id="wx12-js">
/* ============================================================
   وثيق — الطبقة (١٢): إتمام المستندات تلقائياً عند الرفع
   عند رفع مستند (الإقامة/الرخصة/العقد) في «📎 وثائق الموظف»،
   يُعلَّم المستند مكتملاً تلقائياً — فيختفي تنبيه «نقص مستندات»
   ويتأشّر مربّع التأكيد بلا حاجة لأي تدخّل يدوي.
   ============================================================ */
(function(){
  if(window.__wx12) return; window.__wx12=true;

  function IQ(x){ return String(x==null?'':x).replace(/\.0$/,'').replace(/[^0-9]/g,''); }
  function LS(){ return window.wfLocalStore || {getData:function(){return null;}}; }

  /* خريطة المستندات المرفوعة: { <iqama>: {iqama:{}, license:{}, contract:{}} } */
  function uploadedDocs(){
    var d=LS().getData('docs');
    return (d && typeof d==='object') ? d : {};
  }

  /* الأعلام المقابلة لكل نوع مستند */
  var MAP=[['iqama','has_iqama_doc'],['license','has_license_doc'],['contract','has_contract']];

  /* مزامنة: أي مستند مرفوع → علم مكتمل = true (إضافةً فقط، بلا مسح للتأكيدات اليدوية) */
  function sync(){
    var docs=uploadedDocs();
    if(!docs || typeof state==='undefined' || !state || !Array.isArray(state.employees)) return false;
    var changed=false;
    state.employees.forEach(function(e){
      var k=IQ(e.iqama); if(!k) return;
      var rec=docs[k]; if(!rec) return;
      MAP.forEach(function(m){
        var kind=m[0], flag=m[1];
        if(rec[kind] && rec[kind].data && !e[flag]){ e[flag]=true; changed=true; }
      });
    });
    if(changed){
      try{ if(typeof recomputeStats==='function') recomputeStats(); }catch(_){}
      try{ if(typeof persist==='function') persist(); }catch(_){}
      /* لو نافذة موظف مفتوحة، أعد رسمها لتحديث تنبيه المستندات فوراً */
      try{ if(state.current!=null && typeof openModal==='function'){
        var tab=null, t=document.querySelector('#modal .mtabs button.on');
        if(t){ tab=(t.getAttribute('data-pane')||'ov'); }
        /* لا نعيد الفتح إن كان المستخدم في نموذج التعديل */
        if(!document.getElementById('ef-iqama')) openModal(state.current, tab||'ov');
      } }catch(_){}
    }
    return changed;
  }

  /* راقب نافذة الموظف: بعد رفع مستند تتغيّر شبكة الوثائق → زامن */
  function watch(){
    var m=document.getElementById('modal'); if(!m || m.__wx12) return;
    m.__wx12=true;
    var pend=null;
    new MutationObserver(function(){
      /* تأجيل بسيط حتى ينتهي تخزين الملف المرفوع في مفتاح docs */
      clearTimeout(pend); pend=setTimeout(sync, 400);
    }).observe(m,{childList:true, subtree:true});
  }

  function boot(){ try{ watch(); sync(); }catch(_){} }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  /* فحص دوري: يلتقط أي رفع تم في أي مكان */
  setInterval(function(){ try{ watch(); sync(); }catch(_){} }, 2000);
})();
</script>

<script id="wf-supabase">
/* ═══════════════════════════════════════════════════════════════════════
   wf-supabase v1 — ربط «وثيق» و«الأسطول» بقاعدة البيانات الموحّدة (Supabase)
   طبقة غير مدمّرة: تُحقن قبل </body> ولا تعدّل أي كود أصلي.
   • تسجيل دخول حقيقي (Supabase Auth) + موافقة المدير على كل حساب جديد
   • مزامنة سجل بسجل: كل تعديل يُرفع فوراً، والتعديلات من الأجهزة الأخرى تصل كل 30 ثانية
   • سجل أقدم من الموجود على الخادم لا يمكنه الكتابة فوقه (لا فقدان بيانات)
   • القواعد (حد السائقين، حالة الموظف…) تُطبَّق في القاعدة وتظهر في «ملاحظات المزامنة»
   ═══════════════════════════════════════════════════════════════════════ */
(function(){
  if (window.__wfSupabase) return; window.__wfSupabase = true;

  var SB_URL = 'https://coueubvyaokyycqpmirs.supabase.co';
  var SB_KEY = 'sb_publishable_OmxwJmaYvjGhC5S-VcjwHQ_atz1gleF';   /* مفتاح عام — الحماية من صلاحيات القاعدة (RLS) */
  var PULL_EVERY = 30000, PUSH_DELAY = 1200, BATCH = 100, PAGE = 1000;

  /* ---------- أي تطبيق؟ ---------- */
  var APP = null;
  try { if (typeof state !== 'undefined' && state && Array.isArray(state.employees)) APP = 'watheeq'; } catch(e){}
  try { if (!APP && typeof vehicles !== 'undefined' && typeof VKEY !== 'undefined') APP = 'fleet'; } catch(e){}
  if (!APP) return;
  var APP_AR = APP === 'watheeq' ? '«وثيق»' : '«الأسطول»';

  /* ---------- أدوات ---------- */
  function normId(x){ var s = String(x == null ? '' : x).trim().replace(/\.0+$/, ''); return s; }
  function normPlate(x){ return String(x == null ? '' : x).trim().replace(/\s+/g, ' ').toUpperCase(); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function hash(str){ var h = 5381; for (var i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; return h.toString(36) + ':' + str.length; }
  function nowIso(){ return new Date().toISOString(); }
  function lsGet(k, d){ try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch(e){ return d; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
  function note(msg, type){
    try { if (typeof showToast === 'function') { showToast(msg, type || 'green'); return; } } catch(e){}
    try { if (typeof toast === 'function') { toast(msg); return; } } catch(e){}
    try { console.log('[wf-supabase]', msg); } catch(e){}
  }

  /* ═════════════════════ الجلسة (Supabase Auth) ═════════════════════ */
  var SKEY = 'wfsb_session';
  var sess = lsGet(SKEY, null), me = null;

  function authFetch(path, body){
    return fetch(SB_URL + '/auth/v1/' + path, {
      method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error_description || j.msg || j.message || ('HTTP ' + r.status)); return j; }); });
  }
  function keepSession(j){
    sess = { access_token: j.access_token, refresh_token: j.refresh_token,
             expires_at: Date.now() + (j.expires_in || 3600) * 1000, user_id: j.user && j.user.id, email: j.user && j.user.email };
    lsSet(SKEY, sess); return sess;
  }
  function login(email, pass){ return authFetch('token?grant_type=password', { email: email, password: pass }).then(keepSession); }
  function signup(email, pass, name){ return authFetch('signup', { email: email, password: pass, data: { full_name: name } }); }
  var refreshing = null;
  function token(){
    var fresh = lsGet(SKEY, null);   /* نافذة أخرى في البوابة ربما جدّدت الجلسة */
    if (fresh && sess && fresh.user_id === sess.user_id && fresh.expires_at > sess.expires_at) sess = fresh;
    if (!sess && fresh) sess = fresh;
    if (!sess) return Promise.reject(new Error('no session'));
    if (Date.now() < sess.expires_at - 90000) return Promise.resolve(sess.access_token);
    if (!refreshing) refreshing = authFetch('token?grant_type=refresh_token', { refresh_token: sess.refresh_token })
      .then(function(j){ keepSession(j); refreshing = null; return sess.access_token; })
      .catch(function(e){ refreshing = null; if (/invalid|expired|not found/i.test(e.message)) { logout(true); } throw e; });
    return refreshing;
  }
  function logout(silent){
    try { if (sess) fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + sess.access_token } }); } catch(e){}
    sess = null; me = null; ready = false; started = false; try { localStorage.removeItem(SKEY); } catch(e){}
    if (!silent) location.reload(); else showGate('انتهت الجلسة — سجّل الدخول مرة أخرى.');
  }

  /* ---------- REST ---------- */
  function api(method, path, body, extraHeaders){
    return token().then(function(t){
      var h = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' };
      if (extraHeaders) for (var k in extraHeaders) h[k] = extraHeaders[k];
      return fetch(SB_URL + '/rest/v1/' + path, { method: method, headers: h, body: body == null ? undefined : JSON.stringify(body) });
    }).then(function(r){
      if (r.status === 401) { logout(true); throw new Error('401'); }
      return r.text().then(function(t){ var j = t ? JSON.parse(t) : null; if (!r.ok) throw new Error((j && (j.message || j.hint)) || ('HTTP ' + r.status)); return j; });
    });
  }
  function rpc(fn, args){ return api('POST', 'rpc/' + fn, args || {}); }
  function selectAll(path){   /* يقرأ كل الصفحات (حد Supabase 1000 صف للطلب) */
    var out = [];
    function page(off){
      return api('GET', path + '&offset=' + off + '&limit=' + PAGE).then(function(rows){
        out = out.concat(rows || []); return (rows && rows.length === PAGE) ? page(off + PAGE) : out;
      });
    }
    return page(0);
  }

  /* ═════════════════════ المجموعات المتزامنة ═════════════════════ */
  function isActive(h){ var st = String(h.status || '').toLowerCase(); return st ? st === 'active' : !String(h.date_deliver || '').trim(); }
  var derivedVeh = {};   /* وثيق: مركبات كل موظف كما في «الأسطول» */
  var COLLS = [];

  if (APP === 'watheeq') {
    COLLS.push({
      id: 'employees', label: 'موظف',
      list: function(){ return state.employees; },
      key: function(e){ return normId(e && e.iqama); },
      toRow: function(e){
        var rec = {}; for (var k in e) if (k !== 'finance' && k !== 'vehicles' && k !== 'iban') rec[k] = e[k];
        var pay = (e.finance || e.iban) ? { finance: e.finance || null, iban: e.iban || '' } : null;
        return { iqama: normId(e.iqama), rec: rec, pay: pay };
      },
      fromServer: function(row, local){
        var o = {}; var d = row.data || {}; for (var k in d) o[k] = d[k];
        var pay = row.employee_pay && row.employee_pay.data;
        o.finance = pay ? (pay.finance || null) : null;
        o.iban = pay ? (pay.iban || '') : '';
        o.vehicles = derivedVeh[normId(row.iqama)] || (local && local.vehicles) || [];
        return o;
      },
      rowKey: function(row){ return normId(row.iqama); },
      keyField: 'iqama',
      select: 'employees?select=iqama,data,edited_at,updated_at,deleted_at,employee_pay(data)&order=updated_at.asc,id.asc',
      push: function(rows){ return rpc('sync_employees', { p_rows: rows }); }
    });
  } else {
    COLLS.push({
      id: 'vehicles', label: 'مركبة',
      list: function(){ return vehicles; },
      key: function(v){ return normPlate(v && v.plate); },
      toRow: function(v){ return { plate: normPlate(v.plate), rec: v }; },
      fromServer: function(row){ var o = row.data || {}; if (!o.damages) o.damages = []; if (!o.accidents) o.accidents = []; if (o.stolen_info === undefined) o.stolen_info = null; return o; },
      rowKey: function(row){ return normPlate(row.plate_no); },
      keyField: 'plate_no',
      select: 'vehicles?select=plate_no,data,edited_at,updated_at,deleted_at&order=updated_at.asc,id.asc',
      push: function(rows){ return rpc('sync_vehicles', { p_rows: rows }); }
    });
    COLLS.push({
      id: 'maintreq', label: 'طلب صيانة',
      list: function(){ return (window.wfMaint && typeof wfMaint.all === 'function') ? wfMaint.all() : null; },   /* نسخة للقراءة */
      apply: function(objs){ try { if (objs.length) wfMaint.importAll(objs); } catch(e){} },                        /* دمج: الأحدث يفوز، بلا حذف */
      key: function(r){ return r && r.id ? String(r.id) : ''; },
      toRow: function(r){ return { key: String(r.id), rec: r }; },
      fromServer: function(row){ return row.data || {}; },
      rowKey: function(row){ return row.key; },
      keyField: 'key',
      select: 'app_records?select=key,data,edited_at,updated_at,deleted_at&app=eq.fleet&coll=eq.maintreq&order=updated_at.asc,key.asc',
      push: function(rows){ return rpc('sync_records', { p_app: 'fleet', p_coll: 'maintreq', p_rows: rows }); }
    });
  }

  /* ---------- حالة المزامنة المحفوظة على الجهاز ---------- */
  function metaKey(c){ return 'wfsb_meta_' + APP + '_' + c.id; }
  function loadMeta(c){
    var m = lsGet(metaKey(c), null);
    if (!m || !sess || m.user !== sess.user_id) m = { user: sess && sess.user_id, cursor: null, hashes: {}, first: true };
    c.meta = m; return m;
  }
  function saveMeta(c){ lsSet(metaKey(c), c.meta); }
  function stable(v){
    if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
    if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
    return '{' + Object.keys(v).filter(function(k){ return v[k] !== undefined && typeof v[k] !== 'function'; }).sort()
      .map(function(k){ return JSON.stringify(k) + ':' + stable(v[k]); }).join(',') + '}';
  }
  function rowHash(c, item){ return hash(stable(c.toRow(item))); }

  /* حفظ محلي بالدالة الأصلية + إعادة رسم الشاشة */
  var origPersist = null, applying = false;
  function localSaveAndRender(){
    applying = true;
    try { if (origPersist) origPersist(); } catch(e){}
    try {
      if (APP === 'watheeq') { if (typeof recomputeStats === 'function') recomputeStats(); if (typeof renderAll === 'function') renderAll(); }
      else {
        if (typeof applyFilters === 'function') applyFilters();
      }
    } catch(e){}
    applying = false;
  }
  function replaceInPlace(target, src){ Object.keys(target).forEach(function(k){ if (!(k in src)) delete target[k]; }); Object.keys(src).forEach(function(k){ target[k] = src[k]; }); }

  /* ---------- سحب التحديثات من القاعدة ---------- */
  function pullColl(c, full){
    var m = c.meta, list = c.list(); if (!list) return Promise.resolve(0);
    var q = c.select + ((!full && m.cursor) ? '&updated_at=gte.' + encodeURIComponent(m.cursor) : '');
    var fk = Object.keys(c.force || {});
    var extra = fk.length ? selectAll(c.select + '&' + c.keyField + '=in.(' + fk.map(function(k){ return encodeURIComponent('"' + k.replace(/"/g, '') + '"'); }).join(',') + ')') : Promise.resolve([]);
    return Promise.all([selectAll(q), extra]).then(function(res){
      var rows = res[0].concat(res[1]);
      var idx = {}; list.forEach(function(it, i){ var k = c.key(it); if (k) idx[k] = i; });
      var changed = 0, seen = {};
      rows.forEach(function(row){
        var k = c.rowKey(row); if (!k) return; seen[k] = 1;
        if (!m.cursor || row.updated_at > m.cursor) m.cursor = row.updated_at;
        var i = idx[k], local = (i != null) ? list[i] : null;
        if (row.deleted_at) {
          if (local) { list.splice(i, 1); changed++; idx = {}; list.forEach(function(it, j){ var kk = c.key(it); if (kk) idx[kk] = j; }); }
          delete m.hashes[k]; return;
        }
        var obj = c.fromServer(row, local), h = rowHash(c, obj);
        if (c.apply) { if (!local || rowHash(c, local) !== h) { (c._toApply = c._toApply || []).push(obj); changed++; } m.hashes[k] = h; delete c.force[k]; return; }
        if (local) {
          var lh = rowHash(c, local);
          var dirty = (m.hashes[k] != null) && lh !== m.hashes[k];      /* تعديل محلي لم يُرفع بعد */
          if (dirty && !c.force[k]) return;                               /* سيُرفع ويقرّر الخادم الأحدث */
          if (lh !== h) { replaceInPlace(local, obj); changed++; }
        } else { list.push(obj); idx[k] = list.length - 1; changed++; }
        m.hashes[k] = h; delete c.force[k];
      });
      /* أول مزامنة لمستخدم غير المدير: القاعدة هي المرجع — يُحذف من الجهاز ما لا يحقّ له رؤيته */
      if (full && m.first && me && ['admin','manager'].indexOf(me.role) < 0) {
        for (var j = list.length - 1; j >= 0; j--) { var kk = c.key(list[j]); if (kk && !seen[kk]) { list.splice(j, 1); changed++; } }
      }
      if (c.apply && c._toApply) { var ta = c._toApply; c._toApply = null; applying = true; try { c.apply(ta); } finally { applying = false; } }
      m.first = false; saveMeta(c);
      return changed;
    });
  }

  /* وثيق: بناء «مركبات الموظف» من سجلات الأسطول (قراءة فقط) */
  function pullFleetForWatheeq(){
    if (APP !== 'watheeq') return Promise.resolve(0);
    return selectAll('vehicles?select=plate_no,data&deleted_at=is.null&order=plate_no.asc').then(function(rows){
      var map = {};

        (v.history || []).forEach(function(h){
          var iq = normId(h.driver_id); if (!iq) return;
          (map[iq] = map[iq] || []).push({
            plate: v.plate, vehicle_type: v.vehicle_type, fuel: v.fuel, rental_office: v.rental_office, sheet: v.sheet,
            project: h.project || v.project, area: h.area || v.area, date_receive: h.date_receive || '', date_deliver: h.date_deliver || '',
            status: h.status || '', branch_receive: h.branch_receive || '', branch_deliver: h.branch_deliver || '',
            reason: h.reason || '', notes: h.notes || '', active: isActive(h)
          });
        });
      });
      if (!rows.length) return 0;
      derivedVeh = map; var n = 0;
      state.employees.forEach(function(e){
        var nv = map[normId(e.iqama)] || [];
        if (JSON.stringify(nv) !== JSON.stringify(e.vehicles || [])) { e.vehicles = nv; n++; }

  /* ---------- رفع التعديلات ---------- */
  var pushing = false, pushTimer = null, ready = false;
  function schedulePush(){ if (!ready) return; clearTimeout(pushTimer); pushTimer = setTimeout(pushAll, PUSH_DELAY); }
  function pushColl(c, forceAll){
    var m = c.meta, list = c.list(); if (!list) return Promise.resolve({ sent: 0 });
    var rows = [], hs = {}, present = {}, ts = nowIso();
    list.forEach(function(it){
      var k = c.key(it); if (!k || present[k]) return; present[k] = 1;
      var h = rowHash(c, it);
      if (forceAll || m.hashes[k] !== h) { var r = c.toRow(it); r.edited_at = ts; rows.push(r); hs[k] = h; }
    });
    var gone = c.apply ? [] : Object.keys(m.hashes).filter(function(k){ return !present[k]; });
    if (gone.length > 10 && !confirm('سيتم حذف ' + gone.length + ' ' + c.label + ' من القاعدة لأنها حُذفت من هذا الجهاز.\nهل أنت متأكد؟ (إلغاء = لا تحذف)')) {
      gone.forEach(function(k){ delete m.hashes[k]; }); saveMeta(c); gone = [];
    }
    gone.forEach(function(k){
      var r = { edited_at: ts, deleted: true }; if (c.id === 'employees') r.iqama = k; else if (c.id === 'vehicles') r.plate = k; else r.key = k;
      rows.push(r); hs[k] = null;
    });
    if (!rows.length) return Promise.resolve({ sent: 0 });
    var res = { sent: rows.length, ok: 0, stale: [], failed: [], issues: 0 };
    var chunks = []; for (var i = 0; i < rows.length; i += BATCH) chunks.push(rows.slice(i, i + BATCH));
    return chunks.reduce(function(p, ch){
      return p.then(function(){
        return c.push(ch).then(function(r){
          var bad = {}; (r.stale || []).forEach(function(k){ bad[k] = 1; res.stale.push(k); });
          (r.failed || []).forEach(function(f){ bad[f.key] = 1; res.failed.push(f); });
          res.ok += r.ok || 0; res.issues += r.issues || 0;
          ch.forEach(function(row){
            var k = row.iqama || row.plate || row.key; if (bad[k]) return;
            if (hs[k] === null) delete m.hashes[k]; else m.hashes[k] = hs[k];
          });
          saveMeta(c);
        });
      });
    }, Promise.resolve()).then(function(){
      res.stale.forEach(function(k){ c.force[k] = 1; });   /* الخادم أحدث → نأخذ نسخته */
      return res;
    });
  }
  function pushAll(forceAll){
    if (!ready || pushing) { if (ready) schedulePush(); return Promise.resolve(); }
    pushing = true; setChip('sync');
    var summary = { sent: 0, stale: 0, failed: [], issues: 0 };
    return COLLS.reduce(function(p, c){
      return p.then(function(){ return pushColl(c, forceAll).then(function(r){
        summary.sent += r.sent || 0; summary.stale += (r.stale || []).length; summary.failed = summary.failed.concat(r.failed || []); summary.issues += r.issues || 0;
      }); });
    }, Promise.resolve()).then(function(){
      pushing = false;
      if (summary.failed.length) note('⚠️ تعذّر حفظ ' + summary.failed.length + ' سجل في القاعدة: ' + summary.failed[0].error, 'red');
      if (summary.stale) { note('🔄 ' + summary.stale + ' سجل عُدِّل من جهاز آخر — تم جلب الأحدث', 'amber'); pullAll(); }
      if (summary.issues) { note('📋 ' + summary.issues + ' ملاحظة جديدة على القواعد — افتح «ملاحظات المزامنة»', 'amber'); refreshIssues(); }
      setChip('ok');
    }).catch(function(e){ pushing = false; setChip('off', e.message); });
  }

  }

      var m = modal('📋 ملاحظات المزامنة (' + rows.length + ')', html);
      m.querySelectorAll('button[data-id]').forEach(function(b){
        b.onclick = function(){ api('PATCH', 'sync_issues?id=eq.' + b.getAttribute('data-id'), { resolved_at: nowIso() }, { Prefer: 'return=minimal' })
          .then(function(){ b.closest('tr').remove(); issuesCount = Math.max(0, issuesCount - 1); setChip('ok'); }); };
      });
    }).catch(function(e){ note('تعذّر تحميل الملاحظات: ' + e.message, 'red'); });
  }

  function showUsers(){
    Promise.all([
      api('GET', 'profiles?select=id,email,full_name,role,approved,created_at,phone,requested&order=approved.asc,created_at.desc'),
      api('GET', 'profile_projects?select=profile_id,project_code'),
      api('GET', 'projects?select=code&order=code.asc')
    ]).then(function(res){
      var users = res[0] || [], pp = res[1] || [], projs = (res[2] || []).map(function(p){ return p.code; });
      var byUser = {}; pp.forEach(function(x){ (byUser[x.profile_id] = byUser[x.profile_id] || []).push(x.project_code); });
      var roles = [['admin','مدير النظام'],['manager','مدير'],['finance','مالية'],['supervisor','مشرف'],['maintenance','صيانة'],['viewer','مشاهد']];
      var html = '<div style="margin-bottom:10px;color:#5b6b6b">كل حساب جديد يبقى محظوراً حتى تعتمده. المشرف والمشاهد يريان مشاريعهم فقط (افصل الأكواد بفاصلة).</div>'
        + '<table><tr><th>المستخدم</th><th>الدور</th><th>المشاريع</th><th>معتمد</th><th></th></tr>'
        + users.map(function(u){
          var rq = u.requested || {}, jobAr = { viewer:'متابعة', supervisor:'مشرف', maintenance:'صيانة', finance:'مالية', manager:'إدارة' };
          var info = [u.phone && ('📱 ' + u.phone), rq.iqama && ('🪪 ' + rq.iqama), rq.project && ('📁 ' + rq.project), rq.job && ('طلب: ' + (jobAr[rq.job] || rq.job))].filter(Boolean).join(' · ');
          return '<tr data-id="' + u.id + '"' + (u.approved ? '' : ' style="background:#fdf6ea"') + '><td><b>' + esc(u.full_name || '') + '</b>' + (u.approved ? '' : ' <span style="color:#9a5b12;font-size:11px">● طلب جديد</span>')
            + '<br><span style="color:#5b6b6b">' + esc(u.email) + '</span>'
            + (info ? '<br><span style="color:#5b6b6b;font-size:12px">' + esc(info) + '</span>' : '') + (rq.note ? '<br><span style="font-size:12px">📝 ' + esc(rq.note) + '</span>' : '') + '</td>'
            + '<td><select class="r">' + roles.map(function(r){ var sel = u.approved ? u.role : (rq.job && rq.job !== 'manager' ? rq.job : u.role); return '<option value="' + r[0] + '"' + (sel === r[0] ? ' selected' : '') + '>' + r[1] + '</option>'; }).join('') + '</select></td>'
            + '<td><input class="p" style="width:170px;direction:ltr" value="' + esc((byUser[u.id] || (!u.approved && rq.project ? [rq.project] : [])).join(', ')) + '" placeholder="NINJA, KEEMART"></td>'
            + '<td><input class="a" type="checkbox"' + (u.approved ? ' checked' : '') + (u.id === (sess && sess.user_id) ? ' disabled' : '') + '></td>'
            + '<td><button class="btn">حفظ</button></td></tr>';
        }).join('') + '</table><div style="margin-top:8px;color:#5b6b6b;font-size:12px">المشاريع المتاحة: ' + esc(projs.join('، ')) + '</div>';
      var m = modal('👥 المستخدمون والصلاحيات', html);
      m.querySelectorAll('tr[data-id] .btn').forEach(function(b){
        b.onclick = function(){
          var tr = b.closest('tr'), id = tr.getAttribute('data-id');
          var body = { role: tr.querySelector('.r').value }; if (!tr.querySelector('.a').disabled) body.approved = tr.querySelector('.a').checked;
          var codes = tr.querySelector('.p').value.split(/[,،\s]+/).map(function(s){ return s.trim().toUpperCase(); }).filter(Boolean);
          b.disabled = true;
          api('PATCH', 'profiles?id=eq.' + id, body, { Prefer: 'return=minimal' })
            .then(function(){ return api('DELETE', 'profile_projects?profile_id=eq.' + id, null, { Prefer: 'return=minimal' }); })
            .then(function(){ return codes.length ? api('POST', 'profile_projects', codes.map(function(c){ return { profile_id: id, project_code: c }; }), { Prefer: 'return=minimal' }) : null; })
            .then(function(){ b.disabled = false; b.textContent = '✓ حُفظ'; })
            .catch(function(e){ b.disabled = false; note('تعذّر الحفظ: ' + e.message, 'red'); });
        };
      });
    }).catch(function(e){ note('تعذّر تحميل المستخدمين: ' + e.message, 'red'); });
  }

  /* ربط صلاحيات القاعدة بجلسة التطبيق القديمة (wf_session_v3) */
  function bridgeLegacySession(){
    if (!me) return;
    var full = me.role === 'admin' || me.role === 'manager';
    var perms = { view: true, edit: me.role !== 'viewer', finance: full || me.role === 'finance', manage: me.role === 'admin' };
    var proj = (me.projects && me.projects.length && !full && me.role !== 'finance') ? me.projects[0] : '';
    try { sessionStorage.setItem('wf_session_v3', JSON.stringify({ username: me.email, email: me.email, role: full ? 'admin' : 'user', project: proj, perms: perms })); } catch(e){}
  }

  /* ═════════════════════ التشغيل ═════════════════════ */
  var started = false;
  function start(){
    if (started) return;
    rpc('whoami').then(function(w){
      me = w || null;
      if (!me) { logout(true); return; }
      if (!me.approved) { showGate('حسابك (' + me.email + ') بانتظار موافقة المدير. سيظهر لك النظام بعد الاعتماد.', true); sess = null; try { localStorage.removeItem(SKEY); } catch(e){} return; }
      started = true; hideGate(); bridgeLegacySession(); hookSaves(); setChip('sync');
      var veil = null;
      if (!(COLLS[0].list() || []).length) {
        veil = document.createElement('div'); veil.id = 'wfsbVeil';
        veil.style.cssText = 'position:fixed;inset:0;z-index:2147483500;background:rgba(244,239,230,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 15px system-ui,Tahoma;color:#0f6e6e;direction:rtl';
        veil.innerHTML = '<div style="width:38px;height:38px;border:4px solid #d8e6e3;border-top-color:#0f6e6e;border-radius:50%;animation:wfsbSpin 1s linear infinite"></div>جارٍ تحميل البيانات من القاعدة…<style>@keyframes wfsbSpin{to{transform:rotate(360deg)}}</style>';
        document.body.appendChild(veil);
      }
      var unveil = function(){ if (veil) { veil.remove(); veil = null; } };
      COLLS.forEach(function(c){ c.force = {}; loadMeta(c); });
      var firstRun = COLLS.some(function(c){ return c.meta.first; });
      return pullKv().then(function(){ return pullAll(true); }).then(function(){
        ready = true;
        /* القاعدة فارغة؟ المدير يرفع بيانات هذا الجهاز لأول مرة */
        return api('GET', COLLS[0].select.split('?')[0] + '?select=updated_at&limit=1').then(function(r){
          var empty = !r || !r.length, localN = (COLLS[0].list() || []).length;
          if (empty && localN && !window.WF_CLOUD && (me.role === 'admin' || me.role === 'manager')) {
            if (confirm('قاعدة البيانات لا تحتوي أي ' + COLLS[0].label + ' بعد.\nرفع ' + localN + ' ' + COLLS[0].label + ' الموجودين على هذا الجهاز الآن؟')) {
              note('⬆️ جارٍ رفع البيانات…', 'amber');
              return pushAll(true).then(function(){ pushKv(); note('✅ تم رفع البيانات إلى القاعدة'); });
            }
          } else if (firstRun) { return pushAll(); }
        });
      }).then(function(){ unveil(); refreshIssues(); setChip('ok'); }, function(e){ unveil(); throw e; });
    }).catch(function(e){
      if (/no session|401/.test(e.message)) showGate();
      else { setChip('off', e.message); setTimeout(function(){ started = false; start(); }, 15000); }
    });
  }

  setInterval(function(){ if (ready && !pushing && document.visibilityState !== 'hidden') pullAll().catch(function(){}); }, PULL_EVERY);
  setInterval(function(){ if (ready) pushAll(); }, 60000);                       /* إعادة محاولة ما لم يُرفع (انقطاع إنترنت) */
  window.addEventListener('online', function(){ if (ready) pushAll(); });
  document.addEventListener('visibilitychange', function(){ if (ready && document.visibilityState === 'visible') pullAll().catch(function(){}); });

  window.wfSupabase = { pull: pullAll, push: pushAll, issues: showIssues, users: showUsers, logout: logout, me: function(){ return me; } };

  function boot(){ if (sess) start(); else showGate(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
