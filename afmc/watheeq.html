<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="petrol">
<head>
<script id="wf-cloud">window.WF_CLOUD_APP="watheeq";
/* ═══════════════════════════════════════════════════════════════════════
   wf-cloud — النسخة السحابية لأنظمة AFMC (تُحقن في <head> قبل أي كود)
   • لا حفظ محلي على الجهاز (ملفات/نسخ/ربط مجلد) — القاعدة الموحّدة هي الحفظ الوحيد
   • لا واتساب (أزرار، إعدادات، إرسال تلقائي، روابط wa.me)
   • تبقى كل الوظائف الأخرى كما هي — التصدير إلى Excel يبقى
   • Ninja و Keemart: مفاتيح تخزين منفصلة لكل نظام (لا تداخل بينهما)
   ═══════════════════════════════════════════════════════════════════════ */
(function(){
  var APP = window.WF_CLOUD_APP || '';
  window.WF_CLOUD = true;
  var WA = /wa\.me|api\.whatsapp|whatsapp:|web\.whatsapp/i;

  /* ---------- 1) Ninja/Keemart: تخزين منفصل لكل نظام ---------- */
  if (APP === 'ninja' || APP === 'keemart') {
    try {
      var P = Storage.prototype, g = P.getItem, s = P.setItem, r = P.removeItem, pre = APP + '::';
      var mine = function(k){ return typeof k === 'string' && /^fleet_/.test(k); };
      P.getItem = function(k){ return g.call(this, this === window.localStorage && mine(k) ? pre + k : k); };
      P.setItem = function(k, v){ return s.call(this, this === window.localStorage && mine(k) ? pre + k : k, v); };
      P.removeItem = function(k){ return r.call(this, this === window.localStorage && mine(k) ? pre + k : k); };
    } catch(e){}
  }

  /* ---------- 2) منع واتساب وملفات الجهاز على مستوى المتصفح ---------- */
  try {
    var _open = window.open;
    window.open = function(u){ if (WA.test(String(u || ''))) return null; return _open.apply(window, arguments); };
  } catch(e){}
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest && e.target.closest('a[href]');
    if (a && WA.test(a.getAttribute('href') || '')) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  ['showSaveFilePicker', 'showOpenFilePicker', 'showDirectoryPicker'].forEach(function(f){
    try { if (window[f]) window[f] = function(){ return Promise.reject(new DOMException('disabled in cloud edition', 'AbortError')); }; } catch(e){}
  });

  /* ---------- 3) إخفاء الواجهات ---------- */
  var HIDE = {
    common: ['#wfiBtn', '.wa-btn', '[onclick*="WhatsApp"]', '[onclick*="openWA"]', '[onclick*="sendWA"]', '[onclick*="downloadHTML"]',
             '#waFloatMsg', '#waSendModal', '[data-wa]'],
    watheeq: ['#wx4Pill', '#wx4Link', '#wx4Save', '#wx4Rest', '#wx4Sep1', '#wx4Veh', '#wx4VehBtn',
              '[onclick*="wx11Wa"]', '[onclick*="wx10Share"]', '[onclick*="wx4"]', '#cloudPill', '#wfsbStale'],
    fleet: ['#btn-save-now', '[onclick*="saveToFolder"]', '[onclick*="openDataManager"]', '[onclick*="importFromFile"]',
            '[onclick*="setupSaveFolder"]', '[onclick*="_writeToHandle"]', '[onclick*="openWAConfig"]', '[onclick*="sendDriverWhatsApp"]',
            '#fsSaveCard', '#fsPick', '#mtWaAll', '#mtWaOne', '#mtWaC', '#waConfigModal', '#save-label'],
    ninja: ['#wa-panel', '#waPanel', '.wa-panel'], keemart: ['#wa-panel', '#waPanel', '.wa-panel']
  };
  var sel = HIDE.common.concat(HIDE[APP] || []).join(',');
  var st = document.createElement('style'); st.id = 'wf-cloud-css';
  st.textContent = sel + '{display:none!important}';
  (document.head || document.documentElement).appendChild(st);

  /* نصوص صريحة لأزرار الحفظ المحلي/واتساب التي تُنشأ بلا معرّف */
  var TXT = /واتس|whatsapp|حفظ الآن على الجهاز|ربط ملف الحفظ|استرجاع من ملف الجهاز|اربط ملفاً على الجهاز|إدارة البيانات والحفظ|تحميل HTML|إعداد مجلد الحفظ|تغيير الملف|📂 فتح ملف/i;
  var busy = false, t = null;
  function sweep(){
    if (busy) return; busy = true;
    try {
      var els = document.querySelectorAll('button, a.btn, .btn, [role="button"], .menu-item, li > a');
      for (var i = 0; i < els.length; i++) {
        var el = els[i]; if (el.__wfc) continue;
        var tx = (el.textContent || '').trim();
        if (tx && tx.length < 60 && TXT.test(tx)) { el.style.setProperty('display', 'none', 'important'); el.__wfc = 1; }
      }
    } catch(e){}
    busy = false;
  }
  function later(){ clearTimeout(t); t = setTimeout(sweep, 250); }
  function observe(){
    sweep();
    try { new MutationObserver(function(){ if (!busy) later(); }).observe(document.body, { childList: true, subtree: true }); } catch(e){}
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', observe); else observe();

  /* ---------- 4) تعطيل الدوال (بعد تعريفها) ---------- */
  var NOOP = {
    common: ['openWAPanel', 'sendWAMessage', 'triggerAutoSend', 'openWAConfig', 'saveWAConfig', 'sendDriverWhatsApp', 'downloadHTML'],
    watheeq: ['wx4LinkFile', 'wx4SaveNow', 'wx4Restore', 'wx11Wa', 'wx10ShareFallback'],
    fleet: ['saveToFolder', 'autoSave', 'setupSaveFolder', 'openDataManager', 'importFromFile', '_writeToHandle', 'idbClearHandle'],
    ninja: [], keemart: []
  };
  function neutralize(){
    NOOP.common.concat(NOOP[APP] || []).forEach(function(f){
      try { if (typeof window[f] === 'function' && !window[f].__wfc) { var n = function(){ return Promise.resolve(false); }; n.__wfc = true; window[f] = n; } } catch(e){}
    });
    try { if (typeof waDailyTimer !== 'undefined' && waDailyTimer) { clearInterval(waDailyTimer); clearTimeout(waDailyTimer); } } catch(e){}
  }
  document.addEventListener('DOMContentLoaded', neutralize);
  window.addEventListener('load', function(){ neutralize(); setTimeout(neutralize, 1500); });
})();

</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وثيق — إدارة الموظفين والأسطول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4efe6; --surface:#fffdf8; --surface-2:#faf6ee; --ink:#1f2a2e; --muted:#6d7a7e;
  --line:#e7ded0; --brand:#0f6e6e; --brand-2:#13807f; --brand-ink:#fff;
  --sand:#d8b98a; --sand-deep:#c79a63; --ok:#2f8f64; --warn:#c9742b; --bad:#b14a3c;
  --chip:#eef4f2; --shadow:0 1px 2px rgba(31,42,46,.06),0 8px 24px rgba(31,42,46,.06);
  --radius:16px;
}
[data-theme="sand"]{--bg:#f3ece0;--surface:#fffdf9;--surface-2:#f7f0e4;--brand:#a9763a;--brand-2:#b9853f;--sand:#7c9c8e;--chip:#f1e7d6;--line:#e6d9c2;}
[data-theme="indigo"]{--bg:#eef0f6;--surface:#ffffff;--surface-2:#f5f6fb;--brand:#3a4d9e;--brand-2:#465bb8;--sand:#d8a657;--chip:#e9ecf7;--line:#dfe2ef;--ink:#1d2333;}
[data-theme="plum"]{--bg:#f4eef2;--surface:#fffcfe;--surface-2:#f8f1f5;--brand:#7a3563;--brand-2:#8d3f73;--sand:#c98a4f;--chip:#f1e3ec;--line:#ead9e3;}
[data-theme="slate"]{--bg:#eceef0;--surface:#ffffff;--surface-2:#f5f7f8;--brand:#2f4858;--brand-2:#3a5868;--sand:#c98a4f;--chip:#e8edf0;--line:#dde2e6;--ink:#1b242a;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Readex Pro','Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ---- top bar ---- */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;box-shadow:var(--shadow)}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:-3px}
nav.tabs{display:flex;gap:4px;margin-inline-start:auto;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--line)}
nav.tabs button{padding:8px 16px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);transition:.15s}
nav.tabs button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);transition:.15s}
.iconbtn:hover{color:var(--brand);border-color:var(--brand)}
.iconbtn svg{width:18px;height:18px}

/* ---- sections ---- */
section.view{display:none;padding:26px 0 60px}
section.view.on{display:block}
.h-row{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.h-row h1{font-size:22px;font-weight:700}
.h-row p{color:var(--muted);font-size:13px}

/* ---- stat grid ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);text-align:start;transition:.15s;position:relative;overflow:hidden}
.stat:hover{transform:translateY(-2px);border-color:var(--brand)}
.stat .v{font-size:26px;font-weight:700;color:var(--brand);line-height:1.1}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:5px}
.stat .ic{position:absolute;inset-inline-end:12px;top:12px;opacity:.18}
.stat .ic svg{width:26px;height:26px;color:var(--brand)}

/* ---- finance summary ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:18px}
.panel h2{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h2 svg{width:17px;height:17px;color:var(--brand)}
.fin{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fin .f{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fin .f .v{font-size:18px;font-weight:700}
.fin .f .k{font-size:12px;color:var(--muted)}
.fin .f.net .v{color:var(--ok)} .fin .f.adv .v{color:var(--warn)} .fin .f.acc .v{color:var(--bad)}

/* ---- bars ---- */
.bars{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
@media(max-width:760px){.bars{grid-template-columns:1fr}}
.bar-row{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.bar-row .nm{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .track{height:9px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar-row .fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:6px}
.bar-row .ct{text-align:end;font-weight:600;color:var(--brand)}

/* ---- toolbar ---- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 42px 0 14px;font-size:14px;color:var(--ink)}
.search svg{position:absolute;inset-inline-start:14px;top:12px;width:18px;height:18px;color:var(--muted)}
.toolbar select{height:42px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;font-size:13.5px;color:var(--ink);min-width:130px}

.return{display:none;align-items:center;gap:10px;background:color-mix(in srgb,var(--brand) 10%,var(--surface));border:1px solid var(--brand);border-radius:12px;padding:9px 14px;margin-bottom:14px;font-size:13.5px;color:var(--brand)}
.return.on{display:flex}
.return button{margin-inline-start:auto;font-weight:600;text-decoration:underline}

/* ---- employee cards ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;cursor:pointer;transition:.15s;text-align:start}
.card:hover{transform:translateY(-2px);border-color:var(--brand)}
.card .top-line{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex-shrink:0}
.card .nm{font-weight:600;font-size:15px;line-height:1.3}
.card .sub{font-size:12px;color:var(--muted)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--brand);font-weight:500;border:1px solid transparent}
.chip.sand{background:color-mix(in srgb,var(--sand) 30%,transparent);color:var(--sand-deep,#9a6f33)}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.chip.line{background:transparent;border-color:var(--line);color:var(--muted)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;background:rgba(20,28,30,.45);backdrop-filter:blur(2px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
.scrim.on{display:flex}
.modal{width:100%;max-width:720px;background:var(--surface);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.3);overflow:hidden}
.modal .head{padding:20px 22px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:flex;align-items:center;gap:14px}
.modal .head .avatar{background:rgba(255,255,255,.2);width:48px;height:48px}
.modal .head .nm{font-size:18px;font-weight:700}
.modal .head .sub{font-size:12.5px;opacity:.9}
.modal .head .x{margin-inline-start:auto;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.mtabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface-2);overflow-x:auto}
.mtabs button{padding:13px 18px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.mtabs button.on{color:var(--brand);border-bottom-color:var(--brand);background:var(--surface)}
.mbody{padding:20px 22px;max-height:62vh;overflow:auto}
.mpane{display:none} .mpane.on{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.field{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.field .k{font-size:11.5px;color:var(--muted)} .field .v{font-size:14px;font-weight:500;margin-top:2px;word-break:break-word}

/* timeline */
.tl{position:relative;padding-inline-start:22px}
.tl::before{content:"";position:absolute;inset-inline-start:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .node{position:relative;margin-bottom:16px}
.tl .node::before{content:"";position:absolute;inset-inline-start:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--sand)}
.tl .node.active::before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.tl .vc{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tl .vc .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14px}
.tl .vc .rows{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

/* finance card */
.fcard{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fcard .rowf{display:flex;justify-content:space-between;padding:11px 15px;font-size:14px;border-bottom:1px solid var(--line)}
.fcard .rowf:last-child{border-bottom:none}
.fcard .rowf .lbl{color:var(--muted)} .fcard .rowf .val{font-weight:600}
.fcard .rowf.total{background:var(--surface-2)} .fcard .rowf.total .val{color:var(--ok);font-size:16px}
.adv-item{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;font-size:13.5px}
.adv-item .del{margin-inline-start:auto;color:var(--bad);width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.adv-add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.adv-add input{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 11px;font-size:13px;background:var(--surface)}
.btn{height:38px;padding:0 16px;border-radius:10px;background:var(--brand);color:#fff;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.btn.ghost{background:var(--surface);color:var(--brand);border:1px solid var(--brand)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.note-item{padding:11px 14px;border-radius:11px;border:1px solid var(--line);margin-bottom:8px;font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.note-item .dot{width:8px;height:8px;border-radius:50%;background:var(--sand);margin-top:7px;flex-shrink:0}
.note-item.acc .dot{background:var(--bad)}

/* projects */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.pcard h3{font-size:16px;font-weight:700;color:var(--brand);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pcard .pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard .pg .pi{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.pcard .pg .pi .v{font-weight:700;font-size:16px} .pcard .pg .pi .k{font-size:11px;color:var(--muted)}

/* menus / dialogs */
.menu{position:absolute;inset-inline-end:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:6px;min-width:210px;display:none;z-index:50}
.menu.on{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--ink);text-align:start}
.menu button:hover{background:var(--surface-2);color:var(--brand)}
.menu .sep{height:1px;background:var(--line);margin:5px 2px}
.menu svg{width:16px;height:16px;color:var(--muted)}
.pop-wrap{position:relative}
.themes{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.swatch{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);cursor:pointer;position:relative}
.swatch.on{border-color:var(--ink)}
.swatch span{position:absolute;inset-inline-start:4px;inset-block-end:4px;width:14px;height:14px;border-radius:4px}

.toast{position:fixed;inset-block-end:24px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(50%) translateY(-4px)}
.dlg-scrim{position:fixed;inset:0;background:rgba(20,28,30,.45);z-index:70;display:none;place-items:center;padding:16px}
.dlg-scrim.on{display:grid}
.dlg{background:var(--surface);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:440px;width:100%;padding:22px}
.dlg h3{font-size:16px;margin-bottom:6px}
.dlg p{font-size:13.5px;color:var(--muted);margin-bottom:16px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end}
.hidden-file{display:none}
@media print{header.top,.toolbar,nav.tabs,.iconbtn,.return{display:none!important}.card{break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><div class="mark">و</div><div>وثيق<small>إدارة الموظفين والأسطول</small></div></div>
    <nav class="tabs">
      <button data-view="dash" class="on">لوحة المعلومات</button>
      <button data-view="emp">الموظفون</button>
      <button data-view="proj">المشاريع</button>
    </nav>
    <div class="pop-wrap">
      <button class="iconbtn" id="dataBtn" title="بيانات وتصدير"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
      <div class="menu" id="dataMenu">
        <button onclick="pickImport()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5M5 21h14"/></svg>استيراد (JSON / Excel)</button>
        <div class="sep"></div>
        <button onclick="exportJSON()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>تصدير JSON</button>
        <button onclick="exportCSV()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>تصدير CSV</button>
        <button onclick="exportXLSX()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>تصدير Excel</button>
        <button onclick="exportAdvances()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>تصدير السلف</button>
        <div class="sep"></div>
        <button onclick="window.print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>طباعة</button>
      </div>

    <div class="pop-wrap">
      <button class="iconbtn" id="themeBtn" title="الألوان"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6.5" cy="9" r="1.6"/><circle cx="12" cy="6.5" r="1.6"/><circle cx="17.5" cy="9" r="1.6"/><circle cx="12" cy="14" r="1.6"/><path d="M12 21a9 9 0 1 1 0-18c4 0 6 2.5 6 5 0 2-1.5 3-3 3h-1.5c-1 0-1.5.8-1.5 1.7 0 .6.3 1 .6 1.4.4.5.8.9.8 1.7A2.1 2.1 0 0 1 12 21z"/></svg></button>
      <div class="menu" id="themeMenu" style="min-width:240px">
        <div style="font-size:13px;font-weight:600;padding:6px 8px 2px">لوحة الألوان</div>
        <div class="themes" id="themeSwatches"></div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- DASHBOARD -->
  <section class="view on" id="view-dash">
    <div class="h-row"><div><h1>لوحة المعلومات</h1><p id="genline"></p></div></div>
    <div class="stats" id="statGrid"></div>
    <div class="panel">
      <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>الملخّص المالي (ريال سعودي)</h2>
      <div class="fin" id="finGrid"></div>
    </div>
    <div class="bars">
      <div class="panel"><h2>التوزيع حسب المشروع</h2><div id="projBars"></div></div>
      <div class="panel"><h2>التوزيع حسب المدينة</h2><div id="areaBars"></div></div>
    </div>
  </section>

  <!-- EMPLOYEES -->
  <section class="view" id="view-emp">
    <div class="h-row"><div><h1>الموظفون والسائقون</h1><p id="empCount"></p></div></div>
    <div class="return" id="returnBanner"><span id="returnText"></span><button onclick="clearFilter()">إلغاء التصفية ↩</button></div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="بحث بالاسم أو رقم الإقامة أو الجوال…"></div>
      <select id="fStatus"><option value="">كل الحالات</option><option value="active">موظف</option><option value="stopped">متوقّف / مفوّض</option><option value="salary_only">راتب فقط</option></select>
      <select id="fProject"><option value="">كل المشاريع</option></select>
      <select id="fCat"><option value="">الكل (سيارة/دراجة)</option><option value="car">سائق سيارة</option><option value="motorcycle">سائق دراجة</option></select>
    </div>
    <div class="cards" id="empCards"></div>
  </section>

  <!-- PROJECTS -->
  <section class="view" id="view-proj">
    <div class="h-row"><div><h1>المشاريع</h1><p>ملخّص كل مشروع — مبني من البيانات المستوردة</p></div></div>
    <div class="pcards" id="projCards"></div>
  </section>
</main>

<!-- MODAL -->
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<input type="file" id="importFile" class="hidden-file" accept=".json,.xlsx,.xls">
<div class="toast" id="toast"></div>
<div class="dlg-scrim" id="dlgScrim"><div class="dlg" id="dlg"></div></div>

<script>
const DB = {"employees": [], "stats": {}, "generated": "", "manager": "", "source_version": "AFMC Cloud", "wa": {}};
let state = { employees: [], stats: {}, filter:{status:'',project:'',cat:'',q:''}, view:'dash', current:null };
const $ = s => document.querySelector(s);
const fmt = n => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => { const p=String(n||'؟').trim().split(/\s+/); return (p[0]?.[0]||'؟')+(p[1]?.[0]||''); };
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}

/* ---------- persistence ---------- */
const LSKEY='watheeq_db_v1';
function persist(){ try{ localStorage.setItem(LSKEY, JSON.stringify({employees:state.employees})); }catch(e){} }
function loadLocal(){ try{ const r=localStorage.getItem(LSKEY); if(r){const o=JSON.parse(r); if(o.employees?.length) return o.employees;} }catch(e){} return null; }

/* ---------- stats (mirror of python) ---------- */
function advTotal(f){ if(!f) return 0; const extra=(f.advances||[]).reduce((s,a)=>s+(Number(a.amount)||0),0); return (Number(f.advance)||0)+extra; }
function recomputeStats(){
  const E=state.employees, s={byProject:{},byArea:{}};
  s.totalEmployees=E.length;
  s.withVehicleActive=E.filter(e=>e.employment_status==='active'&&!e.salary_only).length;
  s.stopped=E.filter(e=>e.employment_status==='stopped').length;
  s.salaryOnly=E.filter(e=>e.salary_only).length;
  s.withFinance=E.filter(e=>e.finance).length;
  s.cars=E.filter(e=>e.category==='car').length;
  s.motorcycles=E.filter(e=>e.category==='motorcycle').length;
  s.withNotes=E.filter(e=>e.notes&&e.notes.length).length;
  s.totalVehicleRecords=E.reduce((a,e)=>a+(e.vehicles?.length||0),0);
  s.multiVehicle=E.filter(e=>(e.vehicles?.length||0)>1).length;
  s.accidents=E.filter(e=>(e.notes||[]).some(n=>n.kind==='accident')).length;
  E.forEach(e=>{const p=e.project||'غير محدد';s.byProject[p]=(s.byProject[p]||0)+1;const a=e.area||'غير محدد';s.byArea[a]=(s.byArea[a]||0)+1;});
  const fz=k=>E.reduce((a,e)=>a+(e.finance?Number(e.finance[k])||0:0),0);
  s.sumBaseSalary=fz('base');s.sumNet=fz('net');s.sumAccident=fz('accident');s.sumDeduct=fz('deduction');s.sumBonus=fz('bonus');
  s.sumAdvance=E.reduce((a,e)=>a+advTotal(e.finance),0);
  s.byProject=Object.fromEntries(Object.entries(s.byProject).sort((a,b)=>b[1]-a[1]));
  s.byArea=Object.fromEntries(Object.entries(s.byArea).sort((a,b)=>b[1]-a[1]));
  state.stats=s; return s;
}

/* ---------- dashboard ---------- */
const STAT_DEFS=[
  {k:'totalEmployees',label:'إجمالي الموظفين',f:null},
  {k:'withVehicleActive',label:'على رأس العمل',f:{status:'active'}},
  {k:'stopped',label:'متوقّف / مفوّض',f:{status:'stopped'}},
  {k:'salaryOnly',label:'راتب فقط',f:{status:'salary_only'}},
  {k:'withFinance',label:'لديهم كرت مالي',f:{fin:true}},
  {k:'cars',label:'سائقو السيارات',f:{cat:'car'}},
  {k:'motorcycles',label:'سائقو الدراجات',f:{cat:'motorcycle'}},
  {k:'multiVehicle',label:'أكثر من مركبة',f:{multi:true}},
  {k:'accidents',label:'توالف وحوادث',f:{acc:true}},
  {k:'withNotes',label:'لديهم ملاحظات',f:{notes:true}},
];
function renderDash(){
  const s=state.stats;
  $('#genline').textContent='مدير التوظيف: '+(DB.manager||'—')+' · المصدر: '+(DB.source_version||'')+' · '+(state.employees.length)+' موظفاً';
  $('#statGrid').innerHTML=STAT_DEFS.map(d=>`<button class="stat" onclick='applyStat(${JSON.stringify(d.f)})'>
    <div class="v">${fmt(s[d.k]||0)}</div><div class="k">${d.label}</div></button>`).join('');
  const fin=[
    {k:'sumBaseSalary',l:'الرواتب الأساسية',c:''},{k:'sumNet',l:'صافي الرواتب',c:'net'},
    {k:'sumAdvance',l:'السلف',c:'adv'},{k:'sumAccident',l:'التوالف والحوادث',c:'acc'},
    {k:'sumDeduct',l:'الخصميات',c:''},{k:'sumBonus',l:'الحوافز',c:''}];
  $('#finGrid').innerHTML=fin.map(f=>`<div class="f ${f.c}"><div class="v">${fmt(s[f.k])}</div><div class="k">${f.l}</div></div>`).join('');
  $('#projBars').innerHTML=bars(s.byProject);
  $('#areaBars').innerHTML=bars(s.byArea);
}
function bars(obj){const ent=Object.entries(obj);const mx=Math.max(1,...ent.map(e=>e[1]));
  return ent.map(([k,v])=>`<div class="bar-row"><div class="nm" title="${esc(k)}">${esc(k)}</div><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><div class="ct">${v}</div></div>`).join('');}

function applyStat(f){ state.filter={status:'',project:'',cat:'',q:'',...(f||{})}; go('emp'); syncControls(); renderEmp(); setReturn(f); }
function setReturn(f){const b=$('#returnBanner');if(!f){b.classList.remove('on');return;}
  const map={status:{active:'على رأس العمل',stopped:'متوقّف / مفوّض',salary_only:'راتب فقط'},};
  let t='تصفية: ';if(f.status)t+=map.status[f.status];else if(f.cat)t+=(f.cat==='car'?'سائقو السيارات':'سائقو الدراجات');
  else if(f.fin)t+='لديهم كرت مالي';else if(f.multi)t+='أكثر من مركبة';else if(f.acc)t+='توالف وحوادث';else if(f.notes)t+='لديهم ملاحظات';
  $('#returnText').textContent=t;b.classList.add('on');}
function clearFilter(){state.filter={status:'',project:'',cat:'',q:''};syncControls();$('#returnBanner').classList.remove('on');renderEmp();}

/* ---------- employees ---------- */
function matchEmp(e,f){
  if(f.status&&e.employment_status!==f.status)return false;
  if(f.project&&e.project!==f.project)return false;
  if(f.cat&&e.category!==f.cat)return false;
  if(f.fin&&!e.finance)return false;
  if(f.multi&&(e.vehicles?.length||0)<=1)return false;
  if(f.acc&&!(e.notes||[]).some(n=>n.kind==='accident'))return false;
  if(f.notes&&!(e.notes&&e.notes.length))return false;
  if(f.q){const q=f.q.trim().toLowerCase();
    const hay=[e.name_ar,e.name_en,e.iqama,e.mobile].map(x=>String(x||'').toLowerCase()).join(' ');
    if(!hay.includes(q))return false;}
  return true;
}
function statusChip(e){
  if(e.employment_status==='active')return '<span class="chip ok">موظف</span>';
  if(e.employment_status==='salary_only')return '<span class="chip sand">راتب فقط</span>';
  return '<span class="chip line">متوقّف / مفوّض</span>';
}
function renderEmp(){
  const list=state.employees.filter(e=>matchEmp(e,state.filter));
  $('#empCount').textContent=list.length+' من '+state.employees.length+' موظف';
  if(!list.length){$('#empCards').innerHTML='<div class="empty">لا توجد نتائج مطابقة.</div>';return;}
  $('#empCards').innerHTML=list.slice(0,2000).map((e,i)=>{
    const idx=state.employees.indexOf(e);
    const catChip=e.category==='car'?'<span class="chip">سيارة · خصوصي</span>':e.category==='motorcycle'?'<span class="chip">دراجة نارية</span>':'';
    const acc=(e.notes||[]).some(n=>n.kind==='accident')?'<span class="chip bad">حادث</span>':'';
    return `<button class="card" onclick="openModal(${idx})">
      <div class="top-line"><div class="avatar">${esc(initials(e.name_ar||e.name_en))}</div>
        <div><div class="nm">${esc(e.name_ar||e.name_en||'—')}</div><div class="sub">${esc(e.iqama)}${e.mobile?' · '+esc(e.mobile):''}</div></div></div>
      <div class="meta">${statusChip(e)}${e.project?'<span class="chip sand">'+esc(e.project)+'</span>':''}${catChip}${e.finance?'<span class="chip">كرت مالي</span>':''}${acc}</div>
    </button>`;}).join('');
}
function syncControls(){$('#q').value=state.filter.q||'';$('#fStatus').value=state.filter.status||'';$('#fProject').value=state.filter.project||'';$('#fCat').value=state.filter.cat||'';}
function bindControls(){
  $('#q').addEventListener('input',e=>{state.filter.q=e.target.value;renderEmp();});
  $('#fStatus').addEventListener('change',e=>{state.filter.status=e.target.value;renderEmp();setReturn(null);});
  $('#fProject').addEventListener('change',e=>{state.filter.project=e.target.value;renderEmp();});
  $('#fCat').addEventListener('change',e=>{state.filter.cat=e.target.value;renderEmp();});
}
function fillProjects(){const ps=Object.keys(state.stats.byProject||{});
  $('#fProject').innerHTML='<option value="">كل المشاريع</option>'+ps.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');}

/* ---------- modal ---------- */
function openModal(idx,tab){
  const e=state.employees[idx]; if(!e)return; state.current=idx;
  const f=e.finance;
  const ov=[
    ['الاسم بالعربي',e.name_ar],['الاسم بالإنجليزي',e.name_en],['رقم الإقامة',e.iqama],['رقم الجوال',e.mobile],
    ['البريد الإلكتروني',e.email],['رقم الآيبان',e.iban],['الجنسية',e.nationality],['تاريخ الميلاد',e.birth_date],
    ['المهنة في الإقامة',e.profession],['المسمى / المشروع',e.job_title],['حالة التوظيف',e.status_label],
    ['نوع الرخصة',e.license_type],['رقم الرخصة',e.license_number],['مدينة العمل',e.area],
    ['حالة السكن',e.housing_status],['موقع السكن',e.housing_location],
  ];
  const fields=ov.filter(x=>x[1]).map(x=>`<div class="field"><div class="k">${x[0]}</div><div class="v">${esc(x[1])}</div></div>`).join('')||'<p style="color:var(--muted)">لا توجد بيانات.</p>';

  // vehicles timeline
  const vts=(e.vehicles||[]).map(v=>`<div class="node ${v.active?'active':''}">
    <div class="vc"><div class="hd">🚗 ${esc(v.plate)} <span style="font-weight:400;color:var(--muted)">${esc(v.vehicle_type)}</span>
      ${v.active?'<span class="chip ok">حالية / نشطة</span>':'<span class="chip line">منتهية</span>'}</div>
      <div class="rows">
        ${v.project?'<span class="chip sand">'+esc(v.project)+'</span>':''}
        ${v.area?'<span class="chip">'+esc(v.area)+'</span>':''}
        ${v.fuel?'<span class="chip line">'+esc(v.fuel)+'</span>':''}
        ${v.rental_office?'<span class="chip line">'+esc(v.rental_office)+'</span>':''}
        <span class="chip line">استلام: ${esc(v.date_receive||'—')}</span>
        <span class="chip line">${v.active?'مستمرة حتى الآن':'تسليم: '+esc(v.date_deliver||'—')}</span>
        ${v.reason?'<span class="chip warn">'+esc(v.reason)+'</span>':''}
      </div>${v.notes?'<div style="margin-top:8px;font-size:13px;color:var(--muted)">📝 '+esc(v.notes)+'</div>':''}
    </div></div>`).join('')||'<p style="color:var(--muted)">لا توجد مركبات مسجّلة (سجل راتب فقط).</p>';

  // finance card
  let finHtml='<p style="color:var(--muted)">لا يوجد كرت مالي لهذا الموظف.</p>';
  if(f){
    const rows=[['أيام الدوام',f.days||'—'],['الراتب الأساسي',fmt(f.base)],['الحوافز',fmt(f.bonus)],
      ['الخصميات',fmt(f.deduction)],['التوالف والحوادث',fmt(f.accident)],
      ['اسم صاحب الحساب',f.account||'—'],['الآيبان',f.iban||'—'],['ملف المصدر',f.source||'—']];
    const advList=(f.advances||[]).map((a,ai)=>`<div class="adv-item"><span>${fmt(a.amount)} ريال</span>
      <span style="color:var(--muted)">${esc(a.note||'')}${a.date?' · '+esc(a.date):''}</span>
      <button class="del" onclick="delAdvance(${idx},${ai})">✕</button></div>`).join('');
    finHtml=`<div class="fcard">${rows.map(r=>`<div class="rowf"><span class="lbl">${r[0]}</span><span class="val">${r[1]}</span></div>`).join('')}
      <div class="rowf"><span class="lbl">إجمالي السلف (مستوردة + يدوية)</span><span class="val">${fmt(advTotal(f))}</span></div>
      <div class="rowf total"><span class="lbl">صافي الراتب</span><span class="val">${fmt(f.net)} ريال</span></div></div>
      <div style="margin-top:16px"><div style="font-weight:600;font-size:14px;margin-bottom:8px">السلف اليدوية</div>
      ${advList||'<p style="color:var(--muted);font-size:13px">لا توجد سلف يدوية مضافة.</p>'}
      <div class="adv-add"><input type="number" id="advAmt" placeholder="المبلغ"><input id="advNote" placeholder="ملاحظة (اختياري)">
      <button class="btn sm" onclick="addAdvance(${idx})">+ إضافة سلفة</button></div></div>`;
  }

  // notes
  const notesHtml=(e.notes||[]).length?(e.notes.map(n=>`<div class="note-item ${n.kind==='accident'?'acc':''}"><span class="dot"></span>
    <div>${esc(n.text)}${n.plate?' <span style="color:var(--muted)">('+esc(n.plate)+')</span>':''}</div></div>`).join('')):'<p style="color:var(--muted)">لا توجد ملاحظات تشغيلية.</p>';

  $('#modal').innerHTML=`
    <div class="head"><div class="avatar">${esc(initials(e.name_ar||e.name_en))}</div>
      <div><div class="nm">${esc(e.name_ar||e.name_en||'—')}</div>
      <div class="sub">${esc(e.iqama)} · ${esc(e.status_label)}${e.project?' · '+esc(e.project):''}</div></div>
      <button class="x" onclick="closeModal()">✕</button></div>
    <div class="mtabs">
      <button data-pane="ov" class="on">نظرة عامة</button>
      <button data-pane="veh">سجل المركبات (${(e.vehicles||[]).length})</button>
      <button data-pane="fin">الكرت المالي</button>
      <button data-pane="notes">الملاحظات (${(e.notes||[]).length})</button>
    </div>
    <div class="mbody">
      <div class="mpane on" id="pane-ov"><div class="grid2">${fields}</div></div>
      <div class="mpane" id="pane-veh"><div class="tl">${vts}</div></div>
      <div class="mpane" id="pane-fin">${finHtml}</div>
      <div class="mpane" id="pane-notes">${notesHtml}</div>
    </div>`;
  $('#modal').querySelectorAll('.mtabs button').forEach(b=>b.onclick=()=>{
    $('#modal').querySelectorAll('.mtabs button').forEach(x=>x.classList.remove('on'));
    $('#modal').querySelectorAll('.mpane').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');$('#pane-'+b.dataset.pane).classList.add('on');});
  if(tab){const tb=$('#modal').querySelector(`.mtabs button[data-pane="${tab}"]`);if(tb)tb.click();}
  $('#scrim').classList.add('on');
}
function closeModal(){$('#scrim').classList.remove('on');state.current=null;}
function reopenModal(tab){if(state.current!=null)openModal(state.current,tab);}
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeModal();});

/* ---------- advances (only editable finance) ---------- */
function addAdvance(idx){
  const amt=Number($('#advAmt').value);if(!amt){toast('أدخل مبلغ السلفة');return;}
  const e=state.employees[idx];if(!e.finance)return;
  e.finance.advances=e.finance.advances||[];
  e.finance.advances.push({amount:amt,note:$('#advNote').value.trim(),date:new Date().toISOString().slice(0,10)});
  recomputeStats();persist();renderDash();reopenModal('fin');toast('تمت إضافة السلفة');
}
function delAdvance(idx,ai){
  const e=state.employees[idx];e.finance.advances.splice(ai,1);
  recomputeStats();persist();renderDash();reopenModal('fin');toast('تم حذف السلفة');
}

/* ---------- projects ---------- */
function renderProj(){
  const groups={};
  state.employees.forEach(e=>{const p=e.project||'غير محدد';(groups[p]=groups[p]||[]).push(e);});
  const ent=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  $('#projCards').innerHTML=ent.map(([p,arr])=>{
    const active=arr.filter(e=>e.employment_status==='active').length;
    const cars=arr.filter(e=>e.category==='car').length;
    const mc=arr.filter(e=>e.category==='motorcycle').length;
    const fin=arr.filter(e=>e.finance).length;
    const acc=arr.filter(e=>(e.notes||[]).some(n=>n.kind==='accident')).length;
    const net=arr.reduce((a,e)=>a+(e.finance?Number(e.finance.net)||0:0),0);
    return `<div class="pcard"><h3>📁 ${esc(p)}</h3><div class="pg">
      <div class="pi"><div class="v">${arr.length}</div><div class="k">الموظفون</div></div>
      <div class="pi"><div class="v">${active}</div><div class="k">على رأس العمل</div></div>
      <div class="pi"><div class="v">${cars}/${mc}</div><div class="k">سيارات / دراجات</div></div>
      <div class="pi"><div class="v">${fin}</div><div class="k">كرت مالي</div></div>
      <div class="pi"><div class="v">${acc}</div><div class="k">توالف وحوادث</div></div>
      <div class="pi"><div class="v">${fmt(net)}</div><div class="k">صافي الرواتب</div></div>
    </div></div>`;}).join('');
}

/* ---------- import / merge ---------- */
function pickImport(){closeMenus();$('#importFile').click();}
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  const ext=f.name.split('.').pop().toLowerCase();const rd=new FileReader();
  if(ext==='json'){rd.onload=()=>{try{mergeJSON(JSON.parse(rd.result));}catch(err){toast('تعذّر قراءة JSON');}};rd.readAsText(f);}
  else{rd.onload=()=>{try{mergeXLSX(rd.result);}catch(err){toast('تعذّر قراءة Excel');console.error(err);}};rd.readAsArrayBuffer(f);}
  e.target.value='';});
function indexByIqama(){const m={};state.employees.forEach((e,i)=>{if(e.iqama)m[e.iqama]=i;});return m;}
function mergeJSON(o){const arr=o.employees||o;if(!Array.isArray(arr)){toast('صيغة JSON غير متوقّعة');return;}
  const idx=indexByIqama();let added=0,upd=0;
  arr.forEach(r=>{const iq=String(r.iqama||'').replace(/\D/g,'');if(!iq)return;
    if(idx[iq]!=null){Object.assign(state.employees[idx[iq]],r);upd++;}else{state.employees.push(r);added++;}});
  recomputeStats();fillProjects();persist();renderAll();toast(`دمج JSON: ${added} جديد · ${upd} محدّث`);}
const NUM=v=>{if(v==null)return 0;const s=String(v).replace(/[, ]/g,'');const n=parseFloat(s);return isNaN(n)?0:n;};
function mergeXLSX(buf){
  const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});if(rows.length<2){toast('الملف فارغ');return;}
  const hdr=rows[0].map(h=>String(h).trim());
  const find=(...keys)=>{for(const k of keys){const i=hdr.findIndex(h=>h.includes(k));if(i>=0)return i;}return -1;};
  const ci={iqama:find('اقامة','إقامة','الاقامه','IQAMA','الاقامة'),name:find('الاسم','اسم','Name'),
    base:find('الراتب الاساسي','الراتب','SALARY'),days:find('ايام','الايام','دوام'),
    bonus:find('بونص','حافز','شريحه'),advance:find('السلف','سلف'),
    accident:find('الحوادث','التوالف','حوادث'),deduct:find('الخصميات','الخصومات','خصم'),
    net:find('صافي'),iban:find('الايبان','IBAN','الآيبان'),account:find('صاحب الحساب','الحساب','ACCOUNT')};
  if(ci.iqama<0){toast('لم يُعثر على عمود رقم الإقامة');return;}
  const idx=indexByIqama();let upd=0,added=0;
  for(let r=1;r<rows.length;r++){const row=rows[r];const iq=String(row[ci.iqama]||'').replace(/\D/g,'');if(iq.length<8)continue;
    const fin={base:NUM(row[ci.base]),days:String(row[ci.days]||''),bonus:NUM(row[ci.bonus]),
      advance:NUM(row[ci.advance]),accident:NUM(row[ci.accident]),deduction:NUM(row[ci.deduct]),
      net:NUM(row[ci.net]),iban:String(row[ci.iban]||''),account:String(row[ci.account]||''),
      name:String(row[ci.name]||''),source:'استيراد',advances:[]};
    if(idx[iq]!=null){const e=state.employees[idx[iq]];e.finance=Object.assign(e.finance||{},fin,{advances:(e.finance&&e.finance.advances)||[]});upd++;}
    else{state.employees.push({iqama:iq,name_ar:fin.name,name_en:'',mobile:'',email:'',iban:fin.iban,
      project:'',job_title:'',employment_status:'salary_only',status_label:'راتب فقط',category:'',
      license_type:'',license_number:iq,area:'',vehicles:[],finance:fin,notes:[],salary_only:true});added++;}
  }
  recomputeStats();fillProjects();persist();renderAll();toast(`دمج Excel: ${added} جديد · ${upd} كرت محدّث`);
}

/* ---------- export ---------- */
function download(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function exportJSON(){closeMenus();download('watheeq-data.json',JSON.stringify({employees:state.employees,generated:new Date().toISOString()},null,1),'application/json');toast('تم تصدير JSON');}
const COLS=[['name_ar','الاسم عربي'],['name_en','الاسم إنجليزي'],['iqama','رقم الإقامة'],['mobile','الجوال'],['email','الإيميل'],['iban','الآيبان'],['project','المشروع'],['status_label','الحالة'],['license_type','نوع الرخصة'],['license_number','رقم الرخصة'],['area','المدينة']];
function rowsForExport(){return state.employees.map(e=>{const o={};COLS.forEach(c=>o[c[1]]=e[c[0]]||'');
  const f=e.finance||{};o['الراتب الأساسي']=f.base||0;o['الحوافز']=f.bonus||0;o['السلف']=advTotal(f);o['التوالف']=f.accident||0;o['الخصميات']=f.deduction||0;o['صافي الراتب']=f.net||0;return o;});}
function exportCSV(){closeMenus();const rows=rowsForExport();const head=Object.keys(rows[0]);
  const esc=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='\ufeff'+head.map(esc).join(',')+'\n'+rows.map(r=>head.map(h=>esc(r[h])).join(',')).join('\n');
  download('watheeq-employees.csv',csv,'text/csv;charset=utf-8');toast('تم تصدير CSV');}
function exportXLSX(){closeMenus();const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rowsForExport()),'الموظفون');
  const byp={};state.employees.forEach(e=>{const p=e.project||'غير محدد';byp[p]=(byp[p]||0)+1;});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.entries(byp).map(([k,v])=>({'المشروع':k,'العدد':v}))),'حسب المشروع');
  const s=state.stats;XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([
    {'البند':'إجمالي الرواتب الأساسية','القيمة':s.sumBaseSalary},{'البند':'صافي الرواتب','القيمة':s.sumNet},
    {'البند':'السلف','القيمة':s.sumAdvance},{'البند':'التوالف والحوادث','القيمة':s.sumAccident},
    {'البند':'الخصميات','القيمة':s.sumDeduct},{'البند':'الحوافز','القيمة':s.sumBonus}]),'الملخص المالي');
  XLSX.writeFile(wb,'watheeq-export.xlsx');toast('تم تصدير Excel');}
function exportAdvances(){closeMenus();const wb=XLSX.utils.book_new();const all=[];
  state.employees.forEach(e=>{const f=e.finance;if(!f)return;
    if(f.advance)all.push({'الاسم':e.name_ar||e.name_en,'الإقامة':e.iqama,'المشروع':e.project,'المبلغ':f.advance,'النوع':'مستوردة','ملاحظة':'','التاريخ':''});
    (f.advances||[]).forEach(a=>all.push({'الاسم':e.name_ar||e.name_en,'الإقامة':e.iqama,'المشروع':e.project,'المبلغ':a.amount,'النوع':'يدوية','ملاحظة':a.note||'','التاريخ':a.date||''}));});
  if(!all.length){toast('لا توجد سلف');return;}
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(all),'كل السلف');
  const byp={};all.forEach(a=>byp[a.المشروع||'غير محدد']=(byp[a.المشروع||'غير محدد']||0)+a.المبلغ);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.entries(byp).map(([k,v])=>({'المشروع':k,'إجمالي السلف':v}))),'حسب المشروع');
  const bye={};all.forEach(a=>{const key=a.الإقامة;bye[key]=bye[key]||{'الاسم':a.الاسم,'الإقامة':key,'الإجمالي':0};bye[key].الإجمالي+=a.المبلغ;});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.values(bye)),'حسب الموظف');
  XLSX.writeFile(wb,'watheeq-advances.xlsx');toast('تم تصدير السلف');}

/* ---------- nav / menus / theme ---------- */
function go(v){state.view=v;document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('on'));$('#view-'+v).classList.add('on');
  if(v==='dash')renderDash();if(v==='emp')renderEmp();if(v==='proj')renderProj();}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.view));
function closeMenus(){$('#dataMenu').classList.remove('on');$('#themeMenu').classList.remove('on');}
$('#dataBtn').onclick=e=>{e.stopPropagation();$('#themeMenu').classList.remove('on');$('#dataMenu').classList.toggle('on');};
$('#themeBtn').onclick=e=>{e.stopPropagation();$('#dataMenu').classList.remove('on');$('#themeMenu').classList.toggle('on');};
document.addEventListener('click',closeMenus);
$('#dataMenu').onclick=e=>e.stopPropagation();$('#themeMenu').onclick=e=>e.stopPropagation();
const THEMES=[['petrol','#0f6e6e'],['sand','#a9763a'],['indigo','#3a4d9e'],['plum','#7a3563'],['slate','#2f4858']];
function renderThemes(){const cur=document.documentElement.getAttribute('data-theme');
  $('#themeSwatches').innerHTML=THEMES.map(([id,c])=>`<div class="swatch ${id===cur?'on':''}" style="background:${c}" onclick="setTheme('${id}')"><span style="background:${c}"></span></div>`).join('');}
function setTheme(id){document.documentElement.setAttribute('data-theme',id);try{localStorage.setItem('watheeq_theme',id);}catch(e){}renderThemes();}

/* ---------- boot ---------- */
function renderAll(){renderDash();renderEmp();renderProj();}
function boot(){
  const saved=loadLocal();
  state.employees=saved||DB.employees||[];
  try{const t=localStorage.getItem('watheeq_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  recomputeStats();fillProjects();bindControls();renderThemes();renderAll();
}
boot();
</script>

<script id="watheeq-extras-js">
/* ============================================================
   وثيق Watheeq — enhancements (design-preserving, non-destructive)
   1) Add / edit employee records (full profile per requirements)
   2) Professional financial card + multi-year history
   3) Richer vehicle log
   4) Expiry & missing-document alerts
   The embedded DB (employees data) line is never touched.
   ============================================================ */
(function(){
  function q(s){return document.querySelector(s);}
  function esc2(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  var FMT=(typeof fmt==='function')?fmt:function(n){return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2});};
  function daysBetween(a,b){var t1=Date.parse(a),t2=Date.parse(b);if(isNaN(t1)||isNaN(t2))return null;return Math.round((t2-t1)/86400000);}
  function daysUntil(d){if(!d)return null;var t=Date.parse(d);if(isNaN(t))return null;return Math.round((t-Date.now())/86400000);}
  function durLabel(v){var end=v.date_deliver|| (v.active?new Date().toISOString().slice(0,10):'');var n=daysBetween(v.date_receive,end);if(n==null)return '';return 'المدة: '+n+' يوم';}

  var STATUS_MAP={active:{label:'على رأس العمل',salary_only:false},stopped:{label:'متوقّف / مفوّض عليه',salary_only:false},salary_only:{label:'راتب فقط',salary_only:true}};

  /* ---------- finance periods model (multi-year, unlimited retention) ---------- */
  var ADVT=(typeof advTotal==='function')?advTotal:function(f){
    return (Number(f.advance)||0)+((f.advances||[]).reduce(function(s,a){return s+(Number(a.amount)||0);},0));};
  var IMPORT_PERIOD='2026-05';
  var _finEmp=null,_finYear='all',_finForm=false;
  var _vehEmp=null,_vehFilter='all';

  function pYear(p){var s=String(p.period||'');return /^\d{4}/.test(s)?s.slice(0,4):'—';}
  function pAdv(p){return p._imported?ADVT(p):(Number(p.advance)||0);}

  function finPeriods(e){
    var arr=[],seen={};
    if(e.finance){var imp=Object.assign({},e.finance);if(!imp.period)imp.period=IMPORT_PERIOD;imp._imported=true;arr.push(imp);seen[imp.period]=1;}
    (e.finance_periods||[]).forEach(function(p,i){
      var c=Object.assign({},p);c._manual=true;c._pi=i;
      if(seen[c.period])c._dup=true;
      arr.push(c);
    });
    arr.sort(function(a,b){return String(b.period||'').localeCompare(String(a.period||''));});
    return arr;
  }

  /* ---------- yearly aggregation ---------- */
  function yearSummary(periods){
    var y={};
    periods.forEach(function(p){
      var k=pYear(p);
      var o=y[k]||(y[k]={year:k,n:0,base:0,bonus:0,ded:0,acc:0,adv:0,net:0});
      o.n++;o.base+=Number(p.base)||0;o.bonus+=Number(p.bonus)||0;
      o.ded+=Number(p.deduction)||0;o.acc+=Number(p.accident)||0;
      o.adv+=pAdv(p);o.net+=Number(p.net)||0;
    });
    return Object.keys(y).sort().reverse().map(function(k){return y[k];});
  }

  function summaryTable(ys){
    if(!ys.length) return '';
    return '<div class="fin-sum"><table><thead><tr>'
      +'<th>السنة</th><th>الفترات</th><th>الأساسي</th><th>الحوافز</th><th>الخصميات</th><th>حوادث/توالف</th><th>السلف</th><th>صافي السنة</th><th>متوسط الشهر</th>'
      +'</tr></thead><tbody>'
      +ys.map(function(o){return '<tr><td class="y">'+esc2(o.year)+'</td><td>'+o.n+'</td><td>'+FMT(o.base)+'</td><td>'+FMT(o.bonus)+'</td>'
        +'<td>'+FMT(o.ded)+'</td><td>'+FMT(o.acc)+'</td><td>'+FMT(o.adv)+'</td>'
        +'<td class="n">'+FMT(o.net)+'</td><td>'+FMT(o.n?o.net/o.n:0)+'</td></tr>';}).join('')
      +'</tbody></table></div>';
  }

  /* ---------- net-salary sparkline (last 12 periods, oldest → newest) ---------- */
  function sparkline(periods){
    var pts=periods.slice(0,12).reverse();
    if(pts.length<2) return '';
    var max=Math.max.apply(null,pts.map(function(p){return Number(p.net)||0;}))||1;
    var W=100/pts.length;
    var bars=pts.map(function(p,i){
      var h=Math.max(4,((Number(p.net)||0)/max)*46);
      return '<g><rect x="'+(i*W+W*0.16).toFixed(2)+'" y="'+(52-h).toFixed(2)+'" width="'+(W*0.68).toFixed(2)+'" height="'+h.toFixed(2)+'" rx="1.2" fill="var(--brand)" opacity="'+(p._imported?1:.55)+'"><title>'+esc2(p.period)+' — '+FMT(p.net)+'</title></rect>'
        +'<text x="'+(i*W+W/2).toFixed(2)+'" y="59" font-size="3.1" text-anchor="middle" fill="var(--muted)">'+esc2(String(p.period||'').slice(2))+'</text></g>';
    }).join('');
    return '<div class="fin-spark"><div class="t">📈 تطوّر صافي الراتب (آخر '+pts.length+' فترة) — الأعلى: '+FMT(max)+' ريال</div>'
      +'<svg viewBox="0 0 100 62" style="width:100%;height:92px">'+bars+'</svg></div>';
  }

  /* ---------- one period card ---------- */
  function cell(k,v,cls){return '<div class="fin-cell"><div class="k">'+k+'</div><div class="v'+(cls?' '+cls:'')+'">'+v+'</div></div>';}

  function periodCard(e,idx,p){
    var adv=pAdv(p);
    var cells=cell('أيام الدوام',esc2(p.days||'—'))
      +cell('الراتب الأساسي',FMT(p.base))
      +cell('الحوافز',FMT(p.bonus),(Number(p.bonus)>0?'plus':''))
      +cell('الخصميات',FMT(p.deduction),(Number(p.deduction)?'minus':''))
      +cell('حوادث / توالف',FMT(p.accident),(Number(p.accident)?'minus':''))
      +cell('إجمالي السلف',FMT(adv),(adv?'minus':''));
    var bank='<div class="fin-bank"><span>الحساب: <b>'+esc2(p.account||'—')+'</b></span>'
      +'<span>الآيبان: <b>'+esc2(p.iban||'—')+'</b></span>'
      +'<span>المصدر: <b>'+esc2(p.source||(p._manual?'إدخال يدوي':'—'))+'</b></span></div>';
    var advBlock='';
    if(p._imported){
      var advList=(p.advances||[]).map(function(a,ai){return '<div class="adv-item"><span>'+FMT(a.amount)+' ريال</span>'
        +'<span style="color:var(--muted)">'+esc2(a.note||'')+(a.date?' · '+esc2(a.date):'')+'</span>'
        +'<button class="del" onclick="delAdvance('+idx+','+ai+')">✕</button></div>';}).join('');
      advBlock='<div class="fin-adv"><div class="t">💸 السلف اليدوية</div>'
        +(advList||'<p style="color:var(--muted);font-size:12.5px">لا توجد سلف يدوية مضافة.</p>')
        +'<div class="adv-add"><input type="number" id="advAmt" placeholder="المبلغ"><input id="advNote" placeholder="ملاحظة (اختياري)">'
        +'<button class="btn sm" onclick="addAdvance('+idx+')">+ إضافة سلفة</button></div></div>';
    }
    var head='<div class="fin-p-h"><span class="per">📅 '+esc2(p.period||'—')+'</span>'
      +(p._imported?'<span class="chip ok">مستورد</span>':'<span class="chip sand">أرشيف / يدوي</span>')
      +(p._dup?'<span class="chip warn">مكرر</span>':'')
      +'<span class="net">'+FMT(p.net)+' ريال</span>'
      +(p._manual?'<button class="del" title="حذف الفترة" onclick="delFinancePeriod('+idx+','+p._pi+')">✕</button>':'')
      +'</div>';
    return '<div class="fin-p">'+head+'<div class="fin-cells">'+cells+'</div>'+bank+advBlock+'</div>';
  }

  /* ---------- finance pane ---------- */
  function financePane(e,idx){
    if(_finEmp!==idx){_finEmp=idx;_finYear='all';_finForm=false;}
    var all=finPeriods(e);
    if(!all.length){
      return '<p style="color:var(--muted);margin-bottom:14px">لا يوجد كرت مالي لهذا الموظف بعد.</p>'+addForm(idx,true);
    }
    var ys=yearSummary(all);
    var years=ys.map(function(o){return o.year;});
    var L=all[0];
    var gTot=ys.reduce(function(s,o){return s+o.net;},0);
    var hero='<div class="fin-hero"><div><div class="fin-hero-l">صافي آخر راتب</div>'
      +'<div class="fin-hero-v">'+FMT(L.net)+' ريال</div>'
      +'<div class="fin-hero-sub">'+esc2(L.period||'')+(L.source?(' · '+esc2(L.source)):'')+'</div></div>'
      +'<div class="fin-hero-grid">'
      +'<div class="fin-hero-kpi"><b>'+all.length+'</b><span>فترة</span></div>'
      +'<div class="fin-hero-kpi"><b>'+years.length+'</b><span>سنة</span></div>'
      +'<div class="fin-hero-kpi"><b>'+FMT(L.base)+'</b><span>الأساسي</span></div>'
      +'<div class="fin-hero-kpi"><b>'+FMT(gTot)+'</b><span>إجمالي المصروف</span></div>'
      +'</div></div>';

    var bar='<div class="fin-bar">'
      +'<button class="fin-yb'+(_finYear==='all'?' on':'')+'" onclick="finSetYear(\'all\')">كل السنوات</button>'
      +years.map(function(y){return '<button class="fin-yb'+(_finYear===y?' on':'')+'" onclick="finSetYear(\''+y+'\')">'+esc2(y)+'</button>';}).join('')
      +'<span class="sp"></span>'
      +'<button class="btn sm ghost" onclick="exportFinanceHistory('+idx+')">⬇ تصدير السجل</button>'
      +(e.finance?'<button class="btn sm ghost" onclick="addFinancePeriodFromImport('+idx+')">📥 أرشفة الكرت الحالي</button>':'')
      +'<button class="btn sm" onclick="addFinancePeriodForm('+idx+')">➕ إضافة فترة</button>'
      +'</div>'
      +'<div class="fin-note">🗄 السجل المالي محفوظ بلا حدّ زمني (يدعم أكثر من ٥ سنوات) — الفترات مرتّبة من الأحدث للأقدم.'
      +(years.length?' المدى: '+esc2(years[years.length-1])+' → '+esc2(years[0]):'')+'</div>';

    var shown=all.filter(function(p){return _finYear==='all'||pYear(p)===_finYear;});
    var body='',curY='';
    shown.forEach(function(p){
      var y=pYear(p);
      if(y!==curY){curY=y;body+='<div class="fin-yhead">📆 سنة '+esc2(y)+'</div>';}
      body+=periodCard(e,idx,p);
    });
    if(!shown.length) body='<p style="color:var(--muted)">لا توجد فترات في هذه السنة.</p>';

    return hero+bar+summaryTable(_finYear==='all'?ys:ys.filter(function(o){return o.year===_finYear;}))
      +sparkline(all)+body+addForm(idx,false);
  }

  function fld(id,label,type,val){return '<div class="wf-field"><label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc2(val)+'"></div>';}

  function addForm(idx,forceOpen){
    var open=forceOpen||_finForm;
    return '<div class="fin-add" id="finAddBox" style="'+(open?'':'display:none')+'">'
      +'<div class="fin-add-t">➕ إضافة فترة راتب (لبناء تاريخ متعدد السنوات)</div>'
      +'<div class="wf-grid">'
      +fld('fp-period','الفترة (شهر/سنة)','month','')
      +fld('fp-base','الراتب الأساسي','number','')
      +fld('fp-days','أيام الدوام','text','')
      +fld('fp-bonus','الحوافز','number','')
      +fld('fp-advance','السلف','number','')
      +fld('fp-accident','التوالف والحوادث','number','')
      +fld('fp-deduction','الخصميات','number','')
      +fld('fp-net','صافي الراتب','number','')
      +fld('fp-iban','الآيبان','text','')
      +fld('fp-account','اسم صاحب الحساب','text','')
      +'</div><div style="margin-top:10px"><button class="btn sm" onclick="addFinancePeriod('+idx+')">حفظ الفترة</button></div></div>';
  }

  window.finSetYear=function(y){_finYear=y;reopenModal('fin');};
  window.addFinancePeriodForm=function(){
    _finForm=!_finForm;
    var b=q('#finAddBox'); if(b){b.style.display=_finForm?'':'none'; if(_finForm)b.scrollIntoView({block:'nearest',behavior:'smooth'});}
  };
  window.addFinancePeriodFromImport=function(idx){
    var e=state.employees[idx]; if(!e||!e.finance){toast('لا يوجد كرت مستورد');return;}
    var per=e.finance.period||IMPORT_PERIOD;
    e.finance_periods=e.finance_periods||[];
    if(e.finance_periods.some(function(p){return p.period===per;})){toast('الفترة '+per+' موجودة في السجل مسبقاً');return;}
    var c=Object.assign({},e.finance);
    delete c.advances;
    c.period=per; c.advance=ADVT(e.finance); c.source=(e.finance.source||'مستورد')+' (مؤرشف)';
    e.finance_periods.push(c);
    persist(); reopenModal('fin'); toast('تمت أرشفة الفترة '+per+' في السجل المالي');
  };
  window.exportFinanceHistory=function(idx){
    var e=state.employees[idx]; if(!e)return;
    var ps=finPeriods(e);
    if(!ps.length){toast('لا يوجد سجل مالي للتصدير');return;}
    var head=['الفترة','النوع','أيام الدوام','الأساسي','الحوافز','الخصميات','حوادث/توالف','السلف','الصافي','الحساب','الآيبان','المصدر'];
    var rows=ps.map(function(p){return [p.period||'',p._imported?'مستورد':'أرشيف',p.days||'',p.base||0,p.bonus||0,p.deduction||0,p.accident||0,pAdv(p),p.net||0,p.account||'',p.iban||'',p.source||''];});
    var csv=[head].concat(rows).map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
    var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='السجل_المالي_'+(e.name_ar||e.iqama||'موظف')+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast('تم تصدير السجل المالي ('+ps.length+' فترة)');
  };

  /* ---------- richer vehicle log ---------- */
  function vehMonths(v){
    var end=v.date_deliver||(v.active?new Date().toISOString().slice(0,10):'');
    var n=daysBetween(v.date_receive,end);
    if(n==null) return null;
    return n;
  }
  function vehNotes(e,v){
    return (e.notes||[]).filter(function(n){return n.plate&&v.plate&&String(n.plate)===String(v.plate);});
  }
  function prepVehicles(e){
    var list=(e.vehicles||[]).map(function(v,i){return Object.assign({},v,{_i:i});});
    /* chronological pass → gap before each vehicle */
    var chrono=list.slice().sort(function(a,b){return String(a.date_receive||'').localeCompare(String(b.date_receive||''));});
    chrono.forEach(function(v,i){
      if(i>0){var g=daysBetween(chrono[i-1].date_deliver,v.date_receive); if(g!=null&&g>1)v._gap=g;}
    });
    /* display order: active first, then newest receive date */
    list.sort(function(a,b){
      if(!!a.active!==!!b.active) return a.active?-1:1;
      return String(b.date_receive||'').localeCompare(String(a.date_receive||''));
    });
    return list;
  }

  function vehicleTimeline(e,idx){
    if(_vehEmp!==idx){_vehEmp=idx;_vehFilter='all';}
    var list=prepVehicles(e);
    if(!list.length) return '<p style="color:var(--muted)">لا توجد مركبات مسجّلة (سجل راتب فقط).</p>';

    var act=list.filter(function(v){return v.active;}).length;
    var days=list.reduce(function(s,v){var d=vehMonths(v);return s+(d||0);},0);
    var offices={},projects={},plates={};
    list.forEach(function(v){if(v.rental_office)offices[v.rental_office]=1;if(v.project)projects[v.project]=1;if(v.plate)plates[v.plate]=1;});
    var accCount=(e.notes||[]).filter(function(n){return n.kind==='accident'||/حادث|توالف/.test(String(n.text||''));}).length;

    var sum='<div class="veh-sum">'
      +'<div><b>'+list.length+'</b><span>سجل تفويض</span></div>'
      +'<div><b>'+Object.keys(plates).length+'</b><span>لوحة مختلفة</span></div>'
      +'<div><b>'+act+'</b><span>نشطة الآن</span></div>'
      +'<div><b>'+(list.length-act)+'</b><span>منتهية</span></div>'
      +'<div><b>'+days+'</b><span>يوم تشغيل</span></div>'
      +'<div><b>'+Object.keys(offices).length+'</b><span>مكتب تأجير</span></div>'
      +'<div><b>'+Object.keys(projects).length+'</b><span>مشروع</span></div>'
      +'<div><b>'+accCount+'</b><span>حوادث/توالف</span></div>'
      +'</div>';

    var bar='<div class="veh-bar">'
      +['all','active','past'].map(function(k){
        var lbl=k==='all'?('الكل ('+list.length+')'):(k==='active'?('النشطة ('+act+')'):('المنتهية ('+(list.length-act)+')'));
        return '<button class="veh-fb'+(_vehFilter===k?' on':'')+'" onclick="vehSetFilter(\''+k+'\')">'+lbl+'</button>';
      }).join('')+'</div>';

    var shown=list.filter(function(v){return _vehFilter==='all'||(_vehFilter==='active'?v.active:!v.active);});
    if(!shown.length) return sum+bar+'<p style="color:var(--muted)">لا توجد مركبات بهذا التصنيف.</p>';

    var nodes=shown.map(function(v,i){
      var d=vehMonths(v);
      var dur=(d==null)?'—':(d+' يوم'+(d>=30?' (~'+Math.round(d/30)+' شهر)':''));
      var vn=vehNotes(e,v);
      var notes=vn.length?('<div class="vnotes">'+vn.map(function(n){
        var acc=n.kind==='accident'||/حادث|توالف/.test(String(n.text||''));
        return '<div'+(acc?' class="acc"':'')+'>'+(acc?'⚠️ ':'📝 ')+esc2(n.text)+'</div>';}).join('')+'</div>'):'';
      var extra=v.notes&&!vn.some(function(n){return n.text===v.notes;})?('<div class="vnotes">📝 '+esc2(v.notes)+'</div>'):'';
      return '<div class="node '+(v.active?'active':'')+'">'
        +'<div class="vc"><div class="hd">🚗 '+esc2(v.plate||'—')
        +' <span style="font-weight:400;color:var(--muted)">'+esc2(v.vehicle_type||'')+'</span> '
        +(v.active?'<span class="chip ok">نشطة / تفويض ساري</span>':'<span class="chip line">منتهية</span>')
        +(v.project?'<span class="chip sand">'+esc2(v.project)+'</span>':'')
        +'<span class="seq" style="margin-inline-start:auto">#'+(i+1)+'</span></div>'
        +'<div class="vgrid">'
        +'<div class="c"><div class="k">تاريخ الاستلام</div><div class="v">'+esc2(v.date_receive||'—')+'</div></div>'
        +'<div class="c"><div class="k">تاريخ التسليم</div><div class="v">'+(v.active?'مستمرة حتى الآن':esc2(v.date_deliver||'—'))+'</div></div>'
        +'<div class="c"><div class="k">مدة التفويض</div><div class="v">'+dur+'</div></div>'
        +'<div class="c"><div class="k">نوع المركبة</div><div class="v">'+esc2(v.vehicle_type||'—')+'</div></div>'
        +'<div class="c"><div class="k">الفئة</div><div class="v">'+(v.sheet==='MOTORCYCLE'?'دراجة':'سيارة')+'</div></div>'
        +'<div class="c"><div class="k">الوقود</div><div class="v">'+esc2(v.fuel||'—')+'</div></div>'
        +'<div class="c"><div class="k">مكتب التأجير</div><div class="v">'+esc2(v.rental_office||'—')+'</div></div>'
        +'<div class="c"><div class="k">المنطقة</div><div class="v">'+esc2(v.area||'—')+'</div></div>'
        +'<div class="c"><div class="k">فرع الاستلام</div><div class="v">'+esc2(v.branch_receive||'—')+'</div></div>'
        +'<div class="c"><div class="k">فرع التسليم</div><div class="v">'+esc2(v.branch_deliver||'—')+'</div></div>'
        +'<div class="c"><div class="k">حالة السجل</div><div class="v">'+esc2(v.status||'—')+'</div></div>'
        +'<div class="c"><div class="k">سبب الإنهاء</div><div class="v">'+esc2(v.reason||'—')+'</div></div>'
        +'</div>'
        +(v._gap?'<div style="margin-top:9px"><span class="chip warn">⏳ فجوة قبل الاستلام: '+v._gap+' يوم بدون مركبة</span></div>':'')
        +notes+extra
        +'</div></div>';
    }).join('');

    return sum+bar+'<div class="tl">'+nodes+'</div>';
  }
  window.vehSetFilter=function(k){_vehFilter=k;reopenModal('veh');};

  /* ---------- overview alerts ---------- */
  function overviewAlerts(e){
    var out='';
    var di=daysUntil(e.iqama_expiry);
    if(di!==null&&di<=60) out+='<div class="emp-alert '+(di<0?'bad':'warn')+'">'+(di<0?('🔴 الإقامة منتهية منذ '+Math.abs(di)+' يوم'):('⚠️ الإقامة تنتهي خلال '+di+' يوم'))+'</div>';
    var dl=daysUntil(e.license_expiry);
    if(dl!==null&&dl<=60) out+='<div class="emp-alert '+(dl<0?'bad':'warn')+'">'+(dl<0?('🔴 رخصة القيادة منتهية منذ '+Math.abs(dl)+' يوم'):('⚠️ رخصة القيادة تنتهي خلال '+dl+' يوم'))+'</div>';
    var miss=[];
    if(!e.has_iqama_doc) miss.push('الإقامة/الهوية');
    if(e.category!=='salary_only'&&!e.has_license_doc&&e.category) miss.push('الرخصة');
    if(!e.has_contract) miss.push('العقد');

<!-- =========================================================
     💾 الحفظ المحلي على الجهاز — بديل كامل لمزامنة Google Drive
     أُزيلت مزامنة Drive نهائياً. أي طلب سحابي يُخدَّم من تخزين
     هذا الجهاز فقط (بلا أي اتصال بالشبكة).
     ========================================================= -->
<script id="wf-localstore">
(function(){
  var PREFIX   = 'wfl_';
  var CLOUDISH = /script\.google\.com|googleusercontent\.com|drive\.google\.com|googleapis\.com/i;

  function getRec(k){ try{ var r=localStorage.getItem(PREFIX+k); return r?JSON.parse(r):null; }catch(e){ return null; } }
  function setRec(k,rec){ try{ localStorage.setItem(PREFIX+k, JSON.stringify(rec)); return true; }catch(e){ return false; } }

  window.wfLocalStore = {
    prefix : PREFIX,
    getRec : getRec,
    setRec : setRec,
    getData: function(k){ var r=getRec(k); return r?r.data:null; },
    setData: function(k,d){ return setRec(k,{data:d, savedAt:new Date().toISOString()}); },
    remove : function(k){ try{ localStorage.removeItem(PREFIX+k); }catch(e){} },
    keys   : function(){ var out=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf(PREFIX)===0) out.push(k.slice(PREFIX.length)); } }catch(e){} return out; }
  };

  function reply(o){
    try{
      return Promise.resolve(new Response(JSON.stringify(o), {status:200, headers:{'Content-Type':'application/json'}}));
    }catch(e){
      return Promise.resolve({ ok:true, status:200,
        json:function(){ return Promise.resolve(o); },
        text:function(){ return Promise.resolve(JSON.stringify(o)); } });
    }
  }
  function liveEmployees(){
    try{ if(typeof state!=='undefined' && state && Array.isArray(state.employees)) return {employees: state.employees}; }catch(e){}
    return null;
  }

  var _fetch = (typeof window.fetch === 'function') ? window.fetch.bind(window) : null;

  window.fetch = function(input, init){
    var url = '';
    try{ url = (typeof input === 'string') ? input : ((input && input.url) || ''); }catch(e){}
    if(!CLOUDISH.test(url)){
      if(_fetch) return _fetch(input, init);
      return Promise.reject(new Error('fetch unavailable'));
    }
    /* ===== كل ما كان يذهب إلى Drive يُخدَّم الآن من هذا الجهاز ===== */
    var now = new Date().toISOString();
    try{
      var method = String((init && init.method) || 'GET').toUpperCase();
      if(method === 'POST'){
        var o = {};
        try{ o = JSON.parse((init && init.body) || '{}'); }catch(e){}
        var pk = o.key;
        if(!pk) return reply({ok:false});
        /* مفتاح «وثيق» مرآة لقاعدة البيانات الحيّة — لا داعي لتخزينه مرتين */
        if(pk === 'watheeq') return reply({ok:true, savedAt:now});
        var ok = setRec(pk, {data:o.data, savedAt:now});
        if(!ok){ try{ toast('⚠️ مساحة التخزين ممتلئة — صدّر نسخة احتياطية على الجهاز'); }catch(e){} }
        return reply({ok:ok, savedAt:now});
      }
      var m   = /[?&]key=([^&]+)/.exec(url);
      var key = m ? decodeURIComponent(m[1]) : '';
      if(key === 'watheeq'){
        var le = liveEmployees();
        return reply(le ? {ok:true, data:le, savedAt:now} : {ok:true});
      }
      var rec = getRec(key);
      return reply(rec ? {ok:true, data:rec.data, savedAt:rec.savedAt} : {ok:true});
    }catch(e){ return reply({ok:false}); }
  };
  window.fetch.__wfLocalOnly = true;

  /* لا إرسال شبكي عند إغلاق الصفحة */
  try{
    var _bc = navigator.sendBeacon ? navigator.sendBeacon.bind(navigator) : null;
    if(_bc) navigator.sendBeacon = function(u, d){ if(CLOUDISH.test(String(u))) return true; return _bc(u, d); };
  }catch(e){}

  /* تنظيف أي آثار للمزامنة السحابية القديمة */
  try{ localStorage.removeItem('watheeq_cloud_lastsaved'); }catch(e){}
})();
</script>
<script id="wf-integration">
/* ============================================================
   وحدة التكامل بين «وثيق» و«Fleet OS»  (غير مدمّرة)
   - قائمة مشاريع مشتركة + قوائم منسدلة
   - صلاحيات لكل مشرف بكلمة سر في صفحة منفصلة
   - تبويب «المناديب من وثيق» (إيدل) في الأسطول
   - تنبيهات «تفويض ملغى» في وثيق + إيقاف بنقرة
   - مزامنة مستمرة عبر مفتاح سحابي اسمه acl
   ============================================================ */
(function(){
  "use strict";
  var CLOUD_URL = "";  /* AFMC Cloud: القاعدة الموحّدة بديلاً عن Apps Script */

  /* ---- اكتشاف التطبيق الحالي ---- */
  var APP = (typeof state!=='undefined' && state && Object.prototype.hasOwnProperty.call(state,'employees')) ? 'watheeq'
          : (typeof vehicles!=='undefined' && typeof VKEY!=='undefined') ? 'fleetos'
          : null;
  if(!APP) return; // بيئة غير معروفة — لا تفعل شيئاً

  var hasCloud = !!(CLOUD_URL && CLOUD_URL.indexOf('http')===0);

  /* ===================== أدوات سحابية ===================== */
  function cloudGet(key){
    return new Promise(function(res){
      if(!hasCloud) return res(null);
      var sep = CLOUD_URL.indexOf('?')>=0?'&':'?';
      fetch(CLOUD_URL+sep+'key='+encodeURIComponent(key))
        .then(function(r){return r.json();})
        .then(function(j){ res(j&&j.data?{data:j.data,savedAt:j.savedAt}:null); })
        .catch(function(){ res(null); });
    });
  }
  var _postQ={};
  function cloudPost(key,data){
    if(!hasCloud) return;
    clearTimeout(_postQ[key]);
    _postQ[key]=setTimeout(function(){
      try{
        fetch(CLOUD_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({key:key,data:data})}).catch(function(){});
      }catch(e){}
    },800);
  }

  /* ===================== حالة ACL ===================== */
  var ACL_KEY='acl3', ACL_CACHE='wf_acl_cache_v3', SESS='wf_session_v3';
  /* إعادة تعيين: حذف كل بيانات الدخول/الصلاحيات السابقة من هذا المتصفح */
  try{ ['wf_acl_cache_v1','wf_acl_cache_v2'].forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
  try{ ['wf_session_v1','wf_session_v2'].forEach(function(k){ sessionStorage.removeItem(k); }); }catch(e){}
  var DEFAULT_PROJECTS=['KEETA','KEEMART','SHIPMENT','NINJA','NOON','ARAMEX','STARLINKS','NINJA-DIEANA','المشرفين والصيانة'];
  var acl = loadAclCache();

  function loadAclCache(){
    try{ var r=localStorage.getItem(ACL_CACHE); if(r){var o=JSON.parse(r); return normalizeAcl(o);} }catch(e){}
    return normalizeAcl(null);
  }
  function normalizeAcl(o){
    o=o||{};
    return {
      requireLogin: (o.requireLogin===false? false : true),
      projects: Array.isArray(o.projects)&&o.projects.length? o.projects.slice() : DEFAULT_PROJECTS.slice(),
      users: Array.isArray(o.users)? o.users : [],
      ackFleet: Array.isArray(o.ackFleet)? o.ackFleet : [],   // مناديب تم استلامهم في الأسطول
      updatedAt: o.updatedAt||0
    };
  }
  function persistAclLocal(){ try{ localStorage.setItem(ACL_CACHE, JSON.stringify(acl)); }catch(e){} }
  function saveAcl(push){
    acl.updatedAt=Date.now();
    persistAclLocal();
    if(push!==false) cloudPost(ACL_KEY, acl);
    try{ refreshProjectDropdowns(); }catch(e){}
  }
  function pullAcl(){
    return cloudGet(ACL_KEY).then(function(r){
      if(r&&r.data){
        var incoming=normalizeAcl(r.data);
        var cloudAt=r.savedAt?Date.parse(r.savedAt):(incoming.updatedAt||0);
        if(cloudAt>=(acl.updatedAt||0) || !acl.users.length){
          acl=incoming; persistAclLocal();
        }
      } else if(hasCloud){
        // السحابة فارغة — ارفع الافتراضي مرة واحدة
        saveAcl(true);
      }
      try{ refreshProjectDropdowns(); }catch(e){}
      try{ enforcePerms(); }catch(e){}
      return acl;
    });
  }

  /* ===================== الجلسة/الصلاحيات ===================== */
  function currentUser(){
    try{ var r=sessionStorage.getItem(SESS); if(r) return JSON.parse(r); }catch(e){}
    return null;
  }
  function setUser(u){ try{ if(u) sessionStorage.setItem(SESS,JSON.stringify(u)); else sessionStorage.removeItem(SESS); }catch(e){} }
  function can(perm){
    var u=currentUser();
    if(!u) return false;                       // لا جلسة → لا صلاحية (البوّابة تتكفّل بالشاشة)
    if(u.role==='admin') return true;          // الموظف الإداري: كل الصلاحيات
    return !!(u.perms && u.perms[perm]);
  }

   +'.wfi-badge{display:inline-block;background:#e2e8f0;color:#0f172a;border-radius:6px;padding:2px 8px;font-size:12px;margin:1px}'
   +'.wfi-badge.admin{background:#0f766e;color:#fff}.wfi-badge.sup{background:#bae6fd;color:#075985}.wfi-badge.pend{background:#fde047;color:#854d0e}'
   +'.wfi-form{width:100%;border-collapse:collapse;margin:8px 0}'
