<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صوت — كل الشكاوى</title>
<style>
:root{
  --afmco:#0b7a4b;--afmco-d:#064e30;--afmco-l:#0f9e62;--gold:#c99a2e;--gold-l:#e6b84a;
  --ink:#12251c;--muted:#6b7f74;--line:#e4ece8;--bg:#f4f8f6;--card:#fff;--soft:#f4f8f6;
  --red:#d84646;--amber:#d9961f;--blue:#2d72c6;--violet:#7a4fc0;--gray:#8a9a92;
  --sh:0 1px 3px rgba(6,50,34,.05),0 8px 24px rgba(6,50,34,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,"Segoe UI",system-ui,"Noto Kufi Arabic","Tajawal",Arial,sans-serif;
  color:var(--ink);background:var(--bg);padding:18px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.chead .lead h1{margin:0;font-size:19px;display:flex;align-items:center;gap:9px}
.chead .lead .exb{font-size:10.5px;background:var(--afmco);color:#fff;font-weight:900;padding:2px 9px;border-radius:999px}
.chead .lead p{margin:4px 0 0;font-size:12.5px;color:var(--muted);max-width:620px;line-height:1.6}
.chead .acts{display:flex;gap:9px;align-items:center}
.who{font-size:12px;color:var(--muted);font-weight:700}
.btn{border:none;border-radius:11px;padding:10px 15px;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn.pri{background:linear-gradient(135deg,var(--afmco),var(--afmco-d));color:#fff;box-shadow:0 6px 16px rgba(11,122,75,.25)}
.btn.gold{background:linear-gradient(135deg,var(--gold-l),var(--gold));color:#fff}
.btn.ghost{background:#fff;color:var(--afmco);border:1.5px solid var(--afmco)}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--sh);position:relative;overflow:hidden;cursor:pointer;transition:.12s}
.kpi:hover{transform:translateY(-1px)}
.kpi.on{box-shadow:0 0 0 2px var(--afmco),var(--sh)}
.kpi .n{font-size:25px;font-weight:900;line-height:1}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:6px}
.kpi .t{position:absolute;top:13px;left:13px;font-size:18px;opacity:.5}
.kpi.red .n{color:var(--red)}.kpi.amber .n{color:var(--amber)}.kpi.green .n{color:var(--afmco)}.kpi.violet .n{color:var(--violet)}.kpi.gold .n{color:var(--gold)}
@media(max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--sh)}
.search{position:relative;flex:1;min-width:220px}
.search input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 38px 10px 12px;font-size:13px;font-family:inherit;background:var(--soft)}
.search input:focus{outline:none;border-color:var(--afmco);background:#fff}
.search .ic{position:absolute;top:50%;right:12px;transform:translateY(-50%);opacity:.5}
.fsel{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12.5px;font-family:inherit;font-weight:700;background:var(--soft);color:var(--ink);cursor:pointer}
.fsel:focus{outline:none;border-color:var(--afmco)}

.cols{display:grid;grid-template-columns:1fr 390px;gap:16px;align-items:start}
@media(max-width:980px){.cols{grid-template-columns:1fr}}

.clist{display:flex;flex-direction:column;gap:10px}
.crow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh);cursor:pointer;display:flex;gap:13px;align-items:flex-start;position:relative;overflow:hidden;transition:.12s}
.crow:hover{border-color:var(--afmco-l);transform:translateY(-1px)}
.crow.sel{border-color:var(--afmco);box-shadow:0 0 0 2px rgba(11,122,75,.15),var(--sh)}
.crow .pbar{position:absolute;top:0;right:0;width:4px;height:100%}
.crow.p-urgent .pbar{background:var(--red)}.crow.p-high .pbar{background:var(--amber)}
.crow.p-med .pbar{background:var(--blue)}.crow.p-low .pbar{background:var(--gray)}
.crow .ava{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.crow .mid{flex:1;min-width:0}
.crow .tt{font-size:14px;font-weight:800}
.crow .mt{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.chip.proj{background:#edf7f1;color:var(--afmco);border-color:#d8ecdf}
.chip.dept{background:#eaf2fb;color:var(--blue);border-color:#d4e6fb}
.chip.amt{background:#fdf4e3;color:var(--gold);border-color:#f0e0c0}
.st{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px}
.st.open{background:#fde8e8;color:var(--red)}.st.prog{background:#fff2d9;color:var(--amber)}
.st.esc{background:#ede2fb;color:var(--violet)}.st.done{background:#e3f4ea;color:var(--afmco)}
.st.pend{background:#fdf4e3;color:var(--gold)}
.ov{color:var(--red);font-weight:800}
.noRes{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--muted);font-size:13px}

.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);position:sticky;top:12px;overflow:hidden}
.panel .ph{background:linear-gradient(135deg,var(--afmco),var(--afmco-d));color:#fff;padding:16px}
.panel .ph .t{font-size:15px;font-weight:900}
.panel .ph .s{font-size:11.5px;opacity:.85;margin-top:3px}
.panel .pb{padding:15px;max-height:66vh;overflow-y:auto}
.sect{margin-bottom:16px}
.sect h4{margin:0 0 9px;font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.ph-row{display:flex;gap:8px;flex-wrap:wrap}
.ph-row img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.route{display:flex;flex-direction:column}
.rnode{display:flex;gap:10px;position:relative;padding-bottom:14px}
.rnode:last-child{padding-bottom:0}
.rnode .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;color:#fff;flex:none;z-index:2;background:var(--afmco)}
.rnode::before{content:"";position:absolute;top:34px;right:16px;width:2px;bottom:-2px;background:var(--line)}
.rnode:last-child::before{display:none}
.rnode .tx .t{font-size:12.5px;font-weight:800}
.rnode .tx .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.rnode .tx .tm{font-size:10px;color:var(--muted);margin-top:3px}
.msg{display:flex;gap:8px;margin-bottom:11px}
.msg.me{flex-direction:row-reverse}
.msg .a{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:900;background:var(--afmco)}
.msg.emp .a{background:var(--blue)}
.msg .bu{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px;max-width:80%}
.msg.me .bu{background:#e9f5ee;border-color:#d8ecdf}
.msg .wn{font-size:10.5px;font-weight:800;margin-bottom:3px;display:flex;gap:8px;justify-content:space-between}
.msg .wn span{color:var(--muted);font-weight:600;font-size:9.5px}
.msg .tx{font-size:12px;line-height:1.55}
.reply{display:flex;gap:8px;padding:12px 15px;border-top:1px solid var(--line)}
.reply input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:9px 13px;font-size:12.5px;font-family:inherit}
.reply input:focus{outline:none;border-color:var(--afmco)}
.reply .s{width:40px;height:40px;border-radius:50%;background:var(--afmco);color:#fff;border:none;cursor:pointer;font-size:16px;flex:none}
.pacts{display:flex;gap:8px;padding:0 15px 15px}
.pacts .btn{flex:1;justify-content:center}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:13px}
.empty .big{font-size:40px;margin-bottom:10px}
.foot{margin-top:18px;text-align:center;color:var(--muted);font-size:11px}

/* شاشة الدخول */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.login .box{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:28px;width:100%;max-width:360px;text-align:center}
.login .logo{display:inline-block;background:linear-gradient(135deg,var(--afmco),var(--afmco-d));color:#fff;font-weight:900;font-size:26px;padding:10px 22px;border-radius:16px}
.login h2{font-size:16px;margin:14px 0 2px}
.login p{font-size:12px;color:var(--muted);margin:0 0 18px}
.login input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:13px;font-family:inherit;margin-bottom:10px}
.login input:focus{outline:none;border-color:var(--afmco)}
.login .err{color:var(--red);font-size:12px;margin-bottom:10px;min-height:16px}
.login .btn{width:100%;justify-content:center;padding:12px}
.loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:40;color:var(--muted);font-size:13px}
/* عارض الصورة */
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:92vh;border-radius:12px}
</style>
</head>
<body>
  <div class="loader" id="loader">جارٍ التحميل…</div>

  <div class="login" id="login" style="display:none">
    <div class="box">
      <span class="logo">صوت</span>
      <h2>كل الشكاوى</h2>
      <p>ادخل بحسابك في المنصة</p>
      <input id="lEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
      <input id="lPass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
      <div class="err" id="lErr"></div>
      <button class="btn pri" id="lBtn">دخول</button>
    </div>
  </div>

  <div id="app" style="display:none">
    <div class="chead">
      <div class="lead">
        <h1>نظام الشكاوى والتصعيد «صوت» <span class="exb">كل الشكاوى</span></h1>
        <p>كل الشكاوى المُسجَّلة في المنصة ببياناتها الكاملة: القسم والمشروع والموظف واللوحة والمبلغ والصور والمسار والمحادثة.</p>
      </div>
      <div class="acts">
        <span class="who" id="meName"></span>
        <button class="btn ghost" id="refreshBtn">↻ تحديث</button>
        <button class="btn ghost" id="logoutBtn">خروج</button>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="toolbar">
      <div class="search"><span class="ic">🔍</span>
        <input id="q" placeholder="ابحث برقم الشكوى، العنوان، الموظف، الإقامة، المشروع، اللوحة…"></div>
      <select class="fsel" id="fDept"><option value="">كل الأقسام</option>
        <option value="veh">المركبات</option><option value="house">السكن</option>
        <option value="finance">المالية</option><option value="hr">التوظيف</option></select>
      <select class="fsel" id="fProj"><option value="">كل المشاريع</option></select>
      <select class="fsel" id="fSt"><option value="">كل الحالات</option>
        <option value="open">جديدة</option><option value="prog">قيد المعالجة</option>
        <option value="esc">مُصعّدة</option><option value="done">منجزة</option></select>
    </div>

    <div class="cols">
      <div class="clist" id="clist"></div>
      <div class="panel" id="panel"></div>
    </div>

    <div class="foot">صوت · كل البيانات حيّة من قاعدة المنصة · AFMCO</div>
  </div>

  <div class="viewer" id="viewer"><img id="viewerImg" src="" alt=""></div>

<script>
(function(){
  var SB='https://coueubvyaokyycqpmirs.supabase.co';
  var KEY='sb_publishable_OmxwJmaYvjGhC5S-VcjwHQ_atz1gleF';
  var TOKEN=null;
  var DATA=[], sel=null, q='', fDept='', fProj='', fSt='', kpi='';
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};

  var DEPTICON={veh:'🚗',house:'🏠',finance:'💵',hr:'👷'};
  var PRIO={urgent:{l:'عاجل',c:'p-urgent'},high:{l:'عالي',c:'p-high'},med:{l:'متوسط',c:'p-med'},low:{l:'منخفض',c:'p-low'}};
  var stCls=function(s){return {open:'open',prog:'prog',esc:'esc',done:'done'}[s]||'open';};
  var stLbl=function(s){return {open:'جديدة',prog:'قيد المعالجة',esc:'مُصعّدة',done:'منجزة'}[s]||s;};
  function pendingOf(d){ return d.resolved_at && d.status!=='done'; }

  function fmt(ts){ if(!ts) return ''; try{ return new Date(ts).toLocaleString('ar-EG',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''+ts; } }
  function initials(n){ n=(n||'').trim(); return n?n[0]:'؟'; }

  // ── الجلسة ──
  function readStored(){
    try{ var s=JSON.parse(localStorage.getItem('soot_all_session')||'null'); if(s&&s.access_token&&s.expires_at>Date.now()+30000) return s.access_token; }catch(e){}
    try{ var w=JSON.parse(localStorage.getItem('wfsb_session')||'null'); if(w&&w.access_token&&(!w.expires_at||w.expires_at>Date.now()+30000)) return w.access_token; }catch(e){}
    return null;
  }
  function api(method, path, body){
    var h={apikey:KEY, Authorization:'Bearer '+TOKEN};
    if(body){ h['Content-Type']='application/json'; }
    if(method!=='GET'){ h['Prefer']='return=representation'; }
    return fetch(SB+'/rest/v1/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined})
      .then(function(r){ return r.text().then(function(t){ var j=null; try{j=t?JSON.parse(t):null;}catch(e){}
        if(r.status===401){ TOKEN=null; localStorage.removeItem('soot_all_session'); showLogin(''); throw new Error('انتهت الجلسة'); }
        if(!r.ok) throw new Error((j&&j.message)||('خطأ '+r.status)); return j; }); });
  }
  function doLogin(email, pass){
    return fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error_description||j.msg||'بيانات الدخول غير صحيحة'); return j; }); })
      .then(function(j){ TOKEN=j.access_token;
        try{ localStorage.setItem('soot_all_session', JSON.stringify({access_token:j.access_token, expires_at:Date.now()+(j.expires_in||3600)*1000})); }catch(e){}
        return j; });
  }

  function showLogin(msg){ $('loader').style.display='none'; $('app').style.display='none'; $('login').style.display='flex'; $('lErr').textContent=msg||''; }
  function showApp(){ $('login').style.display='none'; $('loader').style.display='none'; $('app').style.display='block'; }

  // ── التحميل ──
  function loadAll(){
    $('loader').style.display='flex'; $('loader').textContent='جارٍ تحميل الشكاوى…';
    return api('GET','v_complaints?select=*&order=created_at.desc')
      .then(function(rows){ DATA=rows||[]; buildProjOptions(); showApp(); render(); })
      .catch(function(e){ if(TOKEN) { $('loader').textContent='تعذّر التحميل: '+e.message; } });
  }
  function buildProjOptions(){
    var seen={}, opts=['<option value="">كل المشاريع</option>'];
    DATA.forEach(function(d){ var k=d.project_code; if(k&&!seen[k]){ seen[k]=1; opts.push('<option value="'+esc(k)+'">'+esc(d.project_name||k)+'</option>'); } });
    $('fProj').innerHTML=opts.join('');
  }

  function match(d){
    if(fDept && d.department_code!==fDept) return false;
    if(fProj && d.project_code!==fProj) return false;
    if(fSt && d.status!==fSt) return false;
    if(kpi==='overdue' && !d.overdue) return false;
    if(kpi==='urgent' && !(d.status!=='done'&&d.priority==='urgent')) return false;
    if(kpi==='open' && d.status==='done') return false;
    if(kpi==='esc' && d.status!=='esc') return false;
    if(kpi==='done' && d.status!=='done') return false;
    if(kpi==='pending' && !pendingOf(d)) return false;
    if(q){ var s=q.trim().toLowerCase();
      var hay=[d.title,d.code,d.project_name,d.project_code,d.emp_name,d.emp_iqama,d.category_label,d.department_name,d.plate,stLbl(d.status)].join(' ').toLowerCase();
      if(hay.indexOf(s)<0) return false; }
    return true;
  }
  function renderKpis(){
    var act=DATA.filter(function(d){return d.status!=='done';});
    var over=DATA.filter(function(d){return d.overdue;}).length;
    var urg=act.filter(function(d){return d.priority==='urgent';}).length;
    var escN=DATA.filter(function(d){return d.status==='esc';}).length;
    var pend=DATA.filter(pendingOf).length;
    var done=DATA.filter(function(d){return d.status==='done';}).length;
    var cards=[
      ['red','overdue',over,'تجاوز المهلة','⏰'],['amber','urgent',urg,'عاجلة نشطة','🔴'],
      ['green','open',act.length,'مفتوحة','📂'],['violet','esc',escN,'مُصعّدة','⬆'],
      ['gold','pending',pend,'بانتظار التأكيد','⏳'],['','done',done,'منجزة','✅']
    ];
    $('kpis').innerHTML=cards.map(function(k){
      return '<div class="kpi '+k[0]+(kpi===k[1]?' on':'')+'" data-k="'+k[1]+'"><span class="t">'+k[4]+'</span><div class="n">'+k[2]+'</div><div class="l">'+k[3]+'</div></div>';
    }).join('');
    Array.prototype.forEach.call($('kpis').querySelectorAll('.kpi'),function(el){
      el.onclick=function(){ var k=el.getAttribute('data-k'); kpi=(kpi===k)?'':k; render(); };
    });
  }
  function renderList(){
    var list=DATA.filter(match);
    $('clist').innerHTML = !list.length ? '<div class="noRes">ما في نتائج تطابق البحث 🔍</div>' :
      list.map(function(d){ var p=PRIO[d.priority]||PRIO.med; var pend=pendingOf(d);
        return '<div class="crow '+p.c+(sel===d.id?' sel':'')+'" data-id="'+d.id+'">'+
          '<div class="pbar"></div>'+
          '<div class="ava">'+(DEPTICON[d.department_code]||'🗂')+'</div>'+
          '<div class="mid">'+
            '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center">'+
              '<div class="tt">'+esc(d.title)+'</div>'+
              '<div class="st '+(pend?'pend':stCls(d.status))+'">'+(pend?'⏳ تأكيد الموظف':stLbl(d.status))+'</div></div>'+
            '<div class="mt">'+
              '<span class="chip proj">📁 '+esc(d.project_name||d.project_code||'—')+'</span>'+
              '<span class="chip dept">'+(DEPTICON[d.department_code]||'🗂')+' '+esc(d.department_name||'')+' · '+esc(d.category_label||d.category||'')+'</span>'+
              (d.plate?'<span class="chip">🚗 '+esc(d.plate)+'</span>':'')+
              (d.amount!=null?'<span class="chip amt">💰 '+esc(String(d.amount))+' ر.س</span>':'')+
              (d.photos&&d.photos.length?'<span class="chip">📷 '+d.photos.length+'</span>':'')+
              '<span>👤 '+esc(d.emp_name||'—')+(d.emp_iqama?' · '+esc(d.emp_iqama):'')+'</span>'+
              '<span>'+esc(d.code)+'</span>'+
              '<span class="'+(d.overdue?'ov':'')+'">'+(d.overdue?'⚠️ تجاوز المهلة':'⏱ '+fmt(d.created_at))+'</span>'+
            '</div></div></div>';
      }).join('');
    Array.prototype.forEach.call($('clist').querySelectorAll('.crow'),function(r){ r.onclick=function(){ sel=r.dataset.id; openDetail(sel); }; });
  }

  var DETAIL={};
  function openDetail(id){
    render();
    $('panel').innerHTML='<div class="empty"><div class="big">⏳</div>جارٍ تحميل التفاصيل…</div>';
    Promise.all([
      api('GET','complaint_events?complaint_id=eq.'+id+'&order=created_at.asc&select=*').catch(function(){return [];}),
      api('GET','complaint_messages?complaint_id=eq.'+id+'&order=created_at.asc&select=*').catch(function(){return [];}),
      api('GET','complaint_watchers?complaint_id=eq.'+id+'&select=*').catch(function(){return [];})
    ]).then(function(a){ DETAIL={events:a[0]||[],msgs:a[1]||[],watchers:a[2]||[]}; renderPanel(); });
  }

  function renderPanel(){
    var d=DATA.find(function(x){return x.id===sel;});
    if(!d){ $('panel').innerHTML='<div class="empty"><div class="big">🗂</div>اختر شكوى من القائمة لعرض كل بياناتها ومسارها والمحادثة.</div>'; return; }
    var p=PRIO[d.priority]||PRIO.med; var pend=pendingOf(d);
    var photos=(d.photos&&d.photos.length)?'<div class="sect"><h4>📷 المرفقات ('+d.photos.length+')</h4><div class="ph-row">'+
      d.photos.map(function(u){return '<img src="'+esc(u)+'" data-u="'+esc(u)+'">';}).join('')+'</div></div>':'';
    var evs=DETAIL.events||[], msgs=DETAIL.msgs||[], wats=DETAIL.watchers||[];
    var EK={created:'📝',commented:'💬',routed:'🔀',escalated:'⬆',resolved:'✅',reopened:'↩'};
    $('panel').innerHTML=
      '<div class="ph"><div class="t">'+esc(d.title)+'</div>'+
        '<div class="s">'+esc(d.code)+' · 📁 '+esc(d.project_name||d.project_code||'—')+' · '+esc(d.department_name||'')+' / '+esc(d.category_label||d.category||'')+'</div></div>'+
      '<div class="pb">'+
        '<div class="sect"><div style="display:flex;gap:6px;flex-wrap:wrap">'+
          '<span class="st '+(pend?'pend':stCls(d.status))+'">'+(pend?'⏳ بانتظار تأكيد الموظف':stLbl(d.status))+'</span>'+
          '<span class="chip">'+(d.overdue?'⚠️ تجاوز المهلة':'الأولوية: '+p.l)+'</span>'+
          '<span class="chip">👤 '+esc(d.emp_name||'—')+'</span>'+
          (d.emp_iqama?'<span class="chip">🆔 '+esc(d.emp_iqama)+'</span>':'')+
          (d.plate?'<span class="chip">🚗 '+esc(d.plate)+'</span>':'')+
          (d.amount!=null?'<span class="chip amt">💰 '+esc(String(d.amount))+' ر.س</span>':'')+
          (d.location?'<span class="chip">📍 '+esc(d.location)+'</span>':'')+
          (d.to_maintenance?'<span class="chip">🔧 تطبيق الصيانة</span>':'')+
          (d.to_watheeq?'<span class="chip">📑 وثيق</span>':'')+
        '</div>'+ (d.description?'<div style="margin-top:9px;font-size:12.5px;line-height:1.6">'+esc(d.description)+'</div>':'') +'</div>'+
        photos+
        '<div class="sect"><h4>🔀 مسار الشكوى</h4><div class="route">'+
          (evs.length?evs.map(function(e){ return '<div class="rnode"><div class="ic">'+(EK[e.kind]||'•')+'</div>'+
            '<div class="tx"><div class="t">'+esc(e.note||e.kind)+'</div>'+
            '<div class="d">'+esc(e.actor_name||'')+(e.actor_kind?' · '+esc(e.actor_kind):'')+'</div>'+
            (e.created_at?'<div class="tm">🕐 '+fmt(e.created_at)+'</div>':'')+'</div></div>'; }).join('')
            :'<div style="color:var(--muted);font-size:12px">لا أحداث.</div>')+
        '</div></div>'+
        (wats.length?'<div class="sect"><h4>👁 المتابعون ('+wats.length+')</h4><div class="ph-row" style="gap:6px">'+
          wats.map(function(w){return '<span class="chip">'+esc(w.watcher_ref||w.watcher_kind||'')+'</span>';}).join('')+'</div></div>':'')+
        '<div class="sect"><h4>💬 المحادثة</h4>'+
          (msgs.length?msgs.map(function(m){ var emp=m.author_kind==='employee';
            return '<div class="msg '+(emp?'emp':'me')+'"><div class="a">'+initials(m.author_name||(emp?'م':'أ'))+'</div>'+
              '<div class="bu"><div class="wn">'+esc(m.author_name||(emp?'الموظف':'المسؤول'))+'<span>'+fmt(m.created_at)+'</span></div>'+
              '<div class="tx">'+esc(m.body)+'</div></div></div>'; }).join('')
            :'<div style="color:var(--muted);font-size:12px">لا رسائل بعد.</div>')+
        '</div>'+
      '</div>'+
      (d.status!=='done'?
        '<div class="pacts">'+
          (pend?'':'<button class="btn gold" data-act="esc">⬆ تصعيد</button><button class="btn ghost" data-act="resolve">✓ تم الحل</button>')+
          (pend?'<div class="chip" style="flex:1;justify-content:center;padding:10px">⏳ بانتظار تأكيد الموظف لإغلاق الشكوى</div>':'')+
        '</div>'+
        '<div class="reply"><input id="rin" placeholder="اكتب ردّك للموظف…"><button class="s" data-act="reply">➤</button></div>'
      :'');
    Array.prototype.forEach.call($('panel').querySelectorAll('[data-act]'),function(b){ b.onclick=function(){ act(b.getAttribute('data-act')); }; });
    Array.prototype.forEach.call($('panel').querySelectorAll('.ph-row img'),function(im){ im.onclick=function(){ $('viewerImg').src=im.getAttribute('data-u'); $('viewer').classList.add('on'); }; });
    var rin=$('rin'); if(rin) rin.onkeydown=function(e){ if(e.key==='Enter') act('reply'); };
  }

  function act(kind){
    var d=DATA.find(function(x){return x.id===sel;}); if(!d) return;
    var p;
    if(kind==='reply'){ var i=$('rin'); if(!i||!i.value.trim()) return; p=api('POST','rpc/sup_reply',{p_complaint:d.id,p_body:i.value.trim()}); }
    else if(kind==='esc'){ p=api('POST','rpc/sup_escalate',{p_complaint:d.id,p_note:'تصعيد للإدارة'}); }
    else if(kind==='resolve'){ p=api('POST','rpc/sup_resolve',{p_complaint:d.id,p_note:'تم الحل'}); }
    else return;
    p.then(function(){ return refresh(); }).then(function(){ openDetail(d.id); })
     .catch(function(e){ alert(e.message||'تعذّر تنفيذ العملية'); });
  }

  function refresh(){ return api('GET','v_complaints?select=*&order=created_at.desc').then(function(rows){ DATA=rows||[]; render(); }); }
  function render(){ renderKpis(); renderList(); if(!DATA.find(function(x){return x.id===sel;})){ renderPanel(); } }

  // ── الأحداث العامة ──
  $('q').oninput=function(e){ q=e.target.value; renderList(); };
  $('fDept').onchange=function(e){ fDept=e.target.value; renderList(); };
  $('fProj').onchange=function(e){ fProj=e.target.value; renderList(); };
  $('fSt').onchange=function(e){ fSt=e.target.value; renderList(); };
  $('refreshBtn').onclick=function(){ refresh(); };
  $('logoutBtn').onclick=function(){ TOKEN=null; try{localStorage.removeItem('soot_all_session');}catch(e){} showLogin(''); };
  $('lBtn').onclick=function(){ var em=$('lEmail').value.trim(), ps=$('lPass').value;
    if(!em||!ps){ $('lErr').textContent='أدخل البريد وكلمة المرور'; return; }
    $('lErr').textContent='جارٍ الدخول…';
    doLogin(em,ps).then(function(){ loadAll(); }).catch(function(e){ $('lErr').textContent=e.message; }); };
  $('lPass').onkeydown=function(e){ if(e.key==='Enter') $('lBtn').click(); };
  $('viewer').onclick=function(){ $('viewer').classList.remove('on'); };

  // بدء: جرّب جلسة محفوظة
  TOKEN=readStored();
  if(TOKEN){ loadAll().catch(function(){ showLogin(''); }); }
  else { showLogin(''); }
})();
</script>
</body>
</html>
