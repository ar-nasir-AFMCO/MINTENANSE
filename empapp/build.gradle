plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.afmco.emp'
    compileSdk 34
    defaultConfig {
        applicationId "com.afmco.soot.employee"
        minSdk 24
        targetSdk 34
        versionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName = (System.getenv("VERSION_NAME") ?: "1.0")
    }
    signingConfigs {
        afmco {
            def ks = rootProject.file("keystore/afmco-soot.jks")
            if (ks.exists()) {
                storeFile ks
                storePassword "afmco2026"
                keyAlias "afmco"
                keyPassword "afmco2026"
            }
        }
    }
    buildFeatures { compose true }
    buildTypes {
        debug { if (rootProject.file("keystore/afmco-soot.jks").exists()) signingConfig signingConfigs.afmco }
        release { if (rootProject.file("keystore/afmco-soot.jks").exists()) signingConfig signingConfigs.afmco }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
