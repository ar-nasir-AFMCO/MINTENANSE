name: build-soot-apk
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'soot/**'
      - '.github/workflows/soot.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build صوت APK
        run: gradle :soot:assembleDebug --no-daemon --stacktrace
      - name: Prepare artifact
        run: cp soot/build/outputs/apk/debug/soot-debug.apk soot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: soot-apk
          path: soot.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: soot-latest
          name: "صوت — تطبيق الشكاوى (APK)"
          body: "تطبيق صوت للجوال — نسخة تجريبية. نزّل soot.apk وثبّته على الأندرويد."
          files: soot.apk
