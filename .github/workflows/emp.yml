name: build-emp-apk
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'empapp/**'
      - 'keystore/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/emp.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: "1.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore from secret
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/afmco-soot.jks
            echo "keystore restored for signing"
          else
            echo "no KEYSTORE_B64 secret set — falling back to default debug signing"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      - name: Build تطبيق الموظف
        run: gradle :empapp:assembleDebug --no-daemon --stacktrace
      - name: Prepare artifact
        run: cp empapp/build/outputs/apk/debug/empapp-debug.apk soot-employee.apk
      - name: Generate version manifest
        run: |
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "1.${{ github.run_number }}", "url": "https://github.com/${{ github.repository }}/releases/download/emp-latest/soot-employee.apk", "notes": "تحديث تطبيق الموظف"}' > emp-version.json
          cat emp-version.json
      - uses: actions/upload-artifact@v4
        with:
          name: soot-employee-apk
          path: soot-employee.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: emp-latest
          name: "صوت — تطبيق الموظف (APK)"
          body: "تطبيق الموظف الأصلي (Kotlin/Compose) مربوط بقاعدة وثيق، ثلاث لغات، تحديث ذاتي. نسخة تجريبية."
          files: |
            soot-employee.apk
            emp-version.json
