name: build-sup-apk
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'supapp/**'
      - 'settings.gradle'
      - '.github/workflows/sup.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build تطبيق المشرف
        run: gradle :supapp:assembleDebug --no-daemon --stacktrace
      - name: Prepare artifact
        run: cp supapp/build/outputs/apk/debug/supapp-debug.apk soot-supervisor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: soot-supervisor-apk
          path: soot-supervisor.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sup-latest
          name: "صوت — تطبيق المشرف (APK)"
          body: "تطبيق المشرف الأصلي (Kotlin/Compose) — دخول بحساب المنصة، مربوط بقاعدة وثيق. نسخة تجريبية."
          files: soot-supervisor.apk
